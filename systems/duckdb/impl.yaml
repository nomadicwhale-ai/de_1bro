duckdb:
  track: S
  variant: default
  cmd: ["python3", "systems/duckdb/bench.py"]
  toolchain: {name: duckdb, version_cmd: ["python3", "-c", "import duckdb;print(duckdb.__version__)"]}
  flags: "python duckdb, PRAGMA threads=--threads"
  ops: [OP01, OP03, OP04, OP05, OP10, OP15, OP19, OP21, OP22]
  threads: [1, 4]
  modes: [streaming, materialized]
  input: parquet
