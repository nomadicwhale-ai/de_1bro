java:
  track: L
  variant: stdlib
  build: ["bash", "-c", "mkdir -p languages/java/build && javac -d languages/java/build languages/java/src/*.java"]
  cmd: ["java", "-Xmx6g", "-XX:+UseSerialGC", "-cp", "languages/java/build", "Bench"]
  toolchain: {name: java, version_cmd: ["bash", "-c", "java -version 2>&1 | grep -v '^Picked up' | head -1"]}
  flags: "javac; java -Xmx6g -XX:+UseSerialGC"
  ops: [OP01, OP03, OP04, OP05, OP06, OP07, OP08, OP09, OP10, OP15, OP19, OP21, OP22]
  threads: [1]
  modes: [streaming, materialized]
  input: csv
