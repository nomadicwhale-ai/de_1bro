- id: dynamic_list
  title: Dynamic list / vector
  category: collections
  description: A growable sequence with amortized O(1) append.
  cells:
    cpp:
      type_name: std::vector<T> (also std::deque<T>, std::list<T> linked list)
      size_bytes: vector object 24 bytes (3 pointers) + capacity * sizeof(T) on heap; growth factor 2 (libstdc++/libc++) or 1.5 (MSVC)
      width: variable
      null_support: none (vector<optional<T>>)
      primitive_or_object: class with heap buffer (value semantics)
      de_use: Row buffers, column chunks
      conversion_risks: push_back reallocation invalidates iterators, pointers and references; reserve() avoids reallocs; vector<bool> is a special proxy container
      precision_limits: N/A
      performance_notes: Contiguous; reserve + emplace_back is the fast path; std::list is cache-hostile
    rust:
      type_name: Vec<T>, VecDeque<T>, LinkedList<T>, SmallVec (crate)
      size_bytes: Vec 24 bytes (ptr, capacity, length) + heap buffer; growth doubles (minimum capacity 4 for small T)
      width: variable
      null_support: none (Vec<Option<T>>)
      primitive_or_object: heap-allocated owned buffer
      de_use: Row buffers, column chunks
      conversion_risks: Index out of range panics; borrow checker prevents mutation during iteration; Vec<char> uses 4 bytes per char
      precision_limits: N/A
      performance_notes: Contiguous; with_capacity avoids reallocation
    java:
      type_name: ArrayList<E> (also LinkedList<E>, ArrayDeque<E>, Vector<E> legacy)
      size_bytes: ArrayList object ~24 bytes + Object[] (16 header + 4 per reference) + element objects; growth 1.5x; default capacity 10
      width: variable
      null_support: allows null elements
      primitive_or_object: heap objects; boxed elements
      de_use: Row buffers
      conversion_risks: List<Integer> boxes every element (about 16 bytes object + 4 reference); ConcurrentModificationException on structural modification during iteration; remove(int) vs remove(Object) overload trap with Integer
      precision_limits: N/A
      performance_notes: Boxing hurts cache and GC; use primitive arrays or fastutil/Eclipse Collections for large numeric lists
    csharp:
      type_name: List<T> (also LinkedList<T>, Queue<T>), ImmutableArray<T>
      size_bytes: List object ~32 bytes + T[] (24 header + n * sizeof(T)); value-type T stored inline; growth doubles
      width: variable
      null_support: none (List<int?>)
      primitive_or_object: heap objects; elements inline for value types
      de_use: Row buffers
      conversion_risks: InvalidOperationException if modified during enumeration; List<T> is not thread-safe; CollectionsMarshal.AsSpan avoids copies; capacity growth can cause LOH allocations
      precision_limits: N/A
      performance_notes: Contiguous for value types; reference types add pointer hops
    go:
      type_name: 'Slice []T (header 24 bytes: pointer, length, capacity); append grows (doubling until 256 elements then about 1.25x plus 192 since Go 1.18)'
      size_bytes: 24-byte header + backing array n * sizeof(T)
      width: variable
      null_support: none ([]*T with nil or parallel []bool)
      primitive_or_object: slice header value over a heap array
      de_use: Row buffers, column chunks
      conversion_risks: append may or may not reallocate so aliased slices can diverge unexpectedly; sub-slices keep the whole backing array alive; passing slices shares data; nil slice vs empty slice
      precision_limits: N/A
      performance_notes: Contiguous; pre-size with make([]T, 0, n)
    python:
      type_name: list (heterogeneous dynamic array of object references); array.array for compact typed values; collections.deque
      size_bytes: list object 56 bytes empty + 8 per slot pointer (over-allocates about 12.5%) plus the element objects (28+ bytes per int, 24 per float)
      width: variable
      null_support: allows None
      primitive_or_object: heap object holding pointers
      de_use: Row-wise data, small collections
      conversion_risks: list of ints uses about 36 bytes per element vs 8 in numpy; list.append amortized O(1) but insert(0) is O(n); copying lists is shallow (aliasing of nested objects); sorting is stable (Timsort)
      precision_limits: N/A
      performance_notes: Pointer-chasing, high per-element overhead; use numpy/pyarrow for columnar work
    javascript:
      type_name: Array (dynamic; engines choose packed/holey SMI, double or generic element kinds), typed arrays are fixed
      size_bytes: 'unverified: Array object header (tens of bytes) + 8 bytes per element slot (4 with pointer compression: V8, unverified); unboxed doubles in double-kind arrays'
      width: variable
      null_support: allows null/undefined
      primitive_or_object: object
      de_use: Row-wise JSON data
      conversion_risks: sort() defaults to string comparison ([10,9,1].sort() gives [1,10,9]); holes and length assignment truncate; pushing mixed types deoptimizes element kind; large arrays > 2^32-1 invalid
      precision_limits: N/A
      performance_notes: Packed SMI/double arrays are fast; holey or dictionary-mode arrays are slow
    typescript:
      type_name: Array<T> / T[] (compile-time element type only); ReadonlyArray<T>
      size_bytes: 'unverified: Array object header (tens of bytes) + 8 bytes per element slot (4 with pointer compression: V8, unverified); unboxed doubles in double-kind arrays'
      width: variable
      null_support: allows null/undefined
      primitive_or_object: object
      de_use: Row-wise JSON data
      conversion_risks: '^ (element types are not checked at runtime: JSON.parse results typed as T[] may contain anything)'
      precision_limits: N/A
      performance_notes: Packed SMI/double arrays are fast; holey or dictionary-mode arrays are slow
    julia:
      type_name: Vector{T} (= Array{T,1}); push!, append!, resize!; Memory/MemoryRef underneath (1.11+)
      size_bytes: 'unverified: Array object about 40 bytes header (unverified) + n * sizeof(T) for isbits T, or n pointers for heap types; growth is over-allocation'
      width: variable
      null_support: Vector{Union{T,Missing}} or Vector{Union{T,Nothing}}
      primitive_or_object: heap object; isbits elements stored inline
      de_use: Column buffers (DataFrames.jl columns are Vectors)
      conversion_risks: 'Vector{Any} (abstract element type) boxes everything: type-instability pitfalls; 1-based indexing; slicing copies unless @view'
      precision_limits: N/A
      performance_notes: Concrete isbits eltype gives contiguous SIMD-friendly storage; abstract eltype is slow
    swift:
      type_name: Array<T> ([T]); ContiguousArray<T>; Deque in swift-collections
      size_bytes: 'unverified: 8-byte reference to heap buffer with 32-byte header (unverified) + n * stride; growth doubles; copy-on-write'
      width: variable
      null_support: none (Optional elements)
      primitive_or_object: value type with CoW heap buffer
      de_use: Row buffers
      conversion_risks: 'Value semantics with lazy copy: a copy is O(1) until mutated; append on a shared buffer copies entire array; index out of range traps; [Int] is stride 8 contiguous (no boxing)'
      precision_limits: N/A
      performance_notes: Contiguous; NSArray bridging on Apple platforms can box
    kotlin:
      type_name: MutableList<T> / ArrayList<T> (java.util.ArrayList on JVM), List<T> read-only view
      size_bytes: 'Same as Java: Object[] of references; List<Int> boxes'
      width: variable
      null_support: List<T?> allows null
      primitive_or_object: heap objects; boxed elements
      de_use: Row buffers
      conversion_risks: List is a read-only interface not an immutable list (backing list may change); listOf(...) is immutable only by convention; List<Int> boxes; IntArray avoids boxing
      precision_limits: N/A
      performance_notes: Same as Java; use IntArray/LongArray for bulk numeric data
    scala:
      type_name: ArrayBuffer[T], ListBuffer, Vector[T] (persistent 32-way trie), List[T] (immutable linked list), ArraySeq
      size_bytes: 'Vector: node arrays of 32 with ~8-byte references; List: 24-32 bytes per cons cell; ArrayBuffer ~ like ArrayList; elements boxed in generics'
      width: variable
      null_support: allows null (avoid), Option elements
      primitive_or_object: heap objects; boxed elements
      de_use: Immutable pipelines; Spark/collections APIs
      conversion_risks: List.length and indexing are O(n); Vector indexing is O(log32 n) effectively constant; mutable ArrayBuffer vs immutable defaults confuse; Seq default is List
      precision_limits: N/A
      performance_notes: Immutable structural sharing allocates; ArrayBuffer for hot loops; Array for primitives
    r:
      type_name: Atomic vectors (c()), list (generic vector of SEXP); vector growth by x <- c(x, v) or x[length(x)+1] <- v
      size_bytes: 'unverified: 4/8 bytes per element + header about 48 bytes (unverified); list elements are pointers to SEXPs'
      width: variable (growth copies)
      null_support: NA sentinel / NULL in lists
      primitive_or_object: vector of values or pointers
      de_use: Columns and ragged data
      conversion_risks: Growing in a loop is O(n^2) (R >= 3.4 over-allocates on index assignment, c() still copies); lists store full objects with 56+ byte headers; copy-on-modify
      precision_limits: double exact to 2^53
      performance_notes: Preallocate with vector(mode, n); vectorized operations avoid loops
    pg:
      type_name: Array columns T[] (variable length, any dimension); ARRAY[...] constructors; array_agg
      size_bytes: 20-byte header + 8 per dimension + null bitmap if needed + elements; TOAST for large
      width: variable
      null_support: NULL elements allowed
      primitive_or_object: row-store varlena
      de_use: Tags, small repeated values; array_agg for aggregation
      conversion_risks: Whole array rewritten on update of one element; GIN index for containment; element-wise operations need unnest; array equality semantics with NULL elements
      precision_limits: N/A
      performance_notes: Cheap for small arrays; large arrays are TOASTed and costly
    duckdb:
      type_name: LIST (T[], variable length), list comprehension, list_aggregate, UNNEST
      size_bytes: 8-byte offset + 8-byte length entry per list (16 bytes) + contiguous child vector
      width: variable
      null_support: NULL lists and NULL elements (validity masks)
      primitive_or_object: columnar nested vector
      de_use: Nested columns such as tags; list aggregates
      conversion_risks: 1-based indexing; slicing with [a:b] inclusive bounds; comparing lists is lexicographic; LIST of STRUCT can be memory heavy
      precision_limits: N/A
      performance_notes: 'Child vector is contiguous: vectorized list functions'
    arrow:
      type_name: list<T> (int32 offsets), large_list<T> (int64 offsets), list_view; Parquet LIST logical type (3-level group with repetition levels)
      size_bytes: Offsets 4 bytes (list) or 8 (large_list) per list + child array + validity bitmap
      width: variable
      null_support: validity bitmap on list and on child
      primitive_or_object: columnar offsets + child array
      de_use: Interchange for nested arrays
      conversion_risks: Parquet LIST structure has legacy 2-level forms and different element names (item/element); empty list vs null list distinct; list offsets limit 2^31-1 child elements
      precision_limits: list<T> child max 2^31-1 elements
      performance_notes: Offsets enable O(1) list slicing; flat child array is vectorizable
- id: map
  title: Map / dictionary (hash and ordered)
  category: collections
  description: Key-value association; hash maps have unspecified or insertion order, ordered maps sort by key.
  cells:
    cpp:
      type_name: std::unordered_map<K,V> (hash, node-based), std::map<K,V> (ordered red-black tree), std::flat_map (C++23, sorted vector)
      size_bytes: 'unordered_map: bucket array 8 per bucket + node (next pointer 8 + key + value + optionally cached hash); map node: 32-byte overhead (3 pointers + color) + key + value'
      width: variable
      null_support: none (optional values; find returns end iterator)
      primitive_or_object: class with heap nodes
      de_use: Group-by hash tables, joins, dictionaries
      conversion_risks: operator[] inserts a default value on miss; iteration order of unordered_map is unspecified and changes on rehash; rehash invalidates iterators; std::hash for floating NaN keys never equal
      precision_limits: N/A
      performance_notes: 'Node-based layouts are cache-unfriendly: custom open-addressing tables (abseil flat_hash_map, robin_hood) are 2-5x faster'
    rust:
      type_name: HashMap<K,V> (SwissTable, randomized SipHash by default), BTreeMap<K,V> (ordered), IndexMap (crate; insertion order)
      size_bytes: 'HashMap: 1 control byte + (K,V) per slot at 7/8 max load, plus 32-48 byte header'
      width: variable
      null_support: none (get returns Option<&V>)
      primitive_or_object: heap-allocated table
      de_use: Group-by hash tables, joins
      conversion_risks: HashMap iteration order is unspecified and differs between runs (random seed); default SipHash is slower than FxHash/ahash; f64 keys need ordered wrappers; BTreeMap ordered iteration
      precision_limits: N/A
      performance_notes: SwissTable is cache-friendly; swapping the hasher (ahash/fxhash) gives large speedups
    java:
      type_name: HashMap<K,V> (hash), LinkedHashMap (insertion/access order), TreeMap (ordered, red-black), ConcurrentHashMap, EnumMap
      size_bytes: HashMap.Node ~32 bytes (header 12, hash 4, key ref 4, value ref 4, next ref 4) + table slot 4 + boxed key/value objects (~16 bytes each for Integer/Long)
      width: variable
      null_support: HashMap allows one null key and null values (ConcurrentHashMap and TreeMap do not)
      primitive_or_object: heap objects; boxed keys and values
      de_use: Group-by, dictionaries, lookup tables
      conversion_risks: HashMap iteration order is unspecified (changes with resize/JDK version); mutable keys break lookups; Map<Long, Long> boxes heavily; compute/merge for upserts; equals/hashCode contract
      precision_limits: N/A
      performance_notes: Boxed Map<Long,Long> uses 5-10x memory of primitive maps; use fastutil/Eclipse Collections/hppc for primitives
    csharp:
      type_name: Dictionary<TKey,TValue> (hash), SortedDictionary (tree), SortedList (array), ConcurrentDictionary, ImmutableDictionary
      size_bytes: 'Dictionary: buckets int[] 4 + entries struct array (hashCode 4 + next 4 + key + value) with no boxing for value types'
      width: variable
      null_support: none (TryGetValue; null keys not allowed)
      primitive_or_object: heap objects; entries inline for value types
      de_use: Group-by, dictionaries
      conversion_risks: Enumeration order matches insertion order only when no removals occur and is not guaranteed; null key throws ArgumentNullException; modifying during enumeration throws; default string comparer is ordinal but culture comparers differ
      precision_limits: N/A
      performance_notes: Struct entries are cache-friendly; CollectionsMarshal.GetValueRefOrAddDefault avoids double lookups
    go:
      type_name: map[K]V (hash; iteration order deliberately randomized); no stdlib ordered map; sync.Map
      size_bytes: 'unverified: Per entry (K + V) plus tophash byte and overflow overhead (Go 1.24+ uses Swiss tables: unverified detail); map header 48 bytes'
      width: variable
      null_support: none (v, ok := m[k]; missing key returns zero value)
      primitive_or_object: pointer to runtime hash table
      de_use: Group-by, dictionaries
      conversion_risks: Range order is randomized each iteration; concurrent map writes panic (fatal error); missing key returns zero value indistinguishable from stored zero without ok; NaN keys can never be retrieved; keys must be comparable
      precision_limits: N/A
      performance_notes: Pre-size with make(map[K]V, n); iteration cost grows with historical size; no shrink
    python:
      type_name: dict (hash; insertion-ordered since Python 3.7), collections.OrderedDict, defaultdict, Counter; no sorted dict in stdlib (sortedcontainers package)
      size_bytes: 'Empty dict 64 bytes; about 100+ bytes at small sizes; compact layout: index array + entries (hash 8 + key ptr 8 + value ptr 8 = 24 bytes per entry) plus key/value objects'
      width: variable
      null_support: allows None keys and values
      primitive_or_object: heap object
      de_use: Group-by, lookup tables, JSON-like records
      conversion_risks: Keys must be hashable (list keys raise TypeError); 1 == 1.0 == True share a key; dict ordering is insertion order guaranteed by the language since 3.7 (CPython 3.6 implementation detail); mutating during iteration raises RuntimeError
      precision_limits: N/A
      performance_notes: Fast average O(1) but per-entry overhead is large; use pandas groupby for bulk
    javascript:
      type_name: Map (insertion-ordered, any key type), plain Object (string/symbol keys, integer-like keys first in ascending order), WeakMap
      size_bytes: 'unverified: Map: hash table with insertion list; per-entry overhead tens of bytes (engine-dependent: unverified)'
      width: variable
      null_support: allows null/undefined values; key undefined allowed
      primitive_or_object: object
      de_use: Lookup tables, group-by
      conversion_risks: Plain objects iterate integer-like keys numerically first, then strings by insertion (so '10' sorts before 'a'); prototype keys ('__proto__', 'constructor') collide; JSON.stringify(Map) gives {}; Map keys use SameValueZero (NaN equals NaN)
      precision_limits: N/A
      performance_notes: Map beats Object for frequent adds/deletes; Object in dictionary mode is slower
    typescript:
      type_name: Map<K,V>, Record<K,V>, plain object index signatures
      size_bytes: 'unverified: Map: hash table with insertion list; per-entry overhead tens of bytes (engine-dependent: unverified)'
      width: variable
      null_support: allows null/undefined values; key undefined allowed
      primitive_or_object: object
      de_use: Lookup tables, group-by
      conversion_risks: ^ (Record<string,V> claims every key exists unless noUncheckedIndexedAccess is on)
      precision_limits: N/A
      performance_notes: Map beats Object for frequent adds/deletes; Object in dictionary mode is slower
    julia:
      type_name: Dict{K,V} (hash; iteration order unspecified), OrderedCollections.OrderedDict (insertion order), DataStructures.SortedDict (ordered), IdDict
      size_bytes: 'unverified: Dict header about 80 bytes (unverified) + slots (1 byte per slot flag + keys + vals arrays)'
      width: variable
      null_support: none (get with default, haskey; missing values via values)
      primitive_or_object: heap object
      de_use: Group-by, dictionaries
      conversion_risks: Dict iteration order is unspecified (insertion order often appears but is not guaranteed); Dict{Any,Any} is slow (type-unstable); hash of Float64 NaN and -0.0 follows isequal
      precision_limits: N/A
      performance_notes: Concrete K,V types give unboxed inline storage for isbits
    swift:
      type_name: Dictionary<Key,Value> (hash; iteration order varies per process because hashing is randomly seeded); OrderedDictionary in swift-collections
      size_bytes: 'unverified: Storage: bitmap + keys + values arrays; per-entry no node overhead; header about 48 bytes (unverified)'
      width: variable
      null_support: 'none (subscript returns Optional; default: parameter)'
      primitive_or_object: value type with CoW heap storage
      de_use: Group-by, dictionaries
      conversion_risks: Iteration order is not stable between runs (random seeding unless SWIFT_DETERMINISTIC_HASHING is set); Key must be Hashable; subscript assignment of nil removes the key; dictionary literal with duplicate keys crashes
      precision_limits: N/A
      performance_notes: Contiguous open-addressing storage; CoW copy on mutation of shared buffer
    kotlin:
      type_name: 'HashMap/mutableMapOf (default LinkedHashMap: insertion order), LinkedHashMap, TreeMap (JVM sorted), HashMap on JS/Native differs'
      size_bytes: 'Same as Java: Node objects + boxed entries; LinkedHashMap adds 8 bytes (before/after refs) per entry'
      width: variable
      null_support: Map<K, V?> allows null values; get returns null on miss
      primitive_or_object: heap objects; boxed keys/values
      de_use: Group-by, dictionaries
      conversion_risks: mutableMapOf() preserves insertion order (LinkedHashMap) while HashMap does not; getValue throws NoSuchElementException; null return from get is ambiguous with null value; boxed keys
      precision_limits: N/A
      performance_notes: Same as Java; use fastutil for primitive keys
    scala:
      type_name: immutable.Map (HashMap as CHAMP trie; Map1..Map4 small specializations), mutable.HashMap, LinkedHashMap, TreeMap (ordered), ListMap
      size_bytes: 'Map1..Map4: object per entry up to 4; HashMap trie nodes with arrays; boxed keys/values'
      width: variable
      null_support: none (get returns Option[V])
      primitive_or_object: heap objects; boxed keys/values
      de_use: Group-by (groupBy, groupMapReduce), lookups
      conversion_risks: Default Map is immutable (updates return new maps); iteration order is insertion order for 1 to 4 entries and hash-based beyond; mutable.Map.getOrElseUpdate preferred for caches
      precision_limits: N/A
      performance_notes: Persistent maps allocate on update; mutable.HashMap for hot loops
    r:
      type_name: 'No native hash map: named list/vector (linear lookup), environment (new.env(hash=TRUE) hashed), fastmap / hash packages; data.frame joins instead'
      size_bytes: 'unverified: environment: hashed table of SEXP bindings (about 56 bytes per binding: unverified)'
      width: variable
      null_support: NULL on missing (list); get() errors on missing environment key
      primitive_or_object: 'environment: reference object; list: copy-on-modify'
      de_use: Lookup tables via named vectors or environments
      conversion_risks: Named list lookup by name is O(n) and uses partial matching with $ (x$ab matches 'abc' unless [[ exact=TRUE ]]); environments are reference semantics (mutated in place); names must be strings; duplicate names allowed
      precision_limits: N/A
      performance_notes: environment lookups are O(1); copying large named lists is expensive
    pg:
      type_name: 'No native hash map type: hstore (extension), jsonb objects, or composite arrays; ordered via ORDER BY'
      size_bytes: hstore/jsonb varlena with sorted keys (jsonb stores keys sorted by length then bytes)
      width: variable
      null_support: NULL values allowed in hstore
      primitive_or_object: row-store varlena
      de_use: Semi-structured attributes (jsonb for attributes map<string,string>)
      conversion_risks: jsonb object key order is not preserved (sorted) and duplicate keys keep the last; hstore values are text only; no typed map
      precision_limits: N/A
      performance_notes: jsonb binary format allows O(log n) key lookup; GIN indexes for containment
    duckdb:
      type_name: MAP(K, V) (list of key/value structs; entries keep insertion order), map_keys, map_values, element_at, map_extract; STRUCT for fixed keys
      size_bytes: 'Per map: list offset + length (16 bytes) + child struct vector of keys and values'
      width: variable
      null_support: NULL maps and NULL values allowed (keys must be non-NULL)
      primitive_or_object: columnar nested vector
      de_use: Attribute maps (Dataset C attributes map string->string)
      conversion_risks: Lookup is linear in map size; duplicate keys are rejected on construction (MAP() with duplicates errors); map_extract returns a list (not scalar) in many versions; ordering is insertion order but not guaranteed semantically
      precision_limits: N/A
      performance_notes: 'Linear scans per lookup: use STRUCT or normalized key-value rows for hot lookups'
    arrow:
      type_name: map<K,V> (list<struct<key,value>> with keys_sorted flag); Parquet MAP logical type (key_value group, keys required)
      size_bytes: Offsets 4 bytes per map + key child array + item child array (+ validity)
      width: variable
      null_support: Keys non-null; values nullable
      primitive_or_object: columnar nested buffers
      de_use: Interchange for attribute maps
      conversion_risks: Keys are not guaranteed unique or sorted unless the flag says so; many readers convert to list of tuples; Parquet legacy MAP_KEY_VALUE naming differs
      precision_limits: N/A
      performance_notes: 'No hashing in the format: lookup is a scan or built-in kernel'
- id: set
  title: Set
  category: collections
  description: Unordered collection of unique elements (hash or ordered).
  cells:
    cpp:
      type_name: std::unordered_set<T> (hash), std::set<T> (ordered tree), std::flat_set (C++23), std::bitset<N> for dense small domains
      size_bytes: 'Like map without value: node-based (next ptr + element + optional hash) or tree node (32-byte overhead + element)'
      width: variable
      null_support: none
      primitive_or_object: class with heap nodes
      de_use: Distinct counts, membership tests, semi-joins
      conversion_risks: Iteration order unspecified for unordered_set; elements are immutable (const) once inserted; rehash invalidates iterators; custom types need hash and equality
      precision_limits: N/A
      performance_notes: Node-based is cache-hostile; open-addressing sets (abseil) are faster
    rust:
      type_name: HashSet<T> (hash), BTreeSet<T> (ordered), IndexSet (crate)
      size_bytes: 'Like HashMap<T, ()>: 1 control byte + element per slot at 7/8 load'
      width: variable
      null_support: none
      primitive_or_object: heap-allocated table
      de_use: Distinct counts, membership tests
      conversion_risks: Iteration order unspecified (random seed); f64 not Hash/Eq; set operations (union, intersection) return lazy iterators
      precision_limits: N/A
      performance_notes: SwissTable fast; faster hashers available
    java:
      type_name: HashSet<E> (backed by HashMap), LinkedHashSet, TreeSet, EnumSet (bit vector), Set.of (immutable)
      size_bytes: 'HashSet ~ HashMap with dummy value: Node ~32 bytes + element object (boxed Integer 16)'
      width: variable
      null_support: HashSet allows one null; Set.of and TreeSet do not
      primitive_or_object: heap objects; boxed elements
      de_use: Distinct counts, membership tests
      conversion_risks: Iteration order unspecified (Set.of order randomized per JVM run); Set.of throws on duplicates and null; mutable elements corrupt the set; boxed
      precision_limits: N/A
      performance_notes: Boxed Set<Long> is memory heavy; BitSet or primitive-specialized sets for dense ids
    csharp:
      type_name: HashSet<T>, SortedSet<T>, ImmutableHashSet<T>
      size_bytes: 'HashSet like Dictionary with no value: buckets int[] + entries (hashCode 4 + next 4 + value)'
      width: variable
      null_support: HashSet allows one null for reference types
      primitive_or_object: heap objects; entries inline for value types
      de_use: Distinct counts, membership tests
      conversion_risks: Enumeration order not guaranteed; HashSet<T> uses default equality comparer (reference equality for classes without Equals override); modification during enumeration throws
      precision_limits: N/A
      performance_notes: Inline entries for value types; UnionWith/IntersectWith efficient
    go:
      type_name: 'No set type: map[T]struct{} (zero-size values) or map[T]bool; slices.Compact for sorted dedup'
      size_bytes: 'Same as map: key + tophash overhead; struct{} value costs 0 bytes'
      width: variable
      null_support: none
      primitive_or_object: pointer to runtime hash table
      de_use: Distinct counts, membership
      conversion_risks: Iteration order randomized; no set operations (union/intersection must be hand-written); map[T]bool allows ambiguous false vs absent
      precision_limits: N/A
      performance_notes: struct{} saves memory vs bool; same costs as map
    python:
      type_name: set (mutable, hash), frozenset (immutable, hashable)
      size_bytes: 'unverified: Empty set 216 bytes on 64-bit CPython 3.12 (unverified); about 8 bytes hash + 8 bytes pointer per slot at <= 60% load plus element objects'
      width: variable
      null_support: allows None as an element
      primitive_or_object: heap object
      de_use: Distinct counts, membership tests
      conversion_risks: Iteration order is arbitrary (depends on hashes; string hashes are randomized per process via PYTHONHASHSEED, int order often looks sorted but is not guaranteed); elements must be hashable; 1 and 1.0 and True collapse into one element; set operations return new sets
      precision_limits: N/A
      performance_notes: O(1) average membership; large per-element overhead; use numpy.unique / pandas drop_duplicates for bulk
    javascript:
      type_name: 'unverified: Set (insertion-ordered, SameValueZero equality); WeakSet; new Set methods (union, intersection) in recent engines (unverified availability)'
      size_bytes: 'unverified: Hash table with insertion list; per-entry overhead tens of bytes (engine-dependent: unverified)'
      width: variable
      null_support: allows null and undefined as elements
      primitive_or_object: object
      de_use: Distinct counts, membership tests
      conversion_risks: Object elements compare by reference (two equal-looking objects are distinct); NaN equals NaN in Set; -0 and +0 are the same element; no built-in structural equality
      precision_limits: N/A
      performance_notes: Insertion order maintained at some cost; faster than Array.includes for large data
    typescript:
      type_name: Set<T>, ReadonlySet<T>
      size_bytes: 'unverified: Hash table with insertion list; per-entry overhead tens of bytes (engine-dependent: unverified)'
      width: variable
      null_support: allows null and undefined as elements
      primitive_or_object: object
      de_use: Distinct counts, membership tests
      conversion_risks: ^ (type-level only; element equality remains reference-based for objects)
      precision_limits: N/A
      performance_notes: Insertion order maintained at some cost; faster than Array.includes for large data
    julia:
      type_name: Set{T} (hash; backed by Dict{T,Nothing}), BitSet (dense integers), OrderedCollections.OrderedSet, DataStructures.SortedSet
      size_bytes: 'Like Dict with Nothing values: slot flag byte + keys array'
      width: variable
      null_support: none (Missing as element is allowed)
      primitive_or_object: heap object
      de_use: Distinct counts, membership tests
      conversion_risks: Iteration order unspecified; Set{Any} is slow; set operations union/intersect/setdiff allocate new sets; isequal semantics for NaN
      precision_limits: N/A
      performance_notes: Concrete isbits T is efficient; BitSet is compact for dense ids
    swift:
      type_name: 'Set<Element> (hash; Element: Hashable), OrderedSet in swift-collections'
      size_bytes: 'unverified: Contiguous open-addressing storage with bitmap + elements (about 48-byte header: unverified)'
      width: variable
      null_support: none (Optional elements allowed)
      primitive_or_object: value type with CoW heap storage
      de_use: Distinct counts, membership tests
      conversion_risks: Iteration order varies between runs (random hashing seed); Set.insert returns (inserted, memberAfterInsert); custom Hashable must be consistent with ==
      precision_limits: N/A
      performance_notes: Contiguous storage; CoW on mutation
    kotlin:
      type_name: 'mutableSetOf (default LinkedHashSet: insertion order), HashSet, LinkedHashSet, TreeSet (JVM)'
      size_bytes: Same as Java; LinkedHashSet adds 8 bytes per element
      width: variable
      null_support: allows null element
      primitive_or_object: heap objects; boxed elements
      de_use: Distinct counts, membership tests
      conversion_risks: Set<T> read-only interface is not immutable; setOf preserves insertion order (LinkedHashSet); boxed Int elements; distinct() returns a List
      precision_limits: N/A
      performance_notes: Same as Java
    scala:
      type_name: immutable.Set (Set1..Set4 specializations, HashSet as CHAMP trie), mutable.HashSet, TreeSet, BitSet
      size_bytes: Up to 4 elements in specialized objects; HashSet trie nodes; boxed elements
      width: variable
      null_support: none (null as element discouraged)
      primitive_or_object: heap objects; boxed elements
      de_use: Distinct counts, membership tests
      conversion_risks: Default Set is immutable; iteration order is insertion order up to 4 elements then hash-based; Set[T] is invariant in T so Set[Int] is not Set[Any]; Set apply is a membership test (s(x))
      precision_limits: N/A
      performance_notes: Persistent structure allocates on update; mutable sets for hot loops
    r:
      type_name: 'No set type: unique(), union(), intersect(), setdiff(), x %in% y on vectors; environments or fastmap for hashed membership'
      size_bytes: Vector of the elements (4 or 8 bytes each) + header
      width: variable
      null_support: NA is a valid element (NA %in% c(NA) is TRUE)
      primitive_or_object: vector of values
      de_use: Distinct counts via unique(); membership via %in% (hash-based)
      conversion_risks: unique() keeps first occurrence order; union() drops duplicates; %in% treats NA as matching NA unlike ==; factor levels are a different concept
      precision_limits: N/A
      performance_notes: 'match()/%in% build a hash table per call: repeated membership tests in loops are slow (precompute)'
    pg:
      type_name: 'No set type: DISTINCT, UNION/INTERSECT/EXCEPT operators, arrays with ANY and array_agg(DISTINCT), enum or bitstring for small domains'
      size_bytes: Query operators operate on rows; array representation as in dynamic list
      width: variable
      null_support: NULLs are considered equal in DISTINCT and set operators (unlike =)
      primitive_or_object: n/a (query semantics)
      de_use: Distinct counts via count(DISTINCT x)
      conversion_risks: DISTINCT/UNION treat NULL = NULL as duplicates; UNION removes duplicates while UNION ALL does not (sort or hash cost); count(DISTINCT) is slower than count(*)
      precision_limits: N/A
      performance_notes: HashAggregate or sort-unique chosen by planner; memory limited by work_mem
    duckdb:
      type_name: 'No set type: DISTINCT, UNION/INTERSECT/EXCEPT, list_distinct, list_intersect on LIST values, approx_count_distinct'
      size_bytes: Query operators; LIST representation as in dynamic list
      width: variable
      null_support: NULLs treated as equal in DISTINCT
      primitive_or_object: n/a (query semantics)
      de_use: Distinct counts and dedup
      conversion_risks: 'unverified: list_distinct drops NULLs (check version behavior: unverified); UNION BY NAME vs UNION positional; count(DISTINCT) memory grows with cardinality'
      precision_limits: N/A
      performance_notes: Parallel hash aggregation; approx_count_distinct (HyperLogLog) for large cardinalities
    arrow:
      type_name: 'No set type: dictionary-encoded arrays and compute kernels unique, value_counts, is_in'
      size_bytes: Dictionary array = indices (1-4 bytes) + dictionary values array
      width: variable
      null_support: validity bitmap (null is a distinct value in unique)
      primitive_or_object: columnar buffers
      de_use: Distinct values via compute.unique
      conversion_risks: pc.unique returns nulls as a distinct element; is_in treats null matching via skip_nulls option; dictionary order is first-seen, not sorted
      precision_limits: N/A
      performance_notes: Kernels use hashing in C++; zero-copy to dictionary
- id: tuple
  title: Tuple
  category: composite-types
  description: A fixed-length, possibly heterogeneous, ordered group of values (usually anonymous).
  cells:
    cpp:
      type_name: std::tuple<Ts...>, std::pair<A,B>; structured bindings (C++17)
      size_bytes: Sum of member sizes plus alignment padding (libstdc++ stores in reverse layout; sizeof(tuple<int,char>) typically 8)
      width: fixed
      null_support: none (members may be optional)
      primitive_or_object: value type
      de_use: Multi-value returns, composite map keys
      conversion_risks: Layout is implementation-defined (not equal to the equivalent struct); no default hash for tuple (need custom); std::tie creates references (dangling risk)
      precision_limits: N/A
      performance_notes: Zero overhead beyond members; template compile-time cost
    rust:
      type_name: (A, B, ...) built-in tuples; unit ()
      size_bytes: 'Layout unspecified: compiler may reorder fields (sum of sizes + padding)'
      width: fixed
      null_support: none (Option members)
      primitive_or_object: value type
      de_use: Multi-value returns, composite keys in HashMap (tuples implement Hash/Eq if members do)
      conversion_risks: Access by index .0 .1; tuples up to 12 elements implement common traits; layout may differ from a similar struct; f64 members block Eq/Hash
      precision_limits: N/A
      performance_notes: Zero-cost; copied by value
    java:
      type_name: 'No tuple type: records (JDK 16), Map.Entry, arrays, or libraries (javatuples, Apache Commons Pair)'
      size_bytes: 'Record instance: 12 header + fields (about 16-24 bytes for 2 ints)'
      width: fixed (record)
      null_support: Nullable reference components
      primitive_or_object: immutable heap object
      de_use: Composite keys via record (value-based equals/hashCode)
      conversion_risks: Arrays used as map keys use identity hashing; Map.Entry.getKey/getValue are not typed for records; boxed components
      precision_limits: N/A
      performance_notes: Heap allocation per instance; escape analysis may scalar-replace
    csharp:
      type_name: ValueTuple (T1, T2...) value type with named elements; System.Tuple<...> class (legacy); record struct
      size_bytes: 'ValueTuple: sum of members + padding; Tuple<> object: 16 header + fields'
      width: fixed
      null_support: none (members may be nullable)
      primitive_or_object: value type (ValueTuple) / heap (Tuple)
      de_use: Multi-value returns, dictionary keys
      conversion_risks: Element names are compile-time only (lost at runtime reflection); ValueTuple is mutable (careless use as dictionary key after mutation); more than 7 elements nests via TRest
      precision_limits: N/A
      performance_notes: ValueTuple has no allocation; Tuple<> allocates
    go:
      type_name: 'No tuple type: multiple return values (not a first-class value), structs, or arrays; generics-based Pair[A,B] libraries'
      size_bytes: 'Struct layout: sum of fields + padding'
      width: fixed
      null_support: none
      primitive_or_object: multiple returns are not objects; struct is a value type
      de_use: Multi-value returns (value, error); anonymous structs for ad-hoc tuples
      conversion_risks: Multiple return values cannot be stored as one value; anonymous struct types are assignable only if identical; arrays [2]T usable only for homogeneous
      precision_limits: N/A
      performance_notes: Structs are inline; multiple returns use registers
    python:
      type_name: tuple (immutable, heterogeneous), collections.namedtuple / typing.NamedTuple
      size_bytes: 40 bytes for the empty tuple (sys.getsizeof(())) + 8 per element pointer; elements are separate objects
      width: fixed (per instance)
      null_support: allows None elements
      primitive_or_object: immutable heap object
      de_use: Composite dict keys, multi-value returns, DB rows (cursor.fetchall)
      conversion_risks: Hashable only if all elements are hashable (a tuple containing a list is not); (1) is an int while (1,) is a tuple; tuple comparison is lexicographic; namedtuple fields accessible by index and name
      precision_limits: N/A
      performance_notes: Pointer array; small tuples are recycled via free lists; row-wise tuples are memory heavy compared to columns
    javascript:
      type_name: 'unverified: No tuple type: arrays used as tuples ([a, b]); Record and Tuple proposal was withdrawn (unverified)'
      size_bytes: 'unverified: Array object header + 8 per element (4 with pointer compression: unverified)'
      width: variable (arrays)
      null_support: allows null/undefined
      primitive_or_object: object
      de_use: Multi-value returns via destructuring
      conversion_risks: Arrays are mutable and compare by reference ([1,2] === [1,2] is false); not usable as Map keys by value; JSON converts to arrays
      precision_limits: N/A
      performance_notes: Short arrays allocate; object destructuring is optimized by JIT
    typescript:
      type_name: Tuple types [string, number], labeled and optional elements, readonly tuples
      size_bytes: 'unverified: Array object header + 8 per element (4 with pointer compression: unverified)'
      width: fixed (type level)
      null_support: allows null/undefined
      primitive_or_object: object
      de_use: Multi-value returns via destructuring
      conversion_risks: ^ (lengths and element types checked at compile time only; runtime value is a mutable array)
      precision_limits: N/A
      performance_notes: Short arrays allocate; object destructuring is optimized by JIT
    julia:
      type_name: Tuple{...} (immutable, heterogeneous or homogeneous NTuple{N,T}), NamedTuple (immutable with names)
      size_bytes: Sum of element sizes + padding for isbits; inline in arrays (Vector{Tuple{Int,Float64}} stores them contiguously)
      width: fixed
      null_support: none (Missing element allowed)
      primitive_or_object: immutable value type (isbits when all elements isbits)
      de_use: Multi-value returns, small records, composite keys
      conversion_risks: Tuples with non-concrete element types are boxed; very long tuples compile slowly; tuples are immutable (use a Vector or struct to mutate); 1-based index
      precision_limits: N/A
      performance_notes: 'Stack-allocated and specialized per type: no overhead when type-stable'
    swift:
      type_name: (A, B, ...) tuples, labeled tuples; not Equatable/Hashable for generic use (tuples up to 6 elements compare with ==)
      size_bytes: Sum of members + alignment; MemoryLayout<(Int8, Int64)>.size is 16
      width: fixed
      null_support: none (Optional members)
      primitive_or_object: value type
      de_use: Multi-value returns, ad-hoc grouping
      conversion_risks: Tuples cannot conform to protocols (not Hashable for Set/Dictionary keys); labels are compile-time only; unlabeled/labeled conversions are implicit
      precision_limits: N/A
      performance_notes: Inline value; no heap
    kotlin:
      type_name: Pair<A,B>, Triple<A,B,C> (data classes); destructuring; no general tuple
      size_bytes: 'Object: 12 header + 2 refs (about 24 bytes) + boxed components'
      width: fixed
      null_support: nullable components
      primitive_or_object: immutable heap object
      de_use: Multi-value returns, small keys
      conversion_risks: Only Pair and Triple exist (use data class beyond that); components box primitives (Pair<Int,Int> holds Integer objects); equals/hashCode value-based
      precision_limits: N/A
      performance_notes: Allocation and boxing per instance
    scala:
      type_name: 'unverified: TupleN (Tuple2..Tuple22; Scala 3 TupleXXL for larger), named tuples (Scala 3.7: unverified)'
      size_bytes: Tuple2 object 12 header + 2 refs (24 bytes) + boxed members; Tuple2 is @specialized for Int/Long/Double
      width: fixed
      null_support: none (Option members)
      primitive_or_object: immutable heap object
      de_use: Multi-value returns, Map entries (K -> V is a Tuple2), Spark rows in RDDs
      conversion_risks: Scala 2 arity limit 22; destructuring pattern matching; ._1 ._2 access; boxed members except specialized Tuple2 combinations
      precision_limits: N/A
      performance_notes: Allocation; specialization avoids boxing only for some combos
    r:
      type_name: 'No tuple type: list (heterogeneous vector), named list, c() for atomic vectors; data.frame row'
      size_bytes: list header + 8 bytes per element pointer; elements are full SEXPs
      width: variable
      null_support: NULL / NA elements
      primitive_or_object: vector of pointers
      de_use: Multi-value returns via list
      conversion_risks: Lists are mutable by copy; accessing x[[1]] vs x[1] (list vs element); no immutable guarantees
      precision_limits: N/A
      performance_notes: Lists of scalars have heavy per-element overhead
    pg:
      type_name: ROW(a, b, c) anonymous record; composite type for named fields; record in PL/pgSQL
      size_bytes: 'unverified: Heap-tuple-like: header 24 + fields with alignment; anonymous record values are varlena composite (unverified exact)'
      width: fixed
      null_support: NULL fields allowed
      primitive_or_object: row-store
      de_use: Row-value comparisons ((a, b) > (1, 2)), multi-column IN
      conversion_risks: Anonymous ROW() has no column names (f1, f2) and cannot be stored in a table column without a type; row comparison with NULL follows SQL rules (row-wise comparison is lexicographic)
      precision_limits: N/A
      performance_notes: Row-constructor comparisons can use multi-column indexes
    duckdb:
      type_name: Unnamed STRUCT / ROW(a, b) and tuple-like struct_pack with positional fields; STRUCT is the general case
      size_bytes: 'Struct vector: one child vector per field + validity'
      width: fixed
      null_support: NULL struct and NULL fields (validity masks)
      primitive_or_object: columnar nested vector
      de_use: Multi-column keys in joins/IN, row values
      conversion_risks: Unnamed STRUCT fields are accessed positionally (x[1]); mixing named and unnamed struct fields errors; struct comparison is lexicographic
      precision_limits: N/A
      performance_notes: 'Columnar: each field vectorized separately'
    arrow:
      type_name: 'No tuple type: struct<f0, f1> with named fields (positional names by convention); fixed_size_list for homogeneous; Parquet group'
      size_bytes: Child arrays per field + validity bitmap (no per-row packing)
      width: fixed
      null_support: validity bitmap on struct and on each child
      primitive_or_object: columnar nested buffers
      de_use: Interchange of grouped values
      conversion_risks: Field names are required; struct nulls and child nulls are independent (null struct vs struct with null fields)
      precision_limits: N/A
      performance_notes: Struct-of-arrays layout (columnar), not array-of-structs
- id: struct
  title: Struct / record
  category: composite-types
  description: 'A named-field aggregate: value-type struct or record/data class.'
  cells:
    cpp:
      type_name: struct / class (aggregate), std::pair; C++ structs are classes with public default access
      size_bytes: Sum of members + alignment padding; sizeof includes trailing padding (struct {char; int64} is 16); empty struct is 1 byte (0 with [[no_unique_address]] members)
      width: fixed
      null_support: none (members as std::optional)
      primitive_or_object: value type (stack/inline)
      de_use: Row records, POD column batches, binary layout matching
      conversion_risks: 'Field order affects padding (sort by descending alignment); padding bytes are indeterminate (memcmp/hash unsafe); #pragma pack gives unaligned access; layout is ABI-specific; not portable on disk'
      precision_limits: N/A
      performance_notes: Array-of-structs is cache-friendly for row access, struct-of-arrays for columns
    rust:
      type_name: 'struct (named, tuple, unit); #[derive(Debug, Clone, PartialEq)]; #[repr(C)] for FFI'
      size_bytes: 'Sum of fields + padding; compiler may reorder fields to minimize size unless #[repr(C)]'
      width: fixed
      null_support: none (Option fields)
      primitive_or_object: value type (stack/inline)
      de_use: Typed records, serde-based decoding
      conversion_risks: Default repr is unspecified (do not rely on layout for I/O); fields private by default; no inheritance; ownership of String fields makes structs heap-dependent
      precision_limits: N/A
      performance_notes: Reordering reduces padding; Vec<Struct> is array-of-structs
    java:
      type_name: class (mutable) or record (JDK 16+, immutable value-based equals/hashCode/toString); no value types yet (Project Valhalla pending)
      size_bytes: 12-byte header + fields + padding to 8 (record Point(int x,int y) is 24 bytes)
      width: fixed
      null_support: Nullable reference fields; primitive fields not nullable
      primitive_or_object: heap object (reference type)
      de_use: Typed rows/DTOs; JDBC mapping
      conversion_risks: Each instance is a heap object with header overhead (List<Record> is pointer-chasing); records are shallowly immutable; arrays in records compare by identity; reflection-based mappers are slow
      precision_limits: N/A
      performance_notes: Escape analysis can scalar-replace; for bulk data prefer struct-of-arrays with primitive arrays
    csharp:
      type_name: struct (value type), record struct, record (class), class
      size_bytes: 'struct: sum of fields + padding (StructLayout Sequential); class: 16 bytes overhead + fields'
      width: fixed
      null_support: none (nullable fields T?)
      primitive_or_object: value type (struct) / reference (class, record)
      de_use: Typed rows; struct for small hot data
      conversion_risks: Mutable structs are copied (modifying a copy bug, struct in List<T> element is a copy); structs over 16 bytes are costly to pass by value (use in/ref); default struct equality uses reflection for non-primitive fields unless overridden
      precision_limits: N/A
      performance_notes: Array of structs is contiguous with no per-element header
    go:
      type_name: struct { Name Type; ... } (named fields, value type; embedding for composition); struct tags for encoding
      size_bytes: Sum of fields + padding (reorder fields to reduce size); empty struct{} is 0 bytes
      width: fixed
      null_support: none (pointer fields or sql.Null*)
      primitive_or_object: value type (copied on assignment)
      de_use: Typed rows, JSON/DB mapping via tags
      conversion_risks: Copying large structs is costly (pass pointers); unexported fields skipped by encoding/json; struct comparison with == works only if all fields comparable; zero values hide missing data
      precision_limits: N/A
      performance_notes: Contiguous slices of structs; false sharing with adjacent fields across goroutines
    python:
      type_name: class with __slots__, @dataclass (frozen=True for immutability), typing.NamedTuple, TypedDict (dict at runtime)
      size_bytes: Instance with __dict__ about 48 bytes + dict 100+ bytes; with __slots__ about 16 + 8 per field; each field is a pointer to another object
      width: variable
      null_support: allows None fields
      primitive_or_object: heap object
      de_use: Typed records, config objects
      conversion_risks: dataclass does not validate types at runtime; mutable default values must use field(default_factory=...); TypedDict is just a dict at runtime; dataclass equality compares fields in order
      precision_limits: N/A
      performance_notes: Per-instance overhead is large; use columns (numpy/arrow) for bulk
    javascript:
      type_name: 'Plain object literal {a: 1, b: 2}; class instances; Object.freeze'
      size_bytes: 'Object header + 8 per property (hidden class/shape shared across objects with the same shape: V8; exact sizes engine-dependent)'
      width: variable
      null_support: allows null/undefined values
      primitive_or_object: heap object
      de_use: JSON records, row objects
      conversion_risks: Property order is insertion order (integer-like keys first); adding properties dynamically changes shape and deoptimizes; typo creates a new property silently; JSON drops undefined and functions
      precision_limits: N/A
      performance_notes: Monomorphic shapes are fast; arrays of objects have per-object overhead
    typescript:
      type_name: interface / type alias (structural), class; readonly modifiers; Record<string, T>
      size_bytes: 'Object header + 8 per property (hidden class/shape shared across objects with the same shape: V8; exact sizes engine-dependent)'
      width: variable
      null_support: allows null/undefined values
      primitive_or_object: heap object
      de_use: JSON records, row objects
      conversion_risks: '^ (interfaces are erased: no runtime validation; excess property checks only on literals)'
      precision_limits: N/A
      performance_notes: Monomorphic shapes are fast; arrays of objects have per-object overhead
    julia:
      type_name: struct (immutable, isbits when all fields are isbits), mutable struct (heap-allocated)
      size_bytes: 'Sum of fields + padding for immutable isbits; mutable struct: 8-byte header + fields'
      width: fixed
      null_support: fields may be Union{T,Missing}
      primitive_or_object: value type (immutable) / heap object (mutable)
      de_use: Typed rows, numeric records
      conversion_risks: Array of immutable isbits structs is stored inline contiguously; mutable structs are boxed and heap-allocated per element; abstract field types (Any) defeat performance; struct fields cannot be changed (rebuild or use Accessors.jl)
      precision_limits: N/A
      performance_notes: Immutable isbits structs are as fast as primitives; type-stable code needed
    swift:
      type_name: struct (value type, memberwise init), Codable
      size_bytes: Sum of fields + alignment; MemoryLayout<T>.size/stride/alignment differ (stride rounds up to alignment)
      width: fixed
      null_support: Optional fields
      primitive_or_object: value type
      de_use: Typed rows, Codable JSON decoding
      conversion_risks: Mutating a let struct is an error; copy-on-assign semantics (CoW inside for collections); Codable decoding is slow for big JSON; struct containing arrays/strings has reference-counted storage
      precision_limits: N/A
      performance_notes: Inline; no heap for POD structs; ARC traffic for reference fields
    kotlin:
      type_name: data class (equals/hashCode/copy/toString generated), regular class, value class (single field inline)
      size_bytes: 'JVM object: 12 header + fields + padding (same as Java)'
      width: fixed
      null_support: nullable fields (T?)
      primitive_or_object: heap object (value class may be unboxed)
      de_use: Typed rows/DTOs
      conversion_risks: data class copy() is shallow; properties declared in primary constructor only participate in equals; boxed numerics in nullable fields; Kotlin serialization is a separate library
      precision_limits: N/A
      performance_notes: Same as Java; value class avoids allocation for single-field wrappers
    scala:
      type_name: case class (immutable by default; equals/hashCode/copy/pattern matching), regular class
      size_bytes: 'JVM object: 12 header + fields + padding; Scala 3 opaque types for zero-cost wrappers'
      width: fixed
      null_support: Option fields or null
      primitive_or_object: heap object
      de_use: Typed rows; Spark Dataset[T] encoders
      conversion_risks: case class equality is structural; case classes may have more than 22 fields since Scala 2.12 (tuples and function types keep their own arity limits); copy() is shallow; Spark encoders require Product types
      precision_limits: N/A
      performance_notes: Heap allocation; for Spark prefer DataFrame columns
    r:
      type_name: list with named elements; data.frame (list of equal-length column vectors); S4 setClass representation; R5/R6
      size_bytes: 'List: header + 8 per element pointer + names attribute; data.frame stores columns, not rows'
      width: variable
      null_support: NA/NULL fields
      primitive_or_object: vector of pointers; attributes
      de_use: Row-like records; data.frame for tables
      conversion_risks: data.frame is column-oriented (row access builds new lists); rbind-ing rows in a loop is O(n^2); partial matching with $; S4 slots are typed but not enforced for plain lists
      precision_limits: N/A
      performance_notes: Column vectors are fast; per-row records are slow
    pg:
      type_name: Composite type (CREATE TYPE ... AS (a int, b text)) and table row types; ROW values
      size_bytes: 'Heap tuple: 23-byte header (24 aligned) + fields with alignment; per-row overhead plus 4-byte line pointer'
      width: fixed
      null_support: NULL fields (null bitmap)
      primitive_or_object: row-store
      de_use: Tables are the structs; composite columns used sparingly
      conversion_risks: Composite columns are poorly supported by many drivers; field access via (col).field syntax; cannot index fields easily without expression indexes; ALTER TYPE limited
      precision_limits: N/A
      performance_notes: Column order and alignment padding affect row width
    duckdb:
      type_name: STRUCT(name1 type1, name2 type2); struct_pack, dot access, UNNEST(struct)
      size_bytes: One child vector per field + struct validity mask
      width: fixed
      null_support: NULL struct and NULL fields independent
      primitive_or_object: columnar nested vector
      de_use: Nested records in Parquet/JSON; struct columns for grouped fields
      conversion_risks: 'unverified: Struct field names are case-insensitive; casting between structs matches by position or name depending on version (unverified); NULL struct vs struct of NULLs; large structs materialize slowly'
      precision_limits: N/A
      performance_notes: 'Fields are separate vectors (struct of arrays): fast per-field scans'
    arrow:
      type_name: 'struct<name: type, ...>; Parquet group (required/optional)'
      size_bytes: Child array per field + validity bitmap
      width: fixed
      null_support: validity bitmap on the struct and each field
      primitive_or_object: columnar nested buffers
      de_use: Nested/schema-rich interchange
      conversion_risks: Nullability of parent vs child is independent (all-null struct vs struct of all-null fields); field names must be unique in many readers; schema evolution matches by name or position depending on reader
      precision_limits: N/A
      performance_notes: Struct-of-arrays layout; reading one field avoids touching others
- id: class_object
  title: Class / object
  category: composite-types
  description: Reference-semantics objects with identity, methods and (sometimes) inheritance.
  cells:
    cpp:
      type_name: class (value semantics by default, can be heap-allocated via new/make_unique), virtual functions, inheritance
      size_bytes: sizeof = members + padding; classes with virtual functions add an 8-byte vtable pointer; no object header
      width: fixed
      null_support: none (nullptr for pointers; std::optional)
      primitive_or_object: value type unless allocated on heap
      de_use: Domain objects, operator functors
      conversion_risks: Object slicing when copying derived to base by value; rule of 3/5/0 for resource management; virtual dispatch prevents inlining; dangling pointers/references; ABI layout varies
      precision_limits: N/A
      performance_notes: No header overhead; virtual call costs a pointer indirection
    rust:
      type_name: 'No classes: struct + impl blocks + traits; dyn Trait objects; Box<T>/Rc<T>/Arc<T> for heap/shared ownership'
      size_bytes: Trait object reference is 16 bytes (data pointer + vtable pointer); Box<T> 8 bytes + heap value; Rc/Arc add 16 bytes of counters
      width: fixed
      null_support: none (Option<Box<T>>, niche)
      primitive_or_object: value type; heap via Box/Rc/Arc
      de_use: Domain objects; trait objects for plug-in behavior
      conversion_risks: No inheritance (composition + traits); dyn dispatch is dynamic with object-safety restrictions; Rc cycles leak; interior mutability via RefCell panics at runtime on conflicts
      precision_limits: N/A
      performance_notes: Static dispatch (generics) is zero-cost; dyn adds vtable indirection
    java:
      type_name: class (single inheritance + interfaces); every non-primitive is an Object; records and enums are special classes
      size_bytes: 12-byte header (mark word 8 + class pointer 4 with compressed class pointers; 16 bytes without) + fields, padded to 8 bytes; minimum object 16 bytes
      width: fixed
      null_support: Nullable reference (default null)
      primitive_or_object: heap-allocated reference type
      de_use: Domain objects, JDBC/ORM entities
      conversion_risks: Object identity vs equals (== on references); equals/hashCode contract; header overhead dominates small objects (an Integer is 16 bytes for 4 of data); finalizers deprecated; GC pressure with many small objects
      precision_limits: N/A
      performance_notes: Allocation is fast (TLAB bump) but GC scans references; escape analysis removes some allocations
    csharp:
      type_name: class (reference type; single inheritance + interfaces), record class, record struct; object is the root type
      size_bytes: 16 bytes overhead on 64-bit (8 object header + 8 method table pointer) + fields; minimum object 24 bytes
      width: fixed
      null_support: Nullable reference (default null; nullable reference types annotate)
      primitive_or_object: heap-allocated reference type
      de_use: Domain objects, EF entities
      conversion_risks: Boxing value types allocates a class instance; reference equality vs Equals; finalizers delay collection; large objects (85,000+ bytes) go to the Large Object Heap
      precision_limits: N/A
      performance_notes: Gen0 allocation is cheap; per-object header 16 bytes; avoid allocations in hot loops (struct, Span)
    go:
      type_name: 'No classes: struct + methods (value or pointer receivers) + interfaces (structural, implicit); embedding for composition'
      size_bytes: Interface value 16 bytes (type pointer + data pointer); struct value inline; pointer 8
      width: fixed
      null_support: none (nil pointer/interface; typed-nil gotcha)
      primitive_or_object: value type (struct) / pointer / interface
      de_use: Domain types and service interfaces
      conversion_risks: Value vs pointer receivers change whether methods mutate the copy; interface holding a nil pointer is not nil; no inheritance or overloading; method sets differ for T and *T
      precision_limits: N/A
      performance_notes: Escape analysis decides heap vs stack; interface calls are dynamic dispatch (not inlined unless devirtualized)
    python:
      type_name: class (everything is an object; multiple inheritance); __slots__ for compact objects; dunder methods
      size_bytes: Instance about 48 bytes (header 16 + __dict__ pointer + __weakref__) + instance dict about 100+ bytes; __slots__ instance about 16 + 8 per slot; every int/float/str inside is another object
      width: variable
      null_support: None (default for absent)
      primitive_or_object: heap-allocated object (everything)
      de_use: Domain objects, ORM models, pandas internals
      conversion_risks: Mutable default arguments shared across calls; attribute access by dict lookup (slow); GC cycles collected by the cyclic collector; id() identity vs == equality; duck typing means no static guarantees
      precision_limits: N/A
      performance_notes: Per-object overhead is the main memory cost; use __slots__, dataclass(slots=True), or columnar arrays
    javascript:
      type_name: class (prototype-based sugar), plain objects, Object.create; everything except primitives is an object
      size_bytes: 'unverified: Object header (hidden class pointer, properties/elements pointers: about 12-24 bytes in V8, engine-dependent: unverified) + in-object properties (8 or 4 bytes each)'
      width: variable
      null_support: null/undefined
      primitive_or_object: heap-allocated object
      de_use: Domain objects, JSON data
      conversion_risks: Prototype chain lookup; this binding depends on call site (lost in callbacks); private fields (#x) are not enumerable; == vs === on objects is identity; class fields vs prototype methods
      precision_limits: N/A
      performance_notes: Hidden-class stability determines speed; megamorphic call sites are slow
    typescript:
      type_name: class (with access modifiers and abstract classes; erased to JS classes), interface
      size_bytes: 'unverified: Object header (hidden class pointer, properties/elements pointers: about 12-24 bytes in V8, engine-dependent: unverified) + in-object properties (8 or 4 bytes each)'
      width: variable
      null_support: null/undefined
      primitive_or_object: heap-allocated object
      de_use: Domain objects, JSON data
      conversion_risks: '^ (private/protected are compile-time only; # fields are runtime-private; structural typing lets unrelated classes be assignable)'
      precision_limits: N/A
      performance_notes: Hidden-class stability determines speed; megamorphic call sites are slow
    julia:
      type_name: 'No classes: struct + multiple dispatch (methods belong to generic functions); abstract types for hierarchy; mutable struct as reference-like object'
      size_bytes: 'Mutable struct: 8-byte header (type tag) + fields; immutable isbits struct inline'
      width: fixed
      null_support: none (nothing/missing fields)
      primitive_or_object: heap object (mutable struct) / value (immutable struct)
      de_use: Domain types with dispatch-based behavior
      conversion_risks: No data inheritance (only abstract types have subtyping); redefining a struct requires restarting the session (or Revise); method ambiguities; type instability from abstract field types
      precision_limits: N/A
      performance_notes: 'Specialized method per concrete type: static dispatch when inferred, dynamic when not'
    swift:
      type_name: class (reference type, single inheritance, ARC), protocols with extensions; actor
      size_bytes: 16-byte header (isa pointer 8 + refcount 8) + fields
      width: fixed
      null_support: Optional reference (T?)
      primitive_or_object: heap-allocated reference type with ARC
      de_use: Domain objects, UIKit/AppKit classes
      conversion_risks: Reference cycles leak under ARC (use weak/unowned); reference vs value semantics difference between class and struct; ARC retain/release traffic costs atomic operations; protocol existential boxes are heap-allocated for large values
      precision_limits: N/A
      performance_notes: ARC is deterministic but atomic refcounts cost; final/structs devirtualize
    kotlin:
      type_name: class (final by default; open to extend), object (singleton), companion object, sealed/data classes
      size_bytes: 'JVM object: 12-byte header + fields + padding (same as Java)'
      width: fixed
      null_support: nullable references T?
      primitive_or_object: heap-allocated reference type
      de_use: Domain objects
      conversion_risks: Classes are final by default (frameworks need all-open plugin); object declarations are singletons initialized lazily; platform types from Java bypass null safety; lateinit throws if uninitialized
      precision_limits: N/A
      performance_notes: Same as Java
    scala:
      type_name: class, case class, trait, object (singleton), companion objects
      size_bytes: 'JVM object: 12-byte header + fields; objects for singleton modules add an instance field'
      width: fixed
      null_support: Option or null
      primitive_or_object: heap-allocated reference type
      de_use: Domain objects; Spark encoders
      conversion_risks: Traits with state compile to interfaces + fields; case-class inheritance is discouraged; implicit conversions hide allocations; lazy val adds synchronization/bitmap fields
      precision_limits: N/A
      performance_notes: Same as Java; lazy val has overhead
    r:
      type_name: S3 (attribute-based class on a vector), S4 (setClass, formal slots), R5 Reference Classes, R6 (package; environment-based mutable objects)
      size_bytes: S3 object is an ordinary vector with a class attribute (header about 48+ bytes plus attributes); R5/R6 objects are environments
      width: variable
      null_support: NULL / NA slots
      primitive_or_object: vectors with attributes / environments
      de_use: Model objects, data frames (S3 class), tibbles
      conversion_risks: 'S3 dispatch is by convention (no validation: class(x) <- ''foo'' is unchecked); S4 slot validation optional; R6/R5 objects have reference semantics unlike the rest of R (copy-on-modify); inheritance for S3 via class vectors'
      precision_limits: N/A
      performance_notes: Method dispatch cost is notable in tight loops; environments are cheap handles
    pg:
      type_name: 'No objects: tables, composite types, domains, table inheritance (INHERITS), extensions types; stored functions'
      size_bytes: n/a (row size as in struct)
      width: fixed
      null_support: 'NULL'
      primitive_or_object: row-store
      de_use: Relational modeling instead of objects
      conversion_risks: Table inheritance does not inherit constraints/indexes fully; object-relational features are rarely portable; JSON/jsonb for object-like documents
      precision_limits: N/A
      performance_notes: Normalize rather than nest objects for analytics
    duckdb:
      type_name: 'No objects: STRUCT, UNION (tagged union), ENUM, JSON for semi-structured values; macros for behavior'
      size_bytes: 'UNION: tag byte + member vectors'
      width: fixed
      null_support: 'NULL'
      primitive_or_object: columnar nested vector
      de_use: Nested semi-structured data
      conversion_risks: UNION members are accessed with union_extract/union_tag; JSON type is VARCHAR with validation (extension) not a native nested type
      precision_limits: N/A
      performance_notes: Struct-of-arrays layout
    arrow:
      type_name: 'No objects: struct, union (dense and sparse), dictionary, extension types (user-defined logical types over storage types); Parquet has no classes'
      size_bytes: 'Union: type-id buffer + child arrays; extension types add no overhead'
      width: fixed
      null_support: validity bitmap
      primitive_or_object: columnar nested buffers
      de_use: Extension types for UUID, JSON, geospatial
      conversion_risks: Extension types lose identity when a reader does not know them (falls back to storage type); union types are not supported by Parquet
      precision_limits: N/A
      performance_notes: Zero overhead; storage type governs cost
- id: enumeration
  title: Enumeration
  category: composite-types
  description: A closed set of named constants (possibly with associated data).
  cells:
    cpp:
      type_name: enum / enum class (scoped, C++11); underlying type defaults to int; no built-in string conversion
      size_bytes: 'Underlying integer type: enum class E : uint8_t is 1 byte; default int is 4'
      width: fixed
      null_support: none
      primitive_or_object: primitive value type
      de_use: Categorical codes as small integers
      conversion_risks: Unscoped enum implicitly converts to int; values outside enumerators are allowed for fixed-underlying enums (UB for those without fixed underlying type); no reflection for names before C++26; switch not exhaustive-checked by default
      precision_limits: N/A
      performance_notes: Free (an integer)
    rust:
      type_name: 'enum (algebraic data type: unit, tuple and struct variants), #[repr(u8)] for C-like enums, Option/Result are enums'
      size_bytes: Smallest integer that fits the discriminant for fieldless enums (1 byte up to 256 variants); data-carrying enums = largest variant + tag (niche optimization possible)
      width: fixed
      null_support: none (Option<Enum> uses spare discriminant values)
      primitive_or_object: value type
      de_use: Categorical columns (segment, event_type); state machines
      conversion_risks: 'match must be exhaustive (adding a variant breaks matches; #[non_exhaustive] otherwise); casting integer to enum requires TryFrom (unsafe transmute is UB for invalid values); serde name mapping needs attributes'
      precision_limits: N/A
      performance_notes: Tag byte + payload; matches compile to jump tables
    java:
      type_name: enum (a class with singleton instances; fields, methods, abstract methods); EnumMap/EnumSet
      size_bytes: Each constant is a heap object (~16+ bytes) allocated once; references 4 bytes; ordinal() int
      width: fixed
      null_support: Nullable reference (null enum value possible); valueOf throws IllegalArgumentException on unknown
      primitive_or_object: reference type (singletons)
      de_use: Categorical columns (segment, event_type)
      conversion_risks: switch on null enum throws NullPointerException; ordinal() is fragile for persistence (reordering breaks stored data, use name or explicit code); valueOf is case-sensitive; Enum.values() clones the array on every call
      precision_limits: N/A
      performance_notes: EnumMap/EnumSet are array/bitmask backed and very fast; reference comparison with ==
    csharp:
      type_name: enum (underlying int by default; byte/short/long possible), [Flags] enums
      size_bytes: Underlying type size (default 4; byte-based enum 1)
      width: fixed
      null_support: none (enum? Nullable)
      primitive_or_object: primitive value type (struct)
      de_use: Categorical codes, flags
      conversion_risks: 'Any integer can be cast to the enum type without validation ((Color)99 is legal: use Enum.IsDefined); Enum.ToString/Parse reflection costs; [Flags] needs power-of-two values; default(E) is 0 even if no member has 0'
      precision_limits: N/A
      performance_notes: Integer-fast; ToString allocates and uses reflection cache
    go:
      type_name: 'No enum type: named integer type + const block with iota; String() method via stringer tool'
      size_bytes: Underlying integer size (int default 8; define type Color uint8 for 1)
      width: fixed
      null_support: none (zero value is the first constant if iota starts at 0)
      primitive_or_object: primitive value type
      de_use: Categorical codes
      conversion_risks: Any value of the underlying type is valid (Color(99) compiles); no exhaustiveness check in the compiler (linters only); zero value silently becomes the first constant; JSON marshals as number unless MarshalText is implemented
      precision_limits: N/A
      performance_notes: Integer-fast
    python:
      type_name: enum.Enum, IntEnum, StrEnum (3.11), Flag
      size_bytes: Each member is a singleton object (about 48-56 bytes + members stored in class); value lookup via dict
      width: fixed
      null_support: allows None as value but not as member
      primitive_or_object: heap objects (singletons)
      de_use: Categorical columns (rarely used for bulk data; pandas Categorical or pyarrow dictionary is used instead)
      conversion_risks: Enum members compare by identity and are not equal to their raw values (except IntEnum/StrEnum); Color(5) raises ValueError for unknown values; members are not hashable-by-value across Enum classes; definition order is iteration order
      precision_limits: N/A
      performance_notes: 'Member access involves descriptor lookups: slow in tight loops; use ints or categories for bulk'
    javascript:
      type_name: 'unverified: No enum: Object.freeze({A: ''a''}), Symbol, constants; TC39 enums proposal is not shipped (unverified)'
      size_bytes: Strings or numbers (see those types)
      width: n/a
      null_support: none
      primitive_or_object: primitives or objects
      de_use: Categorical codes as strings or small integers
      conversion_risks: Freezing is shallow; no exhaustiveness checking; typos produce undefined silently; string enums bloat JSON
      precision_limits: N/A
      performance_notes: Small integer codes are cheapest
    typescript:
      type_name: enum (numeric or string; compiles to an object with reverse mapping for numerics), const enum, string-literal union types
      size_bytes: Numeric enum is a number (8 bytes at runtime); string enums are strings; union literal types are erased
      width: fixed (type level)
      null_support: none
      primitive_or_object: primitives or objects
      de_use: Categorical codes with compile-time checking
      conversion_risks: 'Numeric enums accept any number at runtime (pre-5.0 assignability: any number was assignable); reverse mapping doubles the keys of a numeric enum object; const enum is inlined and unavailable with isolatedModules; union literal types are usually preferred'
      precision_limits: N/A
      performance_notes: Small integer codes are cheapest
    julia:
      type_name: '@enum Color red green blue (subtype of Enum; base integer type Int32 by default, configurable e.g. @enum Color::UInt8 ...); symbols'
      size_bytes: 'Base integer type (default Int32: 4 bytes)'
      width: fixed
      null_support: none (Missing via Union)
      primitive_or_object: primitive isbits value type
      de_use: Categorical codes (CategoricalArrays.jl for columns)
      conversion_risks: Color(5) throws ArgumentError for invalid values; instances(Color) lists members; enum values cannot be converted implicitly with ints; names are global in the module
      precision_limits: N/A
      performance_notes: Integer-fast; CategoricalArrays store UInt32 refs plus a pool
    swift:
      type_name: enum (cases, raw values via RawRepresentable, associated values), CaseIterable
      size_bytes: 'Fieldless enum: 1 byte (up to 256 cases); with associated values: largest payload + tag'
      width: fixed
      null_support: none (Optional<Enum>)
      primitive_or_object: value type
      de_use: Categorical codes and variant types
      conversion_risks: init(rawValue:) returns nil for unknown raw values; switch must be exhaustive (use @unknown default for non-frozen enums from libraries); Codable derived raw decoding fails on unknown
      precision_limits: N/A
      performance_notes: Compact tag; indirect enums box payloads
    kotlin:
      type_name: enum class (singleton instances; entries), sealed class/interface for algebraic data types
      size_bytes: Enum constants are heap singletons; references 4 bytes; ordinal int
      width: fixed
      null_support: nullable E?
      primitive_or_object: reference type (singletons)
      de_use: Categorical codes
      conversion_risks: valueOf throws IllegalArgumentException on unknown; entries (1.9) replaces values() without allocation; persisting ordinal is fragile; when must be exhaustive when used as expression
      precision_limits: N/A
      performance_notes: Same as Java; EnumMap on JVM
    scala:
      type_name: Scala 3 enum (ADT or simple); Scala 2 Enumeration (value classes with erased types) or sealed trait + case objects
      size_bytes: Case objects are singleton heap objects; Scala 3 simple enum cases are singletons with ordinal
      width: fixed
      null_support: Option / null
      primitive_or_object: reference type (singletons)
      de_use: Categorical codes
      conversion_risks: Scala 2 Enumeration loses type safety due to erasure (Enumeration#Value type dependent) and is discouraged; sealed hierarchy gives exhaustiveness warnings; Scala 3 enum valueOf throws NoSuchElementException on unknown
      precision_limits: N/A
      performance_notes: Same as Java singletons
    r:
      type_name: factor (integer codes + levels attribute); ordered factor; no enum type
      size_bytes: 4 bytes per element (integer codes) + levels vector (character, shared) + header
      width: fixed (codes), variable (levels)
      null_support: NA code (INT_MIN); NA level handling by addNA
      primitive_or_object: vector of integer codes with attributes
      de_use: Categorical columns (segment, country); stringsAsFactors default FALSE since R 4.0
      conversion_risks: 'Values not in levels become NA with a warning; as.numeric(factor) returns codes, not the labels (classic bug: as.numeric(as.character(f))); combining factors c() behavior changed in R 4.1; level order is alphabetical by default (locale dependent)'
      precision_limits: N/A
      performance_notes: Integer codes are compact and fast for grouping; relevel/droplevels needed
    pg:
      type_name: CREATE TYPE mood AS ENUM ('sad','ok','happy')
      size_bytes: 4 bytes (OID) per value
      width: fixed
      null_support: 'NULL'
      primitive_or_object: row-store
      de_use: Categorical columns with ordering by declaration
      conversion_risks: ALTER TYPE ... ADD VALUE cannot be rolled back easily and values cannot be removed or reordered; enum labels are case-sensitive; comparison order is declaration order not alphabetical; cross-enum comparison needs casts to text
      precision_limits: N/A
      performance_notes: 4 bytes fixed regardless of label length; faster than text for grouping
    duckdb:
      type_name: ENUM('a', 'b', ...) type
      size_bytes: 1 byte (up to 256 values), 2 bytes (up to 65,536), 4 bytes beyond
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Low-cardinality categorical columns (country, category); also created automatically as dictionary-encoded Parquet read
      conversion_risks: Values not in the enum error on cast; ENUM types must be created before use and can be dropped only when unused; comparisons are in declaration order; two ENUM types are different even with the same labels
      precision_limits: N/A
      performance_notes: 'Dictionary-compressed: grouping on small ints is fast'
    arrow:
      type_name: 'dictionary<indices: intN, values: T, ordered: bool> (categorical); Parquet ENUM logical type over BYTE_ARRAY and dictionary encoding'
      size_bytes: Indices (1, 2, 4 or 8 bytes) per value + one dictionary array
      width: fixed (indices)
      null_support: validity bitmap; null can be an index null or dictionary value
      primitive_or_object: columnar buffers
      de_use: Categorical columns (interchange of country/category)
      conversion_risks: Dictionaries can differ between record batches (unification needed before comparing codes); Parquet ENUM is only an annotation over strings; readers may decode to strings
      precision_limits: N/A
      performance_notes: Dictionary encoding saves memory for low-cardinality columns
