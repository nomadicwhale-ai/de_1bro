concepts:
- id: signed_int
  title: Signed integer (8/16/32/64)
  category: integers
  description: Two's-complement signed integers of 8, 16, 32 and 64 bits.
  cells:
    cpp:
      type_name: int8_t/int16_t/int32_t/int64_t (<cstdint>; optional in the standard); plain int/long/long long have implementation-defined width
      size_bytes: 1/2/4/8 (long is 4 on LLP64 Windows, 8 on LP64 Linux/macOS)
      width: fixed
      null_support: none (std::optional<T> or sentinel)
      primitive_or_object: primitive value type
      de_use: Keys/ids/counters in hot loops; int64_t for row ids and cent amounts
      conversion_risks: Signed overflow is undefined behavior (not wrap); implicit signed/unsigned mixing converts the signed operand to unsigned; narrowing silently truncates
      precision_limits: Exact over full range; no widening to float without loss above 2^53
      performance_notes: Contiguous, vectorizable; UB on overflow lets compiler optimize but can miscompile checks
    rust:
      type_name: i8/i16/i32/i64 (also i128, isize)
      size_bytes: 1/2/4/8 (isize = pointer width)
      width: fixed
      null_support: none (Option<T>)
      primitive_or_object: primitive value type
      de_use: Ids, counters; i64 for cents; checked_/wrapping_/saturating_ methods for explicit overflow policy
      conversion_risks: Overflow panics in debug builds and wraps in release unless overflow-checks is enabled; `as` casts truncate/saturate silently (float->int saturates, NaN->0)
      precision_limits: Exact over full range
      performance_notes: Zero-cost; Vec<i64> contiguous; overflow checks add small cost in debug
    java:
      type_name: byte, short, int, long (primitives); Byte/Short/Integer/Long (boxed)
      size_bytes: 1/2/4/8 as fields/arrays; boxed Integer/Long object ~16 bytes with compressed oops (12 B header + value, 8-byte aligned)
      width: fixed
      null_support: Primitives none; boxed types can be null
      primitive_or_object: primitive; boxed wrappers are heap objects
      de_use: int/long ids and counters; avoid Integer in hot paths (use primitive arrays)
      conversion_risks: Overflow silently wraps (two's complement); Math.addExact/multiplyExact/toIntExact throw ArithmeticException; narrowing casts truncate; byte is signed (b & 0xFF for unsigned view)
      precision_limits: Exact over full range; long->double loses precision above 2^53
      performance_notes: long[] contiguous; List<Long> boxes each element (pointer chase + GC pressure); Integer cache covers -128..127 only
    csharp:
      type_name: sbyte, short, int, long (System.SByte/Int16/Int32/Int64); nint
      size_bytes: 1/2/4/8 (nint = pointer width)
      width: fixed
      null_support: none (Nullable<T> / T? wrapper)
      primitive_or_object: primitive value type (struct); boxed when cast to object
      de_use: Ids and counters; long for 64-bit keys
      conversion_risks: Arithmetic is unchecked by default (wraps) unless `checked` context or <CheckForOverflowUnderflow>; checked conversions throw OverflowException; narrowing casts truncate in unchecked context
      precision_limits: Exact over full range
      performance_notes: Value types stored inline in arrays/List<T>; boxing allocates when treated as object
    go:
      type_name: int8, int16, int32, int64, int (platform width, 64-bit on 64-bit targets)
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (pointer, sql.NullInt64, or zero value)
      primitive_or_object: primitive value type
      de_use: int64 for ids and cents; int for indexing/len
      conversion_risks: Overflow wraps by language definition (well-defined); no checked arithmetic in stdlib (math/bits.Add64 gives carry); conversions between sizes truncate silently; int width differs by platform
      precision_limits: Exact over full range
      performance_notes: Contiguous slices; no boxing except when stored in interface{} (may allocate)
    python:
      type_name: int (single type); numpy.int8/16/32/64 in the ecosystem
      size_bytes: Arbitrary-width; CPython int object is 28 bytes for small values (sys.getsizeof(1)=28 on 64-bit) plus 4 bytes per extra 30-bit digit; numpy.int64 scalar in ndarray = 8 bytes
      width: variable
      null_support: none (None object, or pandas nullable Int64 / NaN-forced float)
      primitive_or_object: heap-allocated object (small ints -5..256 cached); numpy dtype = packed values
      de_use: Scripting glue and row-wise logic; numpy/pandas/pyarrow for columnar int64
      conversion_risks: Never overflows in pure Python; numpy fixed dtypes wrap silently (arrays) and may warn (scalars); int->float conversion loses precision above 2^53; pandas upcasts int columns to float64 when NaN appears
      precision_limits: Exact for any size (cost grows with size); numpy int64 exact to 2^63-1
      performance_notes: Per-element object overhead (about 28+8 bytes in a list) makes pure-Python int lists 4-5x larger than numpy int64; interpreter dispatch dominates arithmetic
    javascript:
      type_name: number (IEEE-754 double) for small integers; BigInt for arbitrary precision; Int8Array/Int16Array/Int32Array/BigInt64Array typed arrays for storage
      size_bytes: 'unverified: number = 8 bytes (engines may tag small ints inline: unverified: V8 Smi is 31-bit on pointer-compressed builds); BigInt is heap object with variable size; typed array elements 1/2/4/8'
      width: fixed for number and typed arrays; variable for BigInt
      null_support: none (null/undefined are separate values; typed arrays cannot hold null)
      primitive_or_object: number is a primitive; BigInt is a primitive with heap payload
      de_use: Light ids/counters; use BigInt or string for 64-bit ids; typed arrays for columnar data
      conversion_risks: 'No integer type: integers are exact only up to 2^53-1 (Number.MAX_SAFE_INTEGER); bitwise ops coerce to int32; mixing number and BigInt throws TypeError; JSON.parse loses big ints'
      precision_limits: Integers exact only in [-2^53+1, 2^53-1]; Int32 typed arrays wrap modulo 2^32
      performance_notes: Typed arrays are contiguous; BigInt arithmetic is much slower than number; plain Array of numbers may be SMI/double-optimized by the engine
    typescript:
      type_name: number, bigint (type-level only; erased at compile time); Int32Array etc.
      size_bytes: 'unverified: number = 8 bytes (engines may tag small ints inline: unverified: V8 Smi is 31-bit on pointer-compressed builds); BigInt is heap object with variable size; typed array elements 1/2/4/8'
      width: fixed for number and typed arrays; variable for BigInt
      null_support: none (null/undefined are separate values; typed arrays cannot hold null)
      primitive_or_object: number is a primitive; BigInt is a primitive with heap payload
      de_use: 'Same as JavaScript; branded types (type UserId = number & {__b: ''id''}) document id semantics'
      conversion_risks: '^ (static types give no runtime protection: a `number` typed value can still be a float or exceed 2^53)'
      precision_limits: Integers exact only in [-2^53+1, 2^53-1]; Int32 typed arrays wrap modulo 2^32
      performance_notes: Typed arrays are contiguous; BigInt arithmetic is much slower than number; plain Array of numbers may be SMI/double-optimized by the engine
    julia:
      type_name: Int8, Int16, Int32, Int64 (+Int128, BigInt); Int = Int64 on 64-bit platforms
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (Missing via Union{Int64,Missing})
      primitive_or_object: primitive isbits value type
      de_use: Numeric kernels over Vector{Int64}; Int literals default to Int64
      conversion_risks: Overflow wraps silently (use Base.checked_add / @checked); literal type depends on platform word size; integer division with / yields Float64 (use div or ÷)
      precision_limits: Exact over full range; BigInt for arbitrary precision
      performance_notes: Vector{Int64} contiguous and SIMD-friendly; Union{Int,Missing} vectors are stored with a type-tag byte array (more memory, slower)
    swift:
      type_name: Int8, Int16, Int32, Int64, Int (word-sized)
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (Optional<Int> = Int?)
      primitive_or_object: primitive value type (struct)
      de_use: Ids/counters; Int is the idiomatic default
      conversion_risks: Overflow traps at runtime (crash) for + - *; &+ &- &* wrap; init(exactly:) returns nil on failure; init(truncatingIfNeeded:) truncates
      precision_limits: Exact over full range
      performance_notes: Arrays contiguous; trapping overflow checks add small cost (disabled with -Ounchecked)
    kotlin:
      type_name: Byte, Short, Int, Long (JVM primitives when non-null; boxed java.lang.* when nullable/generic)
      size_bytes: 1/2/4/8; boxed ~16 bytes
      width: fixed
      null_support: Nullable types Int? (boxed on JVM)
      primitive_or_object: primitive when non-null and not generic; boxed otherwise
      de_use: Same as Java on JVM; prefer IntArray/LongArray for columnar data
      conversion_risks: Overflow wraps silently like Java; Math.addExact available via JVM; toInt()/toByte() truncate; Byte is signed
      precision_limits: Exact over full range; Long->Double loses precision above 2^53
      performance_notes: List<Long> boxes; LongArray is contiguous
    scala:
      type_name: Byte, Short, Int, Long (JVM primitives; boxed in generic collections unless specialized)
      size_bytes: 1/2/4/8; boxed ~16 bytes
      width: fixed
      null_support: none (Option[Int]; null only for boxed java types)
      primitive_or_object: primitive; boxed in generic containers (@specialized helps only for some like Tuple2, Function1)
      de_use: Ids and counters; Array[Long] for dense data
      conversion_risks: Wraps silently like Java; Math.addExact available; toInt/toByte truncate
      precision_limits: Exact over full range
      performance_notes: Array[Long] contiguous; Seq[Long]/Option[Long] box
    r:
      type_name: integer (32-bit only); numeric (double) is the default number; bit64::integer64 for 64-bit via package
      size_bytes: integer 4 bytes per element + vector header (about 48 bytes for a vector); no 8/16-bit signed type
      width: fixed
      null_support: NA_integer_ sentinel (INT_MIN)
      primitive_or_object: vector of values (SEXP header); no scalars
      de_use: Counts, indices; ids above 2^31 must be double (exact to 2^53) or integer64 or string
      conversion_risks: No native int64; integer overflow yields NA with a warning; 5L/2L gives double 2.5; bit64 integer64 prints and joins incorrectly if package lost; bigint columns from DBI often arrive as double or integer64
      precision_limits: integer range -2^31+1..2^31-1 (INT_MIN is NA); double exact to 2^53
      performance_notes: Vectorized contiguous; copy-on-modify can double memory; ALTREP compact sequences (1:n) occupy O(1)
    pg:
      type_name: smallint (int2), integer (int4), bigint (int8); no 1-byte signed integer exposed ("char" is an internal 1-byte type)
      size_bytes: '2/4/8 per value plus row overhead: 23-byte heap tuple header (24 aligned) + 4-byte line pointer per row, with alignment padding between columns'
      width: fixed
      null_support: NULL (null bitmap in tuple header)
      primitive_or_object: row-store column value
      de_use: Surrogate keys (bigint/bigserial), counts, foreign keys
      conversion_risks: Overflow raises an error (integer out of range) rather than wrapping; integer/integer division truncates toward zero; sum(int) returns bigint, sum(bigint) returns numeric
      precision_limits: Exact over full range
      performance_notes: Column order affects padding; int4 fits more per page than int8; btree on int8 is wider
    duckdb:
      type_name: TINYINT, SMALLINT, INTEGER, BIGINT (+HUGEINT 128-bit)
      size_bytes: 1/2/4/8 (16 for HUGEINT) per value in a vector plus 1 bit validity
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Fact-table keys and measures; vectorized scans of BIGINT
      conversion_risks: Overflow raises an error (out of range) on arithmetic and CAST; / on integers gives DOUBLE (// or div for integer division); sum(INTEGER) returns HUGEINT
      precision_limits: Exact over full range
      performance_notes: Processed in vectors (2048 values) with SIMD-friendly layout; compressed lightweight (bitpacking) on disk
    arrow:
      type_name: Arrow int8, int16, int32, int64; Parquet physical INT32/INT64 annotated INT(bitWidth, isSigned=true)
      size_bytes: 1/2/4/8 per value + validity bitmap (1 bit/value, optional)
      width: fixed
      null_support: validity bitmap (Arrow) / definition levels (Parquet optional field)
      primitive_or_object: columnar buffer value
      de_use: Interchange format for ids and measures between engines
      conversion_risks: 'Parquet has no physical 8/16-bit type: stored as INT32 with logical annotation (encoding hides the waste); engines that ignore annotations read int32; overflow semantics are left to the compute layer (pyarrow compute checks with *_checked kernels)'
      precision_limits: Exact over full range
      performance_notes: Contiguous 64-byte-aligned buffers; zero-copy sharing; dictionary/RLE/bit-packing on Parquet disk
- id: unsigned_int
  title: Unsigned integer (8/16/32/64)
  category: integers
  description: Non-negative integers of 8, 16, 32 and 64 bits (modulo 2^n arithmetic where supported).
  cells:
    cpp:
      type_name: uint8_t/uint16_t/uint32_t/uint64_t; size_t
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (std::optional)
      primitive_or_object: primitive value type
      de_use: Hashes, bit masks, byte buffers, sizes/offsets; uint64 hash outputs (xxhash, splitmix64)
      conversion_risks: Unsigned arithmetic wraps modulo 2^n (defined); mixing with signed converts signed to unsigned (-1 < 1u is false); unsigned loop counters underflow
      precision_limits: Exact over full range; uint64 -> double loses above 2^53
      performance_notes: Same as signed; promoted to int for small types in expressions (uint8_t + uint8_t is int)
    rust:
      type_name: u8/u16/u32/u64 (also u128, usize)
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (Option<T>)
      primitive_or_object: primitive value type
      de_use: Hashes (splitmix64 state), byte data, indices (usize)
      conversion_risks: Subtraction below zero panics in debug and wraps in release; no implicit sign conversion (explicit `as` or TryFrom); usize width is platform-dependent
      precision_limits: Exact over full range
      performance_notes: Zero-cost; mixed-width requires explicit casts
    java:
      type_name: No unsigned primitives; use a wider signed type or Integer/Long unsigned helpers (Integer.toUnsignedLong, Long.compareUnsigned, Long.divideUnsigned, Long.toUnsignedString); char is an unsigned 16-bit type
      size_bytes: 1/2/4/8 (stored in signed types)
      width: fixed
      null_support: none (boxed types can be null)
      primitive_or_object: primitive; helpers are static methods
      de_use: Parquet/Arrow UINT32/UINT64 read into long / BigInteger-or-long with care; bytes via b & 0xFF
      conversion_risks: uint64 values >= 2^63 appear negative as long; Java byte is signed so (byte)200 == -56; unsigned compare/divide needs helper methods; Arrow Java UInt8Vector etc. return signed accessors by default
      precision_limits: Exact only if you remember to treat bits as unsigned
      performance_notes: Helper calls are intrinsics on modern JIT; boxing if stored in collections
    csharp:
      type_name: byte, ushort, uint, ulong (System.Byte/UInt16/UInt32/UInt64); nuint
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (Nullable<T>)
      primitive_or_object: primitive value type
      de_use: Hashes, bytes, flags enums, ulong ids
      conversion_risks: uint/ulong/ushort are not CLS-compliant (some languages cannot consume them); unchecked arithmetic wraps; mixing int and uint promotes to long, ulong and long cannot mix without cast
      precision_limits: Exact over full range
      performance_notes: byte[] is the standard binary buffer; Span<byte> for slicing without allocation
    go:
      type_name: uint8 (alias byte), uint16, uint32, uint64, uint, uintptr
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (pointer or sql.Null*)
      primitive_or_object: primitive value type
      de_use: Hashes, bit manipulation, byte slices, sizes
      conversion_risks: Wraps by definition; subtraction underflow wraps silently (len(x)-1 on empty slice with uint is a classic bug); conversions truncate; int(uint64) may become negative
      precision_limits: Exact over full range
      performance_notes: Contiguous; math/bits for intrinsics
    python:
      type_name: No fixed-width unsigned type; int in pure Python; numpy.uint8/16/32/64 or ctypes.c_uint* or struct formats B/H/I/Q in the ecosystem
      size_bytes: Same as signed int (28+ bytes object); numpy uint64 = 8 bytes in array
      width: variable (int) / fixed (numpy)
      null_support: none (None / pandas nullable UInt64)
      primitive_or_object: heap-allocated object; numpy packed
      de_use: Reading Parquet UINT64 columns; hash values; byte data
      conversion_risks: Pure Python never wraps (mask with & 0xFFFFFFFFFFFFFFFF to emulate); numpy mixes uint64 with int64 into float64 (silent precision loss); uint8 array arithmetic wraps silently
      precision_limits: Exact for ints; numpy uint64 exact up to 2^64-1
      performance_notes: Same as signed int
    javascript:
      type_name: No unsigned integer type; Uint8Array, Uint8ClampedArray, Uint16Array, Uint32Array, BigUint64Array typed arrays; >>> 0 coerces to uint32
      size_bytes: Typed array elements 1/2/4/8 bytes; a plain number is 8 bytes
      width: fixed
      null_support: none (typed arrays cannot hold null)
      primitive_or_object: typed arrays are object views over ArrayBuffer; elements are primitives
      de_use: Binary parsing (DataView), hashes, Arrow buffers in JS
      conversion_risks: uint64 needs BigInt (BigUint64Array) or string; Uint32 values > 2^31 are stored fine but bitwise ops return signed int32 unless >>> 0; Uint8ClampedArray clamps instead of wrapping
      precision_limits: number path exact to 2^53; BigUint64Array exact
      performance_notes: Contiguous typed arrays; BigInt reads allocate
    typescript:
      type_name: number/bigint (no unsigned type); Uint8Array etc.
      size_bytes: Typed array elements 1/2/4/8 bytes; a plain number is 8 bytes
      width: fixed
      null_support: none (typed arrays cannot hold null)
      primitive_or_object: typed arrays are object views over ArrayBuffer; elements are primitives
      de_use: Binary parsing (DataView), hashes, Arrow buffers in JS
      conversion_risks: ^ (no way to express unsigned range in the type system without branding)
      precision_limits: number path exact to 2^53; BigUint64Array exact
      performance_notes: Contiguous typed arrays; BigInt reads allocate
    julia:
      type_name: UInt8, UInt16, UInt32, UInt64 (+UInt128); UInt = UInt64 on 64-bit; hex literals pick the smallest fitting unsigned type
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (Missing via Union)
      primitive_or_object: primitive isbits value type
      de_use: Hashes (hash() returns UInt), bit tricks, byte buffers (Vector{UInt8})
      conversion_risks: 'Wraps modulo 2^n; mixing Int and UInt promotes to UInt (surprising: Int(-1) + UInt(1) is a UInt); 0x01 literal is UInt8'
      precision_limits: Exact over full range
      performance_notes: Contiguous; same as Int
    swift:
      type_name: UInt8, UInt16, UInt32, UInt64, UInt
      size_bytes: 1/2/4/8
      width: fixed
      null_support: none (Optional)
      primitive_or_object: primitive value type (struct)
      de_use: Bytes ([UInt8]), hashes, bit fields
      conversion_risks: Subtraction below zero traps (crash); &- wraps; Int(truncatingIfNeeded:) / Int(exactly:) for conversions; no implicit conversion between Int and UInt
      precision_limits: Exact over full range
      performance_notes: Contiguous arrays; overflow checks add small cost
    kotlin:
      type_name: UByte, UShort, UInt, ULong (stable since Kotlin 1.5; inline value classes over the signed types)
      size_bytes: 1/2/4/8 (boxed form is a wrapper object)
      width: fixed
      null_support: UInt? (boxes)
      primitive_or_object: value class (unboxed when possible; boxed in generics/nullable)
      de_use: Unsigned hashes and bytes; UByteArray/UIntArray exist
      conversion_risks: Java interop sees signed primitives; conversions via toUInt()/toLong(); arithmetic wraps
      precision_limits: Exact over full range
      performance_notes: Inline classes avoid allocation in many cases; List<UInt> boxes
    scala:
      type_name: No unsigned types in the standard library; use Integer.toUnsignedLong / Long.compareUnsigned helpers or third-party spire (UByte, UInt, ULong)
      size_bytes: 1/2/4/8 (signed storage)
      width: fixed
      null_support: none
      primitive_or_object: primitive signed types with helper methods
      de_use: Same JVM caveats as Java for Parquet/Arrow UINT columns
      conversion_risks: Unsigned values >= 2^63 appear negative as Long; Byte is signed; unsigned logic must be explicit
      precision_limits: Exact only with explicit unsigned handling
      performance_notes: Same as Java
    r:
      type_name: No unsigned integer; raw is an unsigned 8-bit byte type; bit64 / gmp packages for larger
      size_bytes: raw 1 byte per element; integer 4 bytes (signed)
      width: fixed
      null_support: raw has no NA; integer NA sentinel
      primitive_or_object: vector of values
      de_use: Bytes via raw(); unsigned Parquet columns are widened to integer/double
      conversion_risks: UINT32/UINT64 columns read via arrow are converted to double or integer64 and can lose precision above 2^53 or overflow int; bitwAnd works on 32-bit signed ints only
      precision_limits: uint32 fits only in double; uint64 inexact above 2^53 as double
      performance_notes: Vectorized; raw vectors are compact
    pg:
      type_name: No unsigned integer types; use bigint for uint32, numeric(20,0) for uint64; extension pguint provides them
      size_bytes: 8 (bigint) or variable (numeric)
      width: fixed (bigint) / variable (numeric)
      null_support: 'NULL'
      primitive_or_object: row-store value
      de_use: Loading UINT32/UINT64 from Parquet/Arrow requires widening; uint64 hashes stored as bigint (reinterpret) or numeric(20,0)
      conversion_risks: uint64 > 2^63-1 overflows bigint (error); reinterpreting as signed changes ordering; numeric is much slower and larger
      precision_limits: uint64 exact only in numeric(20,0)
      performance_notes: numeric arithmetic is software-implemented and slower than int8
    duckdb:
      type_name: UTINYINT, USMALLINT, UINTEGER, UBIGINT (+UHUGEINT)
      size_bytes: 1/2/4/8 (16 for UHUGEINT)
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Hashes (hash() returns UBIGINT), unsigned Parquet columns, byte-sized flags
      conversion_risks: Subtraction below zero raises an out-of-range error; mixing signed and unsigned promotes to a wider signed type; casting negative to unsigned errors
      precision_limits: Exact over full range
      performance_notes: Same columnar layout as signed
    arrow:
      type_name: Arrow uint8, uint16, uint32, uint64; Parquet INT(bitWidth, isSigned=false) over INT32/INT64 physical
      size_bytes: 1/2/4/8 per value + validity bitmap
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Preserves unsigned semantics across engines
      conversion_risks: Parquet stores UINT32 in INT32 and UINT64 in INT64 physical types, so a reader ignoring the logical annotation sees negative numbers; legacy ConvertedType UINT_* mapped similarly; many engines lack unsigned types and widen
      precision_limits: Exact over full range
      performance_notes: Same layout as signed; compare kernels are type-aware
- id: float32
  title: 32-bit float
  category: floating-point-and-decimal
  description: 'IEEE-754 binary32: 1 sign, 8 exponent, 23 stored fraction bits (24-bit significand).'
  cells:
    cpp:
      type_name: float (IEEE binary32 on mainstream platforms; check std::numeric_limits<float>::is_iec559); std::float32_t in C++23 is optional
      size_bytes: '4'
      width: fixed
      null_support: none (NaN is a conventional sentinel; std::optional)
      primitive_or_object: primitive value type
      de_use: Compact measure columns, ML features, GPU interchange
      conversion_risks: Implicit float->double promotion in expressions (printf, mixed arithmetic); -ffast-math breaks NaN/inf and associativity; int->float loses above 2^24
      precision_limits: About 7.2 decimal digits; integers exact to 2^24 = 16,777,216; 0.1f = 0.100000001490116...
      performance_notes: Half the memory bandwidth of double; 2x SIMD lanes; x87 builds could use extended precision (rare on x86-64)
    rust:
      type_name: f32
      size_bytes: '4'
      width: fixed
      null_support: none (Option<f32>, NaN)
      primitive_or_object: primitive value type
      de_use: Compact numeric columns and ML features
      conversion_risks: 'f32 does not implement Ord/Eq/Hash (NaN): sorting requires total_cmp or ordered wrappers; `as` from float to int saturates and maps NaN to 0'
      precision_limits: About 7.2 digits; integers exact to 2^24
      performance_notes: 2x SIMD width of f64; no fast-math by default so results are reproducible
    java:
      type_name: float (primitive), Float (boxed)
      size_bytes: 4; boxed ~16
      width: fixed
      null_support: primitive none; Float can be null
      primitive_or_object: primitive; boxed is heap object
      de_use: Compact numeric arrays
      conversion_risks: Strict IEEE semantics since JDK 17 (strictfp default); (int) cast saturates and NaN->0; Float.NaN compares unequal but Float.equals(NaN,NaN) is true and -0.0f != 0.0f under equals
      precision_limits: About 7.2 digits; integers exact to 2^24
      performance_notes: float[] contiguous; List<Float> boxes
    csharp:
      type_name: float (System.Single)
      size_bytes: '4'
      width: fixed
      null_support: none (float? Nullable<float>)
      primitive_or_object: primitive value type
      de_use: Compact numeric arrays, ML.NET features
      conversion_risks: 'unverified: float.NaN != float.NaN but float.Equals(NaN, NaN) is true; casts to int on overflow/NaN are unspecified in unchecked context (platform-dependent, changed in .NET 9 to saturate: unverified); arithmetic may use higher precision internally in older runtimes'
      precision_limits: About 7.2 digits; integers exact to 2^24
      performance_notes: Vectorizable via System.Numerics.Vector<float>
    go:
      type_name: float32
      size_bytes: '4'
      width: fixed
      null_support: none (pointer, NaN)
      primitive_or_object: primitive value type
      de_use: Compact numeric slices
      conversion_risks: No implicit conversion with float64; float->int conversion of out-of-range or NaN is implementation-defined; compiler may fuse x*y+z (FMA) on some architectures unless explicit float32() conversion is used
      precision_limits: About 7.2 digits; integers exact to 2^24
      performance_notes: Contiguous; no auto-vectorization in gc compiler (limited)
    python:
      type_name: No native float32 (Python float is always 64-bit); numpy.float32, array('f'), struct 'f', pyarrow.float32 in the ecosystem
      size_bytes: numpy.float32 scalar 4 bytes in array (scalar object ~28 bytes); array('f') 4 per element
      width: fixed
      null_support: none (NaN; pandas Float32 nullable)
      primitive_or_object: numpy packed; scalars are objects
      de_use: ML features, compact columns in pandas/numpy
      conversion_risks: 'unverified: Python floats silently widen to float64; numpy mixes float32 with Python float into float32 (value-based casting changed in NumPy 2, NEP 50: unverified for older versions); float32 sums of large arrays accumulate error unless pairwise summation is used'
      precision_limits: About 7.2 digits
      performance_notes: Half memory of float64; SIMD-friendly in numpy
    javascript:
      type_name: No float32 scalar type; Math.fround(x) rounds to float32 and returns a double; Float32Array typed array
      size_bytes: 4 per Float32Array element; scalars are 8-byte doubles
      width: fixed
      null_support: none (NaN; typed arrays cannot hold null)
      primitive_or_object: typed array view over ArrayBuffer; scalar result is a double
      de_use: WebGL/ML buffers; Arrow float32 columns in JS
      conversion_risks: Reading a Float32Array element promotes to a double with the exact float32 value (0.1 reads back as 0.10000000149011612); writes round to nearest even
      precision_limits: About 7.2 digits
      performance_notes: Contiguous typed array; Math.fround enables float32 emulation in JIT
    typescript:
      type_name: number (no float32 type); Float32Array
      size_bytes: 4 per Float32Array element; scalars are 8-byte doubles
      width: fixed
      null_support: none (NaN; typed arrays cannot hold null)
      primitive_or_object: typed array view over ArrayBuffer; scalar result is a double
      de_use: WebGL/ML buffers; Arrow float32 columns in JS
      conversion_risks: Reading a Float32Array element promotes to a double with the exact float32 value (0.1 reads back as 0.10000000149011612); writes round to nearest even
      precision_limits: About 7.2 digits
      performance_notes: Contiguous typed array; Math.fround enables float32 emulation in JIT
    julia:
      type_name: Float32
      size_bytes: '4'
      width: fixed
      null_support: none (Missing via Union; NaN32)
      primitive_or_object: primitive isbits value type
      de_use: ML features, compact numeric arrays
      conversion_risks: Literals like 0.1f0 are Float32 while 0.1 is Float64; mixed arithmetic promotes to Float64 only if any operand is Float64
      precision_limits: About 7.2 digits; integers exact to 2^24
      performance_notes: SIMD-friendly contiguous Vector{Float32}
    swift:
      type_name: Float (Float32 alias)
      size_bytes: '4'
      width: fixed
      null_support: none (Optional<Float>, nan)
      primitive_or_object: primitive value type (struct)
      de_use: Compact numeric arrays
      conversion_risks: Float(Int) loses above 2^24; Int(float) traps on NaN/inf/out-of-range (use Int(exactly:))
      precision_limits: About 7.2 digits
      performance_notes: Contiguous arrays; SIMD types SIMD4<Float>
    kotlin:
      type_name: Float (java.lang.Float when boxed)
      size_bytes: 4; boxed ~16
      width: fixed
      null_support: Float? (boxes)
      primitive_or_object: primitive when non-null; boxed otherwise
      de_use: Compact numeric arrays
      conversion_risks: Same as Java; Float.equals vs == differ for NaN and -0.0 when statically typed as Any/Float?
      precision_limits: About 7.2 digits
      performance_notes: FloatArray contiguous; List<Float> boxes
    scala:
      type_name: Float
      size_bytes: 4; boxed ~16
      width: fixed
      null_support: none (Option[Float])
      primitive_or_object: primitive; boxed in generic containers
      de_use: Compact numeric arrays
      conversion_risks: Same as Java; == on boxed Floats uses cooperative equality (NaN handling differs from primitive ==)
      precision_limits: About 7.2 digits
      performance_notes: Array[Float] contiguous
    r:
      type_name: No float32 in base R (numeric is always double); packages float (float32 matrices); writeBin(size = 4) for I/O
      size_bytes: 'Package float: 4 bytes per element stored in an integer vector; base R 8'
      width: fixed
      null_support: NA_real_ sentinel (a NaN payload) in doubles; float package supports NA
      primitive_or_object: vector of values
      de_use: Reading float32 Parquet/Arrow columns widens them to double
      conversion_risks: Values widen to double silently, so float32 rounding artifacts become visible digits (0.1f shows 0.10000000149)
      precision_limits: About 7.2 digits at the file level, 15.9 digits once widened
      performance_notes: Widening doubles memory
    pg:
      type_name: real (float4)
      size_bytes: 4 (plus tuple/alignment overhead)
      width: fixed
      null_support: 'NULL'
      primitive_or_object: row-store value
      de_use: Compact approximate measures (rarely preferred over double precision/numeric)
      conversion_risks: Cast to numeric shows float noise; NaN is a valid value and sorts greater than all numbers (unlike IEEE comparison); float4 input beyond range errors
      precision_limits: About 6 decimal digits guaranteed (FLT_DIG); extra_float_digits controls output
      performance_notes: Half width of float8; most math functions promote to float8
    duckdb:
      type_name: FLOAT (alias REAL, FLOAT4)
      size_bytes: 4 per value
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Compact measures, embeddings (FLOAT[N] arrays)
      conversion_risks: NaN compares equal to NaN and sorts as largest (differs from IEEE); casts from DOUBLE round; -0.0 and 0.0 treated as equal in grouping
      precision_limits: About 7.2 digits
      performance_notes: Vectorized; SIMD
    arrow:
      type_name: Arrow float32 (Parquet physical FLOAT); halffloat (float16) also exists
      size_bytes: 4 per value + validity bitmap
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Interchange for ML features and measures
      conversion_risks: 'unverified: Parquet statistics treat NaN specially (min/max exclude NaN; unverified for older writers); NaN payloads are not canonicalized'
      precision_limits: About 7.2 digits
      performance_notes: Contiguous aligned buffers; zero-copy
- id: float64
  title: 64-bit float
  category: floating-point-and-decimal
  description: 'IEEE-754 binary64: 1 sign, 11 exponent, 52 stored fraction bits (53-bit significand).'
  cells:
    cpp:
      type_name: double (IEEE binary64 on mainstream platforms); long double is 80-bit x87 on x86 Linux, 64-bit on MSVC, 128-bit on AArch64 Linux
      size_bytes: 8 (long double 16 with padding on x86-64 Linux)
      width: fixed
      null_support: none (NaN sentinel; std::optional)
      primitive_or_object: primitive value type
      de_use: 'Default measure type: prices (when approximate), rates, statistics'
      conversion_risks: Summation order matters (not associative); -ffast-math reorders and assumes no NaN; double->int out of range is UB; == on computed values is unreliable; 0.1+0.2 = 0.30000000000000004
      precision_limits: '53-bit significand: about 15.95 digits; integers exact to 2^53; machine epsilon 2.22e-16'
      performance_notes: Auto-vectorization of reductions requires -ffast-math or explicit pairwise/Kahan; x87 excess precision not an issue on x86-64 SSE2
    rust:
      type_name: f64
      size_bytes: '8'
      width: fixed
      null_support: none (Option<f64>, NaN)
      primitive_or_object: primitive value type
      de_use: Default measure type; sums and averages
      conversion_risks: 'Not Ord/Hash: use f64::total_cmp or ordered-float; float->int `as` saturates and NaN->0; sum order is deterministic but non-associative; iter().sum() is sequential'
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: No fast-math; reproducible across platforms (modulo libm functions); SIMD via explicit crates or auto-vectorization of independent lanes
    java:
      type_name: double (primitive), Double (boxed)
      size_bytes: 8; boxed ~16
      width: fixed
      null_support: primitive none; Double can be null
      primitive_or_object: primitive; boxed is heap object
      de_use: Default measure type; DoubleStream sums
      conversion_risks: Strict IEEE since JDK 17; Double.compare orders NaN greatest and -0.0 < 0.0 while == does not; (long) cast saturates; DoubleStream.sum uses Kahan compensation internally, so results differ from a naive loop
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: double[] contiguous; List<Double> boxes with GC pressure
    csharp:
      type_name: double (System.Double)
      size_bytes: '8'
      width: fixed
      null_support: none (double? Nullable<double>)
      primitive_or_object: primitive value type
      de_use: Default measure type
      conversion_risks: double.NaN != double.NaN but Equals treats NaN equal; double.Parse is culture-sensitive (use CultureInfo.InvariantCulture); Sum in LINQ is a plain left-to-right add
      precision_limits: About 15.95 digits; integers exact to 2^53; ToString("R")/default shortest round-trip since .NET Core 3.0
      performance_notes: Vectorizable via Vector<double>; Math.* use hardware intrinsics
    go:
      type_name: float64
      size_bytes: '8'
      width: fixed
      null_support: none (pointer, NaN)
      primitive_or_object: primitive value type
      de_use: Default measure type
      conversion_risks: map keys of NaN never match (NaN != NaN, each insert creates a new key); strconv.ParseFloat accepts "inf"/"nan"/hex floats; FMA fusion on arm64/ppc64/s390x can change results vs amd64
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: Contiguous slices; limited auto-vectorization
    python:
      type_name: float
      size_bytes: '24 per scalar (PyFloatObject: refcount 8 + type 8 + double 8); list of floats adds 8 per pointer; numpy.float64 = 8 per element'
      width: fixed
      null_support: none (None object, float('nan'), pandas NA)
      primitive_or_object: heap-allocated object (free list for floats); numpy packed
      de_use: Everyday numerics; numpy/pandas columns
      conversion_risks: 'unverified: Python float is always IEEE double; math.fsum gives exactly rounded sums while sum() does not (3.12 sum() uses compensated summation for floats: unverified: behavior changed in 3.12); float(''nan'') != float(''nan''); round() uses banker''s rounding (round-half-even)'
      precision_limits: About 15.95 digits; integers exact to 2^53; int to float conversion rounds (large ints may raise OverflowError above ~1.8e308)
      performance_notes: Pure-Python loops are ~50-100x slower than vectorized numpy; each float allocates
    javascript:
      type_name: number (the only numeric scalar type); Float64Array
      size_bytes: '8'
      width: fixed
      null_support: none (NaN; null/undefined distinct)
      primitive_or_object: 'primitive (engines may heap-box doubles: V8 HeapNumber 8-byte payload)'
      de_use: Everything numeric; Float64Array for columnar
      conversion_risks: number is IEEE double so integers exact only to 2^53; Number.parseFloat accepts trailing junk ('1.5abc' -> 1.5); NaN !== NaN (use Number.isNaN / Object.is); toFixed rounds on the binary value (1.005.toFixed(2) = '1.00')
      precision_limits: About 15.95 digits; Number.EPSILON 2.22e-16
      performance_notes: Float64Array contiguous; plain arrays of doubles may be unboxed by engine
    typescript:
      type_name: number (no distinct float64 type); Float64Array
      size_bytes: '8'
      width: fixed
      null_support: none (NaN; null/undefined distinct)
      primitive_or_object: 'primitive (engines may heap-box doubles: V8 HeapNumber 8-byte payload)'
      de_use: Everything numeric; Float64Array for columnar
      conversion_risks: number is IEEE double so integers exact only to 2^53; Number.parseFloat accepts trailing junk ('1.5abc' -> 1.5); NaN !== NaN (use Number.isNaN / Object.is); toFixed rounds on the binary value (1.005.toFixed(2) = '1.00')
      precision_limits: About 15.95 digits; Number.EPSILON 2.22e-16
      performance_notes: Float64Array contiguous; plain arrays of doubles may be unboxed by engine
    julia:
      type_name: Float64 (default for literals like 1.0)
      size_bytes: '8'
      width: fixed
      null_support: none (NaN; Missing via Union)
      primitive_or_object: primitive isbits value type
      de_use: Default numeric type
      conversion_risks: sum() uses pairwise summation (more accurate than naive loops, different from sequential order); mixed Int/Float promotes to Float64; isequal(NaN, NaN) true but == false
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: Vector{Float64} contiguous and SIMD-friendly (@simd for reorder permission)
    swift:
      type_name: Double (Float64 alias; the default for floating literals)
      size_bytes: '8'
      width: fixed
      null_support: none (Optional<Double>, nan)
      primitive_or_object: primitive value type (struct)
      de_use: Default numeric type
      conversion_risks: Double == is IEEE (nan != nan) but Comparable/Hashable use a total order in some APIs; Double(string) accepts "nan"/"inf"; Int(double) traps if out of range or NaN
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: Contiguous arrays; Accelerate/SIMD optional
    kotlin:
      type_name: Double (java.lang.Double when boxed)
      size_bytes: 8; boxed ~16
      width: fixed
      null_support: Double? (boxes)
      primitive_or_object: primitive when non-null; boxed otherwise
      de_use: Default numeric type
      conversion_risks: Same as Java; == on statically-typed Double follows IEEE, but on Any/generic uses equals (NaN == NaN true, 0.0 != -0.0)
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: DoubleArray contiguous; List<Double> boxes
    scala:
      type_name: Double
      size_bytes: 8; boxed ~16
      width: fixed
      null_support: none (Option[Double])
      primitive_or_object: primitive; boxed in generic containers
      de_use: Default numeric type
      conversion_risks: Same as Java; Scala 2.13/3 == on boxed uses cooperative equality
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: Array[Double] contiguous
    r:
      type_name: numeric / double (the default for 1.5 and 1)
      size_bytes: 8 per element + vector header
      width: fixed
      null_support: NA_real_ (a specific NaN payload) distinguishes missing from NaN; is.na() true for both
      primitive_or_object: vector of values
      de_use: Default numeric type; every number literal is double
      conversion_risks: NA vs NaN confusion (NA_real_ + 1 is NA; is.nan(NA) is FALSE); all integers above 2^31 are doubles; sum() uses long double accumulator on x86 (extended precision) so results can differ from other languages; as.numeric('1,5') is NA (locale decimal point not honored)
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: Vectorized contiguous; long double accumulator in sum() slows slightly
    pg:
      type_name: double precision (float8)
      size_bytes: 8 (plus row overhead)
      width: fixed
      null_support: 'NULL'
      primitive_or_object: row-store value
      de_use: Approximate measures, statistics; not money
      conversion_risks: NaN = NaN is true in PG and NaN sorts as greatest (unlike IEEE); float8 -> numeric rounds to 15 significant digits; sum(float8) is non-deterministic across parallel plans (order-dependent)
      precision_limits: About 15 decimal digits guaranteed (DBL_DIG); extra_float_digits=1 default since PG12 gives shortest round-trip output
      performance_notes: Hardware double math; parallel aggregates reorder additions
    duckdb:
      type_name: DOUBLE (alias FLOAT8)
      size_bytes: 8 per value
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Default measure type
      conversion_risks: NaN equals NaN and sorts greatest; sum(DOUBLE) is not order-deterministic across threads (fsum() is available for exact sums; kahan_sum/sumKahan variants exist); casts of out-of-range DOUBLE to integers error
      precision_limits: About 15.95 digits; integers exact to 2^53
      performance_notes: Vectorized; parallel aggregates reorder additions (results can vary in last digits between runs)
    arrow:
      type_name: Arrow float64 (Parquet physical DOUBLE)
      size_bytes: 8 per value + validity bitmap
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Interchange for measures
      conversion_risks: 'unverified: NaN vs null are distinct (null = missing, NaN = invalid number); Parquet min/max statistics ignore NaN in newer writers (unverified for older); sum kernels are not guaranteed order-stable under parallelism'
      precision_limits: About 15.95 digits
      performance_notes: Contiguous aligned buffers; zero-copy
- id: decimal
  title: Decimal / arbitrary precision
  category: floating-point-and-decimal
  description: Exact base-10 fixed-point or arbitrary-precision numbers for money; also big integers.
  cells:
    cpp:
      type_name: No stdlib decimal (C++ has no std::decimal; GCC offers _Decimal32/64/128 extension); Boost.Multiprecision cpp_dec_float / cpp_int, GMP mpz_class, or int64 cents
      size_bytes: cpp_int variable; int64 cents 8; _Decimal64 8, _Decimal128 16 (GCC extension)
      width: variable (libraries) / fixed (int64 scaled)
      null_support: none
      primitive_or_object: library class (heap-allocated for big) or primitive scaled integer
      de_use: Money as int64 cents (the benchmark's canonical form) or Boost.Multiprecision for analytics
      conversion_risks: Scaled-integer approach needs manual scale tracking and overflow checks; Boost cpp_dec_float has fixed digit count and rounds
      precision_limits: 'int64 cents: up to 9.2e16 dollars at scale 2; cpp_dec_float_50: 50 digits'
      performance_notes: Scaled int64 is as fast as integers; arbitrary precision allocates and is 10-100x slower
    rust:
      type_name: No stdlib decimal; rust_decimal crate (128-bit, 96-bit mantissa, scale 0..28), bigdecimal crate (arbitrary), num-bigint; or i64 cents
      size_bytes: rust_decimal 16 bytes; bigdecimal variable (BigInt + i64 scale)
      width: fixed (rust_decimal) / variable (bigdecimal)
      null_support: none (Option<Decimal>)
      primitive_or_object: value type (rust_decimal); heap (bigdecimal)
      de_use: Money in rust_decimal or int64 cents
      conversion_risks: 'unverified: rust_decimal limited to 28-29 significant digits and errors/rounds beyond; division rounds (banker''s by default in rust_decimal: unverified)'
      precision_limits: rust_decimal ~28 digits; bigdecimal unlimited
      performance_notes: rust_decimal is much faster than bigdecimal; int64 cents fastest
    java:
      type_name: java.math.BigDecimal (unscaled BigInteger + int scale), java.math.BigInteger
      size_bytes: 'unverified: Variable; BigDecimal object ~ 40 bytes + BigInteger magnitude int[] (16-byte array header + 4 per 32 bits) (unverified exact sizes)'
      width: variable
      null_support: Nullable reference
      primitive_or_object: heap-allocated immutable object
      de_use: Money, financial aggregates, JDBC DECIMAL mapping
      conversion_risks: new BigDecimal(double) captures binary noise (use BigDecimal.valueOf or String ctor); equals() compares scale (2.0 != 2.00) while compareTo does not; divide() without MathContext throws on non-terminating results
      precision_limits: Unlimited digits; scale is int
      performance_notes: 'Immutable objects: heavy allocation and GC in aggregations (10-50x slower than long cents)'
    csharp:
      type_name: decimal (System.Decimal); System.Numerics.BigInteger
      size_bytes: 16 (96-bit integer + sign + scale 0..28)
      width: fixed
      null_support: none (decimal? Nullable)
      primitive_or_object: primitive-like value type (struct)
      de_use: Money and financial computing
      conversion_risks: Range about +-7.9e28; conversion from double rounds to 15 significant digits; overflow throws OverflowException; division can lose digits beyond 28
      precision_limits: 28-29 significant digits
      performance_notes: 'Software-implemented: about 10-20x slower than double; no SIMD'
    go:
      type_name: No stdlib decimal; math/big (big.Int, big.Rat, big.Float) in stdlib; shopspring/decimal library; or int64 cents
      size_bytes: big.Int ~ 32+ bytes header + words; shopspring Decimal = big.Int + int32 exp
      width: variable
      null_support: none (pointer)
      primitive_or_object: struct with heap slice (big)
      de_use: Money as int64 cents or shopspring/decimal
      conversion_risks: big.Float default precision is that of operands (prec 53 for float64) not decimal; big.Rat exact but grows; shopspring Decimal.String formatting depends on exponent
      precision_limits: big.Int unlimited; decimal library arbitrary digits
      performance_notes: big types allocate; int64 cents is fastest
    python:
      type_name: decimal.Decimal (stdlib, default context 28 significant digits), fractions.Fraction, int (arbitrary precision)
      size_bytes: 'unverified: Decimal object ~100+ bytes (sys.getsizeof(Decimal(''1.23'')) is about 104 on 3.12, unverified)'
      width: variable
      null_support: none (None)
      primitive_or_object: heap-allocated object
      de_use: Exact money arithmetic; pandas object columns of Decimal (slow); pyarrow decimal128
      conversion_risks: Decimal(0.1) captures binary noise (use Decimal('0.1')); context precision rounds results of arithmetic silently; mixing Decimal with float raises TypeError (comparison is allowed); pandas sum of Decimal objects is Python-speed
      precision_limits: 28 digits by default; configurable up to MAX_PREC
      performance_notes: 'C-accelerated (libmpdec) but still object-per-value: 20-100x slower than numpy float64'
    javascript:
      type_name: 'unverified: No native decimal; BigInt with manual scaling, or decimal.js / big.js / bignumber.js libraries; TC39 Decimal proposal is not shipped (unverified)'
      size_bytes: BigInt heap object variable; library objects variable
      width: variable
      null_support: none
      primitive_or_object: BigInt primitive; library values are objects
      de_use: Money as integer cents (number if < 2^53, else BigInt) or string; JSON money as string
      conversion_risks: Number cannot represent 0.1 exactly; BigInt cannot hold fractions and throws on mixed arithmetic; JSON.stringify throws on BigInt
      precision_limits: BigInt unlimited; number exact to 2^53
      performance_notes: BigInt ops allocate; much slower than number
    typescript:
      type_name: No native decimal; bigint with manual scaling or libraries (decimal.js, big.js)
      size_bytes: BigInt heap object variable; library objects variable
      width: variable
      null_support: none
      primitive_or_object: BigInt primitive; library values are objects
      de_use: Money as integer cents (number if < 2^53, else BigInt) or string; JSON money as string
      conversion_risks: Number cannot represent 0.1 exactly; BigInt cannot hold fractions and throws on mixed arithmetic; JSON.stringify throws on BigInt
      precision_limits: BigInt unlimited; number exact to 2^53
      performance_notes: BigInt ops allocate; much slower than number
    julia:
      type_name: BigFloat, BigInt, Rational{T} in Base; Decimals.jl and FixedPointDecimals.jl (FixedDecimal{Int64,2}) as packages
      size_bytes: BigInt/BigFloat variable (GMP/MPFR); FixedDecimal{Int64,2} 8 bytes
      width: variable (Big*) / fixed (FixedDecimal)
      null_support: none (Missing via Union)
      primitive_or_object: heap (Big*) / isbits value (FixedDecimal)
      de_use: Money via FixedDecimal (int64 cents internally)
      conversion_risks: BigFloat default precision is 256 bits binary, not decimal; Rational overflows silently for fixed-width T; FixedDecimal overflows silently on arithmetic
      precision_limits: 'FixedDecimal{Int64,2}: 9.2e16 at scale 2; BigFloat 256 bits (~77 digits) by default'
      performance_notes: FixedDecimal is as fast as Int64; Big* allocate
    swift:
      type_name: Foundation.Decimal (NSDecimalNumber bridging)
      size_bytes: 'unverified: 20 (unverified: MemoryLayout<Decimal>.size)'
      width: fixed
      null_support: none (Optional<Decimal>)
      primitive_or_object: value type (struct)
      de_use: Currency in Foundation apps
      conversion_risks: Up to 38 significant digits; Decimal(Double) goes through a binary representation and can show noise (use Decimal(string:)); not available in Swift without Foundation on some platforms
      precision_limits: about 38 digits, exponent -128..127
      performance_notes: Software arithmetic; slower than Double
    kotlin:
      type_name: java.math.BigDecimal / BigInteger (JVM)
      size_bytes: Same as Java
      width: variable
      null_support: BigDecimal?
      primitive_or_object: heap-allocated immutable object
      de_use: Money; Kotlin has no decimal of its own
      conversion_risks: Same as Java (equals vs compareTo, scale handling); kotlin-multiplatform has no stdlib decimal (libraries such as BigNum)
      precision_limits: Unlimited digits
      performance_notes: Same as Java
    scala:
      type_name: scala.math.BigDecimal (wraps java.math.BigDecimal, default MathContext DECIMAL128), BigInt
      size_bytes: Same as Java plus wrapper object
      width: variable
      null_support: none (Option[BigDecimal])
      primitive_or_object: heap-allocated immutable object
      de_use: Money; Spark DecimalType(p,s) maps here
      conversion_risks: Default DECIMAL128 context rounds to 34 digits silently; == on BigDecimal compares numerically (differs from Java equals); Spark decimal overflow returns null (non-ANSI mode) or errors
      precision_limits: 34 digits default; Spark DecimalType max precision 38
      performance_notes: Allocation-heavy; Spark Decimal caches a Long for p <= 18
    r:
      type_name: No native decimal; double is the default; packages gmp (bigz), Rmpfr, decimal / bignum; integer64 for cents
      size_bytes: double 8; gmp variable
      width: fixed (double) / variable (packages)
      null_support: NA
      primitive_or_object: vector of values; package objects
      de_use: Money as integer cents in double (exact to 2^53) or with bit64
      conversion_risks: 'Reading DECIMAL columns (DBI, arrow) usually yields double: sums accumulate float error; format() and print() round to 7 significant digits by default and hide the noise'
      precision_limits: double exact to 2^53 cents (9.0e13 dollars)
      performance_notes: Vectorized doubles are fast; arbitrary precision packages are slow
    pg:
      type_name: numeric(p,s) / decimal
      size_bytes: 'Variable: 2 bytes per 4 decimal digits plus a 3 to 8 byte header (PG docs); decimal(18,2) typically 8-12 bytes'
      width: variable
      null_support: 'NULL'
      primitive_or_object: row-store varlena value
      de_use: Money and exact aggregates; the usual type for decimal(18,2)
      conversion_risks: Up to 131072 digits before and 16383 after the point; NaN allowed (and Infinity in PG14+); sum() of numeric is exact but slower; division scale chosen by rules, rounding half away from zero
      precision_limits: Exact up to declared precision; unconstrained numeric is arbitrary
      performance_notes: Software arithmetic 5-20x slower than int8/float8; width varies so no fixed-offset access
    duckdb:
      type_name: DECIMAL(width, scale) with width <= 38
      size_bytes: 'Stored as int16 (width 1-4), int32 (5-9), int64 (10-18), int128 (19-38): decimal(18,2) uses 8 bytes'
      width: fixed (per declared width)
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: decimal(18,2) money columns; exact sums (sum returns DECIMAL(38,s))
      conversion_risks: Mixing DECIMAL with DOUBLE promotes to DOUBLE; overflow raises an error; casts from DOUBLE round to scale; max width 38
      precision_limits: Exact within declared width/scale
      performance_notes: 'Native int64 arithmetic when width <= 18: nearly integer speed'
    arrow:
      type_name: 'unverified: Arrow decimal128 (precision <= 38), decimal256 (<= 76); decimal32/decimal64 added in newer Arrow releases (unverified); Parquet DECIMAL(p,s) logical type'
      size_bytes: 16 (decimal128), 32 (decimal256) per value + validity bitmap; Parquet stores DECIMAL(18,2) in INT64 or FIXED_LEN_BYTE_ARRAY
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Exact interchange of money columns between engines
      conversion_risks: 'Precision/scale are part of the type: addition result precision grows and can exceed 38; casts to float64 lose exactness; Parquet legacy readers expect FIXED_LEN_BYTE_ARRAY or BYTE_ARRAY encoding'
      precision_limits: Exact within declared precision
      performance_notes: 16 bytes per value even for decimal(18,2) in Arrow memory (vs 8 in DuckDB native)
- id: boolean
  title: Boolean
  category: text-and-binary
  description: Two-valued truth type (three-valued once nullable).
  cells:
    cpp:
      type_name: bool (std::vector<bool> is a bit-packed specialization, std::bitset<N>)
      size_bytes: sizeof(bool) is implementation-defined, 1 on mainstream ABIs; vector<bool> 1 bit per element
      width: fixed
      null_support: none (std::optional<bool>)
      primitive_or_object: primitive value type
      de_use: Flags such as is_returned; filter masks
      conversion_risks: Integer-to-bool converts any nonzero to true; vector<bool> returns proxy references (cannot take bool&, not thread-safe per element); reading an uninitialized bool is UB
      precision_limits: Exact
      performance_notes: bool[] is 1 byte per flag; bitsets give 8x density; vector<bool> trades speed for space
    rust:
      type_name: bool
      size_bytes: 1 (guaranteed size 1, only bit patterns 0 and 1 valid)
      width: fixed
      null_support: none (Option<bool>)
      primitive_or_object: primitive value type
      de_use: Flags, masks
      conversion_risks: No implicit int conversion (use `as u8` or `u8::from`); Option<bool> still 1 byte via niche
      precision_limits: Exact
      performance_notes: Vec<bool> is 1 byte per element; bit-vectors via bitvec/fixedbitset crates
    java:
      type_name: boolean (primitive), Boolean (boxed)
      size_bytes: 'JVM does not define the size: usually 1 byte in boolean[] and 4 bytes as a local/stack slot; Boolean boxed ~16 bytes (Boolean.TRUE/FALSE are shared)'
      width: fixed
      null_support: primitive none; Boolean can be null (NPE on unboxing)
      primitive_or_object: primitive; boxed is object
      de_use: Flags and predicates
      conversion_risks: No numeric conversion with int; unboxing a null Boolean throws NullPointerException; BitSet for packed flags
      precision_limits: Exact
      performance_notes: boolean[] is 1 byte per element; BitSet is 1 bit
    csharp:
      type_name: bool (System.Boolean)
      size_bytes: 1 managed (P/Invoke marshals as 4-byte BOOL by default)
      width: fixed
      null_support: none (bool? Nullable<bool>)
      primitive_or_object: primitive value type
      de_use: Flags and predicates
      conversion_risks: bool? uses three-valued logic with the & and bitwise-or operators; no int conversion; marshalling to native code needs MarshalAs(UnmanagedType.U1)
      precision_limits: Exact
      performance_notes: bool[] 1 byte per element; BitArray for packed bits
    go:
      type_name: bool
      size_bytes: '1'
      width: fixed
      null_support: none (pointer, sql.NullBool)
      primitive_or_object: primitive value type
      de_use: Flags and predicates
      conversion_risks: No numeric conversion; zero value is false (missing is indistinguishable from false when decoding JSON into bool)
      precision_limits: Exact
      performance_notes: '[]bool is 1 byte per element'
    python:
      type_name: bool (subclass of int; singletons True and False)
      size_bytes: 28 (int object) but only two shared instances; numpy.bool_ 1 per element
      width: fixed
      null_support: none (None; pandas nullable boolean dtype)
      primitive_or_object: heap object singletons; numpy packed
      de_use: Filter masks, flags
      conversion_risks: True == 1 and True + True == 2; isinstance(True, int) is True; bool('False') is True (non-empty string); numpy object columns with None break boolean masks; pandas silently converts bool with NaN to object
      precision_limits: Exact
      performance_notes: Python lists of bool store 8-byte pointers; numpy bool is 1 byte per element
    javascript:
      type_name: boolean
      size_bytes: 'unverified: Engine-dependent (primitive; true/false are singleton oddballs in V8: unverified); Uint8Array for compact flags'
      width: fixed
      null_support: none (null/undefined are distinct)
      primitive_or_object: primitive
      de_use: Flags and predicates
      conversion_risks: 'Truthiness: 0, '''', null, undefined, NaN are falsy but ''0'' and [] are truthy; Boolean(''false'') is true; == coerces types (''1'' == true)'
      precision_limits: Exact
      performance_notes: Use typed arrays for columnar masks
    typescript:
      type_name: boolean
      size_bytes: 'unverified: Engine-dependent (primitive; true/false are singleton oddballs in V8: unverified); Uint8Array for compact flags'
      width: fixed
      null_support: boolean
      primitive_or_object: primitive
      de_use: Flags and predicates
      conversion_risks: 'Truthiness: 0, '''', null, undefined, NaN are falsy but ''0'' and [] are truthy; Boolean(''false'') is true; == coerces types (''1'' == true)'
      precision_limits: Exact
      performance_notes: Use typed arrays for columnar masks
    julia:
      type_name: Bool (subtype of Integer; false/true equal 0/1)
      size_bytes: 1; BitVector packs 1 bit per element
      width: fixed
      null_support: none (Missing via Union{Bool,Missing}; three-valued logic)
      primitive_or_object: primitive isbits value type
      de_use: Masks and flags
      conversion_risks: Bool is an Integer so true + true == 2; if missing throws TypeError (use coalesce/ismissing); BitVector indexing returns Bool by copy
      precision_limits: Exact
      performance_notes: BitVector is dense and fast for logical indexing; Vector{Bool} is 1 byte per element
    swift:
      type_name: Bool
      size_bytes: '1'
      width: fixed
      null_support: none (Optional<Bool>)
      primitive_or_object: primitive value type (struct)
      de_use: Flags
      conversion_risks: No implicit int conversion; Bool("true") parses only the exact lowercase strings "true" and "false"
      precision_limits: Exact
      performance_notes: '[Bool] is 1 byte per element'
    kotlin:
      type_name: Boolean (java.lang.Boolean when boxed)
      size_bytes: 1 in arrays (JVM-dependent); boxed ~16
      width: fixed
      null_support: Boolean? (boxes; three-valued)
      primitive_or_object: primitive when non-null; boxed otherwise
      de_use: Flags
      conversion_risks: No int conversion; nullable Boolean needs explicit == true
      precision_limits: Exact
      performance_notes: BooleanArray 1 byte per element
    scala:
      type_name: Boolean
      size_bytes: 1 in arrays; boxed ~16
      width: fixed
      null_support: none (Option[Boolean])
      primitive_or_object: primitive; boxed in generics
      de_use: Flags
      conversion_risks: No int conversion; Option[Boolean] boxes
      precision_limits: Exact
      performance_notes: Array[Boolean] 1 byte per element
    r:
      type_name: logical (TRUE/FALSE/NA)
      size_bytes: 4 bytes per element (stored as int) + vector header
      width: fixed
      null_support: NA sentinel (INT_MIN) giving three-valued logic
      primitive_or_object: vector of values
      de_use: Filter masks and flags
      conversion_risks: NA propagates (NA AND FALSE is FALSE, NA AND TRUE is NA); as.logical('yes') is NA ('T','TRUE','true','True' accepted); sum(logical) counts TRUE; logical is 4x bigger than one byte
      precision_limits: Exact
      performance_notes: Memory 32x a bit-packed mask; fast vectorized logical operators
    pg:
      type_name: boolean
      size_bytes: 1 (plus row overhead)
      width: fixed
      null_support: NULL (three-valued logic)
      primitive_or_object: row-store value
      de_use: Flags such as is_returned
      conversion_risks: Accepts 't','true','y','yes','on','1' as input; NULL in WHERE filters rows out (not false); no implicit cast from integer in many contexts
      precision_limits: Exact
      performance_notes: 1 byte per value; boolean indexes are rarely selective
    duckdb:
      type_name: BOOLEAN (alias BOOL, LOGICAL)
      size_bytes: 1 per value (uint8 in vectors); validity mask separate
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Flags and filter results
      conversion_risks: Casts from VARCHAR accept 'true'/'false'/'t'/'f' variants; integers cast to true if nonzero; three-valued logic
      precision_limits: Exact
      performance_notes: Selection vectors/bitmasks make filters cheap
    arrow:
      type_name: Arrow bool (bit-packed); Parquet physical BOOLEAN
      size_bytes: 1 bit per value + validity bitmap (1 bit per value)
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar bit buffer
      de_use: Interchange of flags
      conversion_risks: 'Not byte-addressable: converting to a numpy/byte array requires unpacking; in Parquet booleans are bit-packed or RLE-encoded'
      precision_limits: Exact
      performance_notes: Densest representation; unpack cost when moving to languages with 1-byte bool
- id: character
  title: Character
  category: text-and-binary
  description: 'A single character; the meaning differs: byte, UTF-16 code unit, code point, Unicode scalar value, or grapheme cluster.'
  cells:
    cpp:
      type_name: char (1 byte, signedness implementation-defined), wchar_t (2 bytes on Windows, 4 on Linux/macOS), char8_t (C++20), char16_t, char32_t
      size_bytes: 1 / 2 or 4 / 1 / 2 / 4
      width: fixed
      null_support: none (std::optional<char>)
      primitive_or_object: primitive value type
      de_use: Byte-level parsing of CSV/ASCII; delimiters and separators
      conversion_risks: 'char is a byte, not a character: multi-byte UTF-8 sequences span several chars; plain char may be signed so (unsigned char) cast needed for isalpha etc.; wchar_t width is not portable'
      precision_limits: Holds one byte, not a Unicode character
      performance_notes: Byte loops are fast; locale-aware <cctype> calls are slow
    rust:
      type_name: char (Unicode scalar value, i.e. any code point except surrogates 0xD800-0xDFFF), u8 for bytes
      size_bytes: '4'
      width: fixed
      null_support: none (Option<char>)
      primitive_or_object: primitive value type
      de_use: Tokenizing text; u8 for ASCII/byte parsing
      conversion_risks: 'char is not a byte or a grapheme: ''é'' may be one char or two (e + combining accent); char::from_u32 returns None for invalid; `as u8` truncates; String stores UTF-8 so a char occupies 1-4 bytes in a string'
      precision_limits: Covers all valid scalar values (U+0000..U+10FFFF minus surrogates)
      performance_notes: 4 bytes per char in Vec<char> (4x memory vs UTF-8 bytes)
    java:
      type_name: char (unsigned 16-bit UTF-16 code unit), int for code points, Character wrapper
      size_bytes: 2; boxed ~16
      width: fixed
      null_support: primitive none; Character can be null
      primitive_or_object: primitive; boxed is object
      de_use: Parsing; code-point iteration via String.codePoints()
      conversion_risks: char is a UTF-16 code unit, so emoji and other supplementary characters are two chars (surrogate pair); Character.isLetter(char) wrong for those (use int overload); char arithmetic promotes to int
      precision_limits: Cannot hold code points above U+FFFF
      performance_notes: char[] is 2 bytes per unit; boxing when in collections
    csharp:
      type_name: char (System.Char, 16-bit UTF-16 code unit); System.Text.Rune for a Unicode scalar value
      size_bytes: 2 (Rune 4)
      width: fixed
      null_support: none (char? Nullable)
      primitive_or_object: primitive value type
      de_use: Parsing; Rune enumeration for correct Unicode
      conversion_risks: 'char is a code unit: emoji take two chars (surrogates); char.IsLetter(char) wrong for surrogate halves (use the string/index overloads); char to int is implicit'
      precision_limits: Cannot hold code points above U+FFFF
      performance_notes: char[] 2 bytes per unit
    go:
      type_name: rune (alias of int32, a Unicode code point), byte (alias of uint8); no char type
      size_bytes: 4 (rune) / 1 (byte)
      width: fixed
      null_support: none (pointer)
      primitive_or_object: primitive value type
      de_use: Iterating text with range over string gives runes; bytes for protocol parsing
      conversion_risks: rune is only a code point (not a grapheme); invalid UTF-8 decodes as U+FFFD (RuneError); string indexing s[i] yields a byte not a rune; []rune(s) conversion allocates 4 bytes per rune
      precision_limits: Any code point 0..0x10FFFF (surrogates not rejected by type)
      performance_notes: '[]rune is 4x larger than UTF-8; range over string decodes on the fly with no allocation'
    python:
      type_name: 'No char type: a str of length 1 (a Unicode code point)'
      size_bytes: A one-character ASCII str is 50 bytes on CPython 3.12 (49 byte header + 1; single Latin-1 chars are cached singletons)
      width: variable
      null_support: none (None)
      primitive_or_object: heap object
      de_use: Character classification (str.isalpha()), iteration
      conversion_risks: len() counts code points not graphemes ('é' as e + U+0301 has len 2, 'é' != 'é' until unicodedata.normalize); ord/chr work on code points; lone surrogates allowed in str but fail to encode as UTF-8
      precision_limits: Code points up to U+10FFFF
      performance_notes: Iterating a str creates a new 1-char object (cached for Latin-1)
    javascript:
      type_name: 'No char type: a string of length 1 (one UTF-16 code unit); String.fromCodePoint / codePointAt for code points'
      size_bytes: A one-unit string is a heap string (engines may cache single-char strings)
      width: variable
      null_support: none
      primitive_or_object: primitive string
      de_use: Parsing; iterate by code points with for...of or Array.from(s)
      conversion_risks: 's[i] and charAt/length use UTF-16 units: ''😀''.length === 2; s[0] gives a lone surrogate; String.prototype.normalize needed for equivalence; toUpperCase can change length (''ß'' -> ''SS'')'
      precision_limits: Code units only 0..65535 per index
      performance_notes: Indexing is O(1) in code units
    typescript:
      type_name: 'No char type: string of length 1'
      size_bytes: A one-unit string is a heap string (engines may cache single-char strings)
      width: variable
      null_support: none
      primitive_or_object: primitive string
      de_use: Parsing; iterate by code points with for...of or Array.from(s)
      conversion_risks: 's[i] and charAt/length use UTF-16 units: ''😀''.length === 2; s[0] gives a lone surrogate; String.prototype.normalize needed for equivalence; toUpperCase can change length (''ß'' -> ''SS'')'
      precision_limits: Code units only 0..65535 per index
      performance_notes: Indexing is O(1) in code units
    julia:
      type_name: Char (a 32-bit Unicode code point; can hold values that are not valid scalar values)
      size_bytes: '4'
      width: fixed
      null_support: none (Missing via Union)
      primitive_or_object: primitive isbits value type
      de_use: Iterating a String yields Chars; UInt8 for bytes
      conversion_risks: Char is a code point, not a grapheme; 'a' + 1 gives 'b' (Char arithmetic with Int is allowed); String index is by byte so s[2] on multi-byte text throws StringIndexError; Char(0xD800) is representable but invalid
      precision_limits: Any 32-bit Unicode code point representation
      performance_notes: 4 bytes per Char in Vector{Char}; iteration decodes UTF-8 on the fly
    swift:
      type_name: Character (an extended grapheme cluster, may be several scalars); Unicode.Scalar (4 bytes); UInt8 for bytes
      size_bytes: Character is 16 bytes (MemoryLayout<Character>.size, small-string representation); Unicode.Scalar 4
      width: variable
      null_support: none (Optional<Character>)
      primitive_or_object: value type (struct)
      de_use: Text segmentation; user-perceived characters
      conversion_risks: A Character may be many code points ('e\u{301}' is one Character, 🇲🇳 flag is one Character of two scalars); count/indexing are not O(1); Character comparison uses canonical equivalence so 'é' == 'e\u{301}' is true
      precision_limits: Arbitrary-length grapheme cluster
      performance_notes: 16 bytes per Character (4x a Unicode.Scalar); grapheme breaking costs CPU
    kotlin:
      type_name: Char (16-bit UTF-16 code unit; java.lang.Character when boxed); code points as Int
      size_bytes: 2; boxed ~16
      width: fixed
      null_support: Char? (boxes)
      primitive_or_object: primitive when non-null; boxed otherwise
      de_use: Parsing; String.codePoints() on JVM for correctness
      conversion_risks: 'Same as Java: supplementary characters are two Chars; Char is no longer implicitly an Int (use .code)'
      precision_limits: Cannot hold code points above U+FFFF
      performance_notes: CharArray 2 bytes per unit
    scala:
      type_name: Char (unsigned 16-bit UTF-16 code unit; java.lang.Character when boxed); Int code points
      size_bytes: 2; boxed ~16
      width: fixed
      null_support: none (Option[Char])
      primitive_or_object: primitive; boxed in generics
      de_use: Parsing
      conversion_risks: 'Same as Java: Char arithmetic promotes to Int; surrogate pairs need codePointAt'
      precision_limits: Cannot hold code points above U+FFFF
      performance_notes: Array[Char] 2 bytes per unit
    r:
      type_name: 'No char type: character vector elements are strings (CHARSXP, interned in a global cache); utf8ToInt/intToUtf8 for code points'
      size_bytes: 'unverified: Each distinct string is stored once in a global pool: 56 bytes minimum per CHARSXP on 64-bit (unverified) plus an 8-byte pointer per vector element'
      width: variable
      null_support: NA_character_ sentinel
      primitive_or_object: vector of string pointers
      de_use: Splitting text with strsplit(x, '')
      conversion_risks: nchar(type='chars') counts code points, type='bytes' counts bytes, type='width' counts display width; encoding is marked per string (native/UTF-8/latin1/bytes) and mixing marks causes silent mojibake on Windows
      precision_limits: Code points
      performance_notes: Global string cache dedups repeated values (helpful for low-cardinality columns)
    pg:
      type_name: '"char" (single internal byte, not for general use), char(n) (blank-padded), varchar(n), text; no true character type'
      size_bytes: '"char" 1; char(n) n characters padded plus 1-4 byte header'
      width: variable (char(n) fixed logical length)
      null_support: 'NULL'
      primitive_or_object: row-store varlena
      de_use: Fixed-width codes (use text/varchar or enum instead)
      conversion_risks: char(n) pads with spaces and trailing spaces are insignificant in comparisons; length() counts characters of the database encoding, octet_length() bytes; "char" truncates multi-byte input
      precision_limits: 'Characters of the database encoding (UTF8: code points)'
      performance_notes: char(n) has no performance advantage over text in PostgreSQL
    duckdb:
      type_name: 'No char type: VARCHAR (CHAR(n) and TEXT are aliases; length not enforced)'
      size_bytes: string_t 16 bytes per value (inline up to 12 bytes)
      width: variable
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Single-character codes as VARCHAR or ENUM
      conversion_risks: length() counts Unicode code points not bytes (strlen() bytes); VARCHAR(n) length limit is not enforced; no grapheme-aware length except via functions
      precision_limits: Code points (UTF-8)
      performance_notes: Short strings inline with no allocation
    arrow:
      type_name: 'No char type: utf8 string of length one, or uint8 for a byte; Parquet BYTE_ARRAY with STRING logical type'
      size_bytes: 'Variable (see string): 4-byte offset + data per value'
      width: variable
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Single-character codes carried as dictionary-encoded strings
      conversion_risks: Lengths are in bytes unless the compute kernel says otherwise (utf8_length counts code points, binary_length counts bytes)
      precision_limits: Code points (UTF-8)
      performance_notes: Dictionary encoding collapses repeated one-letter codes
- id: string
  title: String
  category: text-and-binary
  description: 'Text strings: encoding, mutability and indexing semantics differ across languages.'
  cells:
    cpp:
      type_name: std::string (mutable byte sequence, encoding-agnostic; commonly UTF-8), std::u8string (C++20), std::u16string, std::u32string, std::string_view (non-owning view)
      size_bytes: std::string object 32 bytes in libstdc++ (24 in libc++); small-string optimization holds 15 (libstdc++) or 22 (libc++) chars inline; heap beyond that
      width: variable
      null_support: none (empty string or std::optional<std::string>)
      primitive_or_object: class (value semantics); heap for large
      de_use: CSV fields, keys (string_view avoids copies)
      conversion_risks: size()/operator[] are in bytes (code units), not characters; no Unicode awareness (toupper is byte-wise); embedded NULs allowed; locale-dependent std::stod; invalidating references on append
      precision_limits: N/A (indexing is O(1) per byte)
      performance_notes: SSO avoids allocation for short strings; copy cost on std::string copies; string_view slices are free
    rust:
      type_name: String (growable UTF-8, always valid), &str (borrowed slice), OsString/CString for FFI
      size_bytes: String = 24 bytes (ptr, capacity, length) on the stack + heap buffer; &str = 16 bytes
      width: variable
      null_support: none (Option<String>)
      primitive_or_object: heap-allocated owned object; &str is a fat pointer
      de_use: Parsing and keys; &str slices avoid allocation
      conversion_risks: Indexing by integer is not allowed; slicing &s[a..b] by byte offsets panics if not on a char boundary; len() is bytes; chars().count() is O(n); String::from_utf8 validates (use from_utf8_lossy for U+FFFD replacement)
      precision_limits: Exact, UTF-8 validated
      performance_notes: Slicing is O(1); char counting is O(n); validation cost on construction from bytes
    java:
      type_name: String (immutable); StringBuilder (mutable)
      size_bytes: Object header 12 + fields (hash 4, coder 1, flags) ~24 bytes plus byte[] (16 byte array header + data); since JDK 9 compact strings store Latin-1 as 1 byte/char else UTF-16 2 bytes/char
      width: variable
      null_support: Nullable reference
      primitive_or_object: immutable heap object
      de_use: Parsing, keys; String.intern for dedup
      conversion_risks: length() and charAt(i) are UTF-16 code units (O(1)); emoji count as 2; substring copies in modern JDKs; String equality is by equals not ==
      precision_limits: N/A
      performance_notes: Compact strings halve memory for Latin-1 text; hashCode cached; large heaps of small strings pressure GC
    csharp:
      type_name: string (System.String, immutable UTF-16), StringBuilder, ReadOnlySpan<char>
      size_bytes: 22 + 2n bytes on 64-bit (8 header + 8 method table + 4 length + 2n chars + 2 null terminator, rounded to 8)
      width: variable
      null_support: Nullable reference (nullable reference types annotate)
      primitive_or_object: immutable heap object (reference type)
      de_use: Parsing, keys; string.Create/Span to avoid allocations
      conversion_risks: Length and indexer are UTF-16 code units; culture-sensitive comparison by default for some APIs (string.Compare, ToUpper, StartsWith(string)) vs ordinal; string.Normalize needed for canonical equivalence; Turkish-i problem
      precision_limits: N/A
      performance_notes: Every Substring/Split allocates; spans avoid it; string interning for repeated values
    go:
      type_name: string (immutable sequence of bytes, conventionally UTF-8), []byte for mutable, []rune for code points; strings.Builder
      size_bytes: String header 16 bytes (pointer + length); data separate
      width: variable
      null_support: none (empty string is the zero value; *string or sql.NullString for null)
      primitive_or_object: value type header over immutable bytes (heap or static data)
      de_use: CSV fields, keys; range over string yields runes
      conversion_risks: len(s) is bytes; s[i] is a byte; range s decodes UTF-8 into runes (invalid bytes become U+FFFD); strings may hold invalid UTF-8; substring slicing shares memory (can keep large buffers alive)
      precision_limits: N/A
      performance_notes: Substring/slicing O(1) without copy; conversions string<->[]byte allocate and copy; map keys hash all bytes
    python:
      type_name: str (immutable sequence of Unicode code points, PEP 393 flexible representation); bytes for raw bytes
      size_bytes: 49 bytes for an empty/ASCII compact string object on 64-bit CPython 3.12 + 1, 2 or 4 bytes per code point depending on widest char in the string
      width: variable
      null_support: none (None)
      primitive_or_object: immutable heap object
      de_use: Parsing, categorical labels
      conversion_risks: len() counts code points (O(1)), not bytes or graphemes; one astral character makes the whole string 4 bytes/char; indexing s[i] is O(1); 'é' != 'é' without normalization; encode() raises on lone surrogates
      precision_limits: N/A
      performance_notes: Per-string 49+ byte overhead is large for millions of short strings (pandas object dtype stores pointers); interning small strings; pyarrow strings are far more compact
    javascript:
      type_name: string (immutable sequence of UTF-16 code units)
      size_bytes: 'unverified: Engine-dependent: V8 uses 1 byte/char for Latin-1-only strings, else 2 bytes/char plus header (unverified exact header); ropes defer concatenation'
      width: variable
      null_support: none (null/undefined distinct)
      primitive_or_object: primitive (engine heap string)
      de_use: Parsing, keys; TextEncoder/TextDecoder for UTF-8 bytes
      conversion_risks: 'length and indexing are UTF-16 units: ''😀''.length is 2 and [...''😀''].length is 1; Intl.Segmenter needed for graphemes; sort() on strings compares code units not locale (localeCompare for locale)'
      precision_limits: N/A
      performance_notes: Concatenation via ropes is fast but flattening costs; string keys are interned in objects
    typescript:
      type_name: string (no separate encoding type; template literal types exist at compile time only)
      size_bytes: 'unverified: Engine-dependent: V8 uses 1 byte/char for Latin-1-only strings, else 2 bytes/char plus header (unverified exact header); ropes defer concatenation'
      width: variable
      null_support: none (null/undefined distinct)
      primitive_or_object: primitive (engine heap string)
      de_use: Parsing, keys; TextEncoder/TextDecoder for UTF-8 bytes
      conversion_risks: 'length and indexing are UTF-16 units: ''😀''.length is 2 and [...''😀''].length is 1; Intl.Segmenter needed for graphemes; sort() on strings compares code units not locale (localeCompare for locale)'
      precision_limits: N/A
      performance_notes: Concatenation via ropes is fast but flattening costs; string keys are interned in objects
    julia:
      type_name: String (immutable UTF-8), SubString, Symbol for interned identifiers, Vector{UInt8} for bytes
      size_bytes: 'unverified: Header 8 bytes (length) + data bytes (unverified exact layout; sizeof(s) gives bytes)'
      width: variable
      null_support: none (Missing via Union{String,Missing})
      primitive_or_object: immutable heap object
      de_use: Parsing, categorical keys (use PooledArrays / InlineStrings for compactness)
      conversion_risks: length(s) counts characters (O(n)), sizeof(s) bytes; s[i] is a byte index and throws StringIndexError for an index inside a multibyte char (use nextind/eachindex); String can hold invalid UTF-8
      precision_limits: N/A
      performance_notes: SubString avoids copying; InlineStrings.jl packs short strings into fixed-width isbits types
    swift:
      type_name: String (Unicode-correct collection of Characters; UTF-8 storage since Swift 5), Substring
      size_bytes: 16 bytes inline; short strings up to 15 UTF-8 bytes stored inline (smol strings), larger on the heap with header
      width: variable
      null_support: none (Optional<String>)
      primitive_or_object: value type (struct) with CoW heap storage
      de_use: Parsing, text processing
      conversion_risks: count is O(n) in grapheme clusters; no integer subscript (use String.Index); utf8.count is O(1); == uses canonical equivalence so 'é' == 'e\u{301}'; String(data:encoding:) can return nil
      precision_limits: N/A
      performance_notes: Native UTF-8 makes bytes fast; grapheme-aware operations cost O(n)
    kotlin:
      type_name: String (java.lang.String on JVM; native/JS strings elsewhere), StringBuilder
      size_bytes: Same as Java on JVM
      width: variable
      null_support: String?
      primitive_or_object: immutable heap object
      de_use: Parsing
      conversion_risks: length is UTF-16 units on JVM/JS; indexing is O(1) per unit; codePoints() for scalars
      precision_limits: N/A
      performance_notes: Same as Java
    scala:
      type_name: String (java.lang.String), StringBuilder
      size_bytes: Same as Java
      width: variable
      null_support: none (Option[String]; null possible)
      primitive_or_object: immutable heap object
      de_use: Parsing
      conversion_risks: 'Same as Java: length in UTF-16 units; == is by value (unlike Java)'
      precision_limits: N/A
      performance_notes: Same as Java
    r:
      type_name: character vector (each element a CHARSXP in a global string pool)
      size_bytes: 'unverified: 8 bytes per element pointer + shared CHARSXP (56+ bytes, unverified exact) per distinct string'
      width: variable
      null_support: NA_character_ sentinel (distinct from the string 'NA')
      primitive_or_object: vector of pointers to interned strings
      de_use: Parsing, factors for categorical
      conversion_risks: nchar() default counts characters (type='chars'); substr() works on characters (O(n) for UTF-8); encoding marked per element; read.csv turns 'NA' into NA by default; sort order depends on locale (use method='radix' for C-locale)
      precision_limits: N/A
      performance_notes: Global cache dedups repeated strings (good for categorical); creating many unique strings is slow
    pg:
      type_name: text, varchar(n), char(n)
      size_bytes: 1-byte header for values <= 126 bytes else 4-byte header; values over about 2 kB are compressed/TOASTed out of line (up to 1 GB)
      width: variable
      null_support: 'NULL'
      primitive_or_object: row-store varlena value
      de_use: Names, categories, payloads
      conversion_risks: length() counts characters of the database encoding, octet_length() counts bytes; collation affects ORDER BY/comparisons (use COLLATE "C" for byte order); NUL characters cannot be stored in text
      precision_limits: Max 1 GB per value
      performance_notes: Short strings stored inline; TOAST makes wide columns cheaper to skip
    duckdb:
      type_name: VARCHAR (aliases TEXT, STRING, CHAR(n), VARCHAR(n); n not enforced)
      size_bytes: '16-byte string_t per value: up to 12 bytes inline, otherwise 4-byte prefix + pointer into heap'
      width: variable
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Names, categories (dictionary compression on disk), payloads
      conversion_risks: length() counts Unicode code points (not graphemes); strlen() bytes; comparison is byte-wise (BINARY collation) unless COLLATE specified; invalid UTF-8 is rejected
      precision_limits: 'unverified: Max 4 GB per value (unverified)'
      performance_notes: Inline short strings avoid pointer chasing; FSST/dictionary compression in storage
    arrow:
      type_name: Arrow utf8 (int32 offsets), large_utf8 (int64 offsets), utf8_view/string_view (16-byte views); dictionary<int, utf8> for categorical; Parquet BYTE_ARRAY (STRING logical, UTF8 encoding)
      size_bytes: Offsets buffer 4 bytes (utf8) or 8 (large_utf8) per value + contiguous UTF-8 data; string_view 16 bytes per value
      width: variable
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar offset + data buffers
      de_use: Interchange for text columns
      conversion_risks: utf8 offsets limit a single array to 2 GiB of data (use large_utf8 or chunking); lengths are bytes; invalid UTF-8 allowed by readers unless validated
      precision_limits: utf8 array max 2^31-1 bytes
      performance_notes: Contiguous data with no per-string object overhead; random access to the i-th string is O(1) via offsets
- id: binary
  title: Binary / byte array
  category: text-and-binary
  description: Opaque sequences of bytes (blobs, buffers, hashes, UUID bytes).
  cells:
    cpp:
      type_name: std::vector<uint8_t> / std::vector<std::byte> (C++17), std::array<std::byte,N>, std::string as byte container, std::span<const std::byte> view
      size_bytes: vector object 24 bytes + heap data 1 per byte
      width: variable (vector) / fixed (array)
      null_support: none
      primitive_or_object: class (heap data)
      de_use: Raw file/page buffers, hashes
      conversion_risks: char/uint8_t/std::byte aliasing rules; endianness is manual (memcpy or std::byteswap C++23); std::string is not NUL-terminated safe for binary if constructed from char*
      precision_limits: N/A
      performance_notes: Contiguous; memcpy-speed; span avoids copies
    rust:
      type_name: 'Vec<u8>, &[u8], [u8; N], bytes::Bytes (crate: cheap ref-counted slices)'
      size_bytes: Vec 24 bytes + heap data; slice 16 bytes (fat pointer)
      width: variable / fixed
      null_support: none (Option<Vec<u8>>)
      primitive_or_object: heap object / borrowed slice
      de_use: Buffers, hashes, protocol parsing
      conversion_risks: u8::from_le_bytes/to_be_bytes explicit endianness; String::from_utf8 can fail on arbitrary bytes
      precision_limits: N/A
      performance_notes: Contiguous; slicing is O(1); bytes::Bytes shares without copying
    java:
      type_name: byte[] (signed bytes), ByteBuffer (heap or direct, big-endian by default), java.util.UUID
      size_bytes: byte[] has 16-byte array header + data; ByteBuffer object ~48+ bytes; direct buffers live off-heap
      width: variable
      null_support: Nullable reference
      primitive_or_object: array object / buffer object
      de_use: Blobs, hashes, Parquet pages
      conversion_risks: 'byte is signed: (b & 0xFF) for 0..255; ByteBuffer default order is BIG_ENDIAN while most hardware is little-endian; arrays limited to 2^31-1 elements'
      precision_limits: N/A
      performance_notes: Direct buffers avoid copies for I/O but allocation is costly; heap byte[] subject to GC copying
    csharp:
      type_name: byte[], Span<byte>/Memory<byte>, ReadOnlySpan<byte>, System.Buffers
      size_bytes: byte[] 24-byte array header (8 header + 8 MT + 8 length) + data
      width: variable
      null_support: Nullable reference
      primitive_or_object: array object (reference type) / ref struct spans
      de_use: Buffers, hashes, blobs
      conversion_risks: Span<byte> cannot be stored on the heap (ref struct); BinaryPrimitives for explicit endianness; Convert.ToHexString/Base64 for text forms
      precision_limits: N/A
      performance_notes: Spans and ArrayPool avoid allocations; byte[] over 85,000 bytes goes to the Large Object Heap
    go:
      type_name: '[]byte (slice), [N]byte (array), bytes.Buffer'
      size_bytes: Slice header 24 bytes (ptr, len, cap) + data
      width: variable / fixed
      null_support: none (nil slice; nil and empty are different but both len 0)
      primitive_or_object: slice header value over heap array
      de_use: Buffers, hashes, protocol parsing
      conversion_risks: Converting string<->[]byte copies; sub-slices share backing arrays (aliasing and retention); encoding/binary for endianness; nil vs empty slice differ in JSON (null vs [])
      precision_limits: N/A
      performance_notes: Contiguous; append amortized; bytes.Buffer grows by doubling
    python:
      type_name: bytes (immutable), bytearray (mutable), memoryview (zero-copy view)
      size_bytes: 'bytes: 33-byte object overhead + 1 per byte; bytearray 56 + data'
      width: variable
      null_support: none (None)
      primitive_or_object: heap object
      de_use: Blobs, hashes (hashlib), Parquet binary columns
      conversion_risks: Indexing bytes yields int (not a 1-byte bytes); str and bytes do not mix (TypeError); decode() errors on invalid UTF-8; struct/int.from_bytes for endianness
      precision_limits: N/A
      performance_notes: memoryview slices without copying; bytes concatenation in a loop is O(n^2)
    javascript:
      type_name: Uint8Array over ArrayBuffer, Buffer (Node.js), DataView, Blob; TextEncoder/TextDecoder
      size_bytes: Uint8Array object header (engine-dependent, tens of bytes) + 1 byte per element
      width: fixed (once created)
      null_support: none (typed arrays cannot hold null)
      primitive_or_object: object view over ArrayBuffer
      de_use: Binary parsing, Arrow buffers, file I/O
      conversion_risks: DataView defaults to big-endian while Typed arrays use platform (little-endian) order; Buffer in Node is a Uint8Array subclass with pooled allocation (allocUnsafe may leak old memory); string<->bytes needs explicit encoding
      precision_limits: N/A
      performance_notes: Contiguous; slice() of Uint8Array copies while subarray() shares
    typescript:
      type_name: Uint8Array, ArrayBuffer, Buffer (via @types/node)
      size_bytes: Uint8Array object header (engine-dependent, tens of bytes) + 1 byte per element
      width: fixed (once created)
      null_support: none (typed arrays cannot hold null)
      primitive_or_object: object view over ArrayBuffer
      de_use: Binary parsing, Arrow buffers, file I/O
      conversion_risks: DataView defaults to big-endian while Typed arrays use platform (little-endian) order; Buffer in Node is a Uint8Array subclass with pooled allocation (allocUnsafe may leak old memory); string<->bytes needs explicit encoding
      precision_limits: N/A
      performance_notes: Contiguous; slice() of Uint8Array copies while subarray() shares
    julia:
      type_name: Vector{UInt8}, NTuple{N,UInt8}, Base.CodeUnits(String), IOBuffer
      size_bytes: 'unverified: Vector header 24-40 bytes (unverified exact) + 1 per byte'
      width: variable / fixed (NTuple)
      null_support: none (Missing via Union)
      primitive_or_object: heap object
      de_use: Blobs, hashes (SHA.jl)
      conversion_risks: codeunits(s) is a read-only view of a String (no copy); reinterpret for typed views needs matching alignment; endianness via hton/ntoh
      precision_limits: N/A
      performance_notes: Contiguous; reinterpret/unsafe_wrap give zero-copy views
    swift:
      type_name: '[UInt8], Data (Foundation), ContiguousBytes, UnsafeRawBufferPointer'
      size_bytes: 'unverified: Array header 32 bytes + data (unverified); Data 8-16+ bytes inline up to a small size else heap'
      width: variable
      null_support: none (Optional<Data>)
      primitive_or_object: value type with CoW heap storage
      de_use: Blobs, network data
      conversion_risks: Data slices keep indices of the parent (startIndex may not be 0); String(data:encoding:) returns nil on invalid input; endianness via .littleEndian/.bigEndian properties
      precision_limits: N/A
      performance_notes: CoW avoids copies until mutation; Data may bridge to NSData
    kotlin:
      type_name: ByteArray (signed bytes), UByteArray, java.nio.ByteBuffer
      size_bytes: 16-byte array header + data (JVM)
      width: variable
      null_support: ByteArray?
      primitive_or_object: array object
      de_use: Blobs, hashes
      conversion_risks: 'Same as Java: Byte is signed (toInt() and 0xFF); UByteArray for unsigned view'
      precision_limits: N/A
      performance_notes: Same as Java
    scala:
      type_name: Array[Byte], java.nio.ByteBuffer, scala.collection.immutable.ArraySeq.ofByte
      size_bytes: 16-byte array header + data
      width: variable
      null_support: none (null possible)
      primitive_or_object: array object
      de_use: Blobs, hashes
      conversion_risks: Byte is signed; & 0xFF needed
      precision_limits: N/A
      performance_notes: Same as Java
    r:
      type_name: raw vector (1 byte per element); readBin/writeBin, packBits, serialize
      size_bytes: 'unverified: 1 per element + vector header (about 48 bytes; unverified)'
      width: variable
      null_support: none (raw has no NA)
      primitive_or_object: vector of bytes
      de_use: Blobs, hashes (digest package), BLOB columns via DBI (list of raw vectors)
      conversion_risks: rawToChar fails on embedded NULs; no 64-bit integers from readBin (size 8 gives double); BLOB columns arrive as list columns
      precision_limits: N/A
      performance_notes: Compact; vectorized bit operations
    pg:
      type_name: bytea (hex output format by default), plus large objects for > 1 GB
      size_bytes: 1-byte or 4-byte varlena header + data; TOAST above ~2 kB; max 1 GB
      width: variable
      null_support: 'NULL'
      primitive_or_object: row-store varlena
      de_use: Hashes, binary payloads, UUIDs as uuid (16 bytes) instead
      conversion_risks: Text input escapes (hex '\x..' vs escape format); bytea_output setting affects client display; no fixed-length binary type
      precision_limits: Max 1 GB
      performance_notes: TOAST compression is wasted on already-compressed data
    duckdb:
      type_name: BLOB (aliases BYTEA, BINARY, VARBINARY); UUID (16 bytes) as native type
      size_bytes: 16-byte string_t per value like VARCHAR (inline up to 12 bytes)
      width: variable
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Hashes, binary payloads
      conversion_risks: Casting BLOB to VARCHAR escapes non-printable bytes as \xNN; VARCHAR to BLOB encodes UTF-8
      precision_limits: 'unverified: Max 4 GB per value (unverified)'
      performance_notes: Same layout as VARCHAR
    arrow:
      type_name: Arrow binary (int32 offsets), large_binary (int64 offsets), fixed_size_binary(N), binary_view; Parquet BYTE_ARRAY / FIXED_LEN_BYTE_ARRAY
      size_bytes: Offsets 4 or 8 bytes per value + data; fixed_size_binary N per value
      width: variable / fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar offset + data buffers
      de_use: Interchange for hashes, UUIDs (fixed_size_binary(16) / uuid extension)
      conversion_risks: binary arrays limited to 2 GiB per array without large_binary; no inherent text encoding
      precision_limits: Max 2^31-1 bytes per binary array
      performance_notes: Zero-copy slices; fixed_size_binary gives constant stride
- id: date
  title: Date (calendar day, no time or zone)
  category: temporal
  description: A calendar date without time-of-day or timezone; epoch and range differ widely.
  cells:
    cpp:
      type_name: std::chrono::year_month_day and std::chrono::sys_days (C++20, days since 1970-01-01 in practice)
      size_bytes: year_month_day 4 bytes (int16 year + uint8 month + uint8 day) in common implementations; sys_days = 4 bytes (int32 days, rep implementation-defined)
      width: fixed
      null_support: none (std::optional)
      primitive_or_object: value type
      de_use: Date dimension keys, partitions by day
      conversion_risks: 'unverified: Chrono calendar support needs a recent standard library (libstdc++ 11+/MSVC 2019+, libc++ partial for years: unverified); time_t/struct tm legacy API is not thread-safe (localtime) and 2038-limited when 32-bit; year_month_day may hold invalid dates until ok() is checked'
      precision_limits: Range of year int16 (about +-32767 years)
      performance_notes: Day arithmetic via sys_days is integer add; conversions to y/m/d are cheap civil-from-days algorithms
    rust:
      type_name: No std date type; chrono::NaiveDate (4 bytes), time::Date, jiff::civil::Date, or i32 days since epoch
      size_bytes: 'unverified: chrono NaiveDate 4 bytes; time::Date 4 bytes (unverified)'
      width: fixed
      null_support: none (Option<NaiveDate>)
      primitive_or_object: value type
      de_use: Date columns; chrono is the de facto standard
      conversion_risks: Crates differ in valid range and epoch (chrono NaiveDate day 1 = 0001-01-01 internally); NaiveDate::from_ymd_opt returns None for invalid dates; Arrow date32 maps to i32 days since 1970-01-01
      precision_limits: chrono range about +-262,000 years
      performance_notes: Copy type, cheap arithmetic
    java:
      type_name: java.time.LocalDate (immutable); java.sql.Date and java.util.Date are legacy
      size_bytes: 'Object: header 12 + int year + short month + short day (about 24 bytes with alignment)'
      width: fixed (logical)
      null_support: Nullable reference
      primitive_or_object: immutable heap object (reference type)
      de_use: Date columns; LocalDate.toEpochDay() gives days since 1970-01-01
      conversion_risks: java.sql.Date carries a timezone-dependent millisecond instant (JDBC conversions can shift dates by timezone); LocalDate has no time zone so converting to Instant requires an explicit zone
      precision_limits: Years -999999999..+999999999; proleptic ISO calendar
      performance_notes: Objects allocate (no value types yet); store epochDay long for bulk work
    csharp:
      type_name: DateOnly (.NET 6+); DateTime with time part ignored (legacy)
      size_bytes: DateOnly 4 (int day number since 0001-01-01)
      width: fixed
      null_support: none (DateOnly? Nullable)
      primitive_or_object: value type (struct)
      de_use: Date columns
      conversion_risks: DateOnly range 0001-01-01..9999-12-31; DayNumber epoch is 0001-01-01 (differs from Unix epoch by 719,162 days); SQL Server/ADO mappings of date to DateTime keep a midnight time part
      precision_limits: Years 1..9999
      performance_notes: Cheap struct; conversion to Unix days needs an offset subtraction
    go:
      type_name: 'No dedicated date type: time.Time at midnight (24 bytes), civil.Date in cloud.google.com/go/civil, or int32 days since epoch'
      size_bytes: time.Time 24 (wall uint64, ext int64, *Location)
      width: fixed
      null_support: none (zero time.Time is 0001-01-01 UTC; pointer for null)
      primitive_or_object: struct value type
      de_use: Date columns often held as time.Time or days int
      conversion_risks: time.Time carries zone and nanoseconds so equality with == can fail for the same instant (use Equal); zero value is year 1 (not 1970); Truncate(24h) truncates relative to absolute time not local midnight
      precision_limits: Years about +-292 billion in the ext field; Unix() safe
      performance_notes: 24 bytes per date is wasteful; days-as-int32 is compact
    python:
      type_name: datetime.date
      size_bytes: 'unverified: 32 bytes per object on 64-bit CPython (unverified exact); numpy datetime64[D] 8 bytes'
      width: fixed
      null_support: none (None; NaT in numpy/pandas)
      primitive_or_object: immutable heap object; numpy packed
      de_use: Date columns; pandas datetime64[ns] or pyarrow date32 for bulk
      conversion_risks: date.fromordinal epoch is 0001-01-01 (ordinal 1); date.toordinal() differs from Unix days by 719,163 (ordinal of 1970-01-01); pandas Timestamp range limited to about 1677..2262 in ns units
      precision_limits: Years 1..9999 for datetime.date; pandas ns range 1677-09-21..2262-04-11
      performance_notes: Python object per value; use numpy/pyarrow date arrays
    javascript:
      type_name: 'unverified: No date-only type: Date (instant) used at midnight; Temporal.PlainDate is a proposal (not yet in all engines: unverified); or ISO string ''YYYY-MM-DD'''
      size_bytes: Date object holds one double (8 bytes) plus object header
      width: fixed
      null_support: none (null / Invalid Date)
      primitive_or_object: object
      de_use: Date columns usually kept as ISO strings or epoch-day numbers
      conversion_risks: new Date('2024-01-05') parses as UTC midnight while new Date('2024-01-05T00:00') parses as local time (off-by-one day displays in negative-offset zones); month index is 0-based in constructors; range +-8.64e15 ms
      precision_limits: Dates within +-100,000,000 days of 1970
      performance_notes: Prefer integer epoch-day for bulk storage
    typescript:
      type_name: Date / string (no date-only type; Temporal types via polyfill)
      size_bytes: Date object holds one double (8 bytes) plus object header
      width: fixed
      null_support: none (null / Invalid Date)
      primitive_or_object: object
      de_use: Date columns usually kept as ISO strings or epoch-day numbers
      conversion_risks: new Date('2024-01-05') parses as UTC midnight while new Date('2024-01-05T00:00') parses as local time (off-by-one day displays in negative-offset zones); month index is 0-based in constructors; range +-8.64e15 ms
      precision_limits: Dates within +-100,000,000 days of 1970
      performance_notes: Prefer integer epoch-day for bulk storage
    julia:
      type_name: Dates.Date (stdlib Dates)
      size_bytes: 'unverified: 8 (Int64 day count; unverified exact epoch convention, uses proleptic Gregorian)'
      width: fixed
      null_support: none (Missing via Union)
      primitive_or_object: primitive isbits value type
      de_use: Date columns
      conversion_risks: 'unverified: Dates.value(Date) is days from a Rata Die based epoch, not 1970 (Dates.date2epochdays / unix2datetime for conversion; unverified exact offset); Date(y,m,d) throws on invalid; no timezone concept'
      precision_limits: Range limited by Int64 days (effectively unlimited)
      performance_notes: Compact isbits; vectors of Date are contiguous
    swift:
      type_name: 'No date-only type: Foundation Date is an instant (Double seconds since 2001-01-01 UTC); DateComponents(year:month:day:) with Calendar'
      size_bytes: Date 8 (Double)
      width: fixed
      null_support: none (Optional<Date>)
      primitive_or_object: value type (struct)
      de_use: Date columns kept as Date at midnight or as String/Int
      conversion_risks: 'Date has no calendar day semantics: converting needs Calendar and TimeZone (DST gaps can make midnight not exist); reference epoch 2001-01-01 differs from Unix (978,307,200 s offset)'
      precision_limits: 'Double seconds: sub-microsecond precision lost far from 2001'
      performance_notes: Calendar operations are comparatively heavy
    kotlin:
      type_name: kotlinx.datetime.LocalDate (multiplatform library); java.time.LocalDate on the JVM
      size_bytes: Same as Java on JVM (about 24 bytes)
      width: fixed
      null_support: LocalDate?
      primitive_or_object: heap object
      de_use: Date columns
      conversion_risks: kotlinx-datetime is a separate dependency, not stdlib (kotlin.time covers durations and Instant only); same zone-conversion pitfalls
      precision_limits: Library-defined
      performance_notes: Same as Java
    scala:
      type_name: java.time.LocalDate
      size_bytes: Same as Java (about 24 bytes)
      width: fixed
      null_support: none (Option[LocalDate])
      primitive_or_object: immutable heap object
      de_use: Date columns; Spark DateType maps here
      conversion_risks: Same as Java; Spark converts java.sql.Date vs LocalDate depending on spark.sql.datetime.java8API.enabled
      precision_limits: Years -999999999..+999999999
      performance_notes: Same as Java
    r:
      type_name: Date class (double days since 1970-01-01, with class attribute); as.Date
      size_bytes: 8 per element (double) + vector header
      width: fixed
      null_support: NA_real_ sentinel
      primitive_or_object: vector of values with S3 class
      de_use: Date columns
      conversion_risks: as.Date('2024-13-01') errors or NA depending on format; as.Date(numeric) origin default became 1970-01-01 only from R 4.3 (earlier required origin=); integer vs double storage varies; Excel serial dates use 1899-12-30 origin
      precision_limits: Double precision days; practically unlimited
      performance_notes: Compact vectorized storage
    pg:
      type_name: date
      size_bytes: '4'
      width: fixed
      null_support: 'NULL'
      primitive_or_object: row-store value
      de_use: Date columns and partition keys
      conversion_risks: Range 4713 BC..5874897 AD; accepts special values 'infinity', '-infinity'; internal epoch is 2000-01-01 but all outputs are consistent; date + integer adds days; date - date gives integer
      precision_limits: 4713 BC to 5874897 AD
      performance_notes: 4 bytes; btree on date is compact
    duckdb:
      type_name: DATE
      size_bytes: 4 (int32 days since 1970-01-01)
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Date columns; year(), date_trunc, strftime
      conversion_risks: Supports 'infinity'; casting TIMESTAMP to DATE truncates toward negative infinity in UTC; range roughly 5877641 BC..5881580 AD
      precision_limits: Day resolution
      performance_notes: Cheap int32 comparisons and zone maps
    arrow:
      type_name: Arrow date32 (int32 days since 1970-01-01), date64 (int64 milliseconds, should be multiple of 86,400,000); Parquet DATE (INT32)
      size_bytes: 4 (date32) / 8 (date64) + validity bitmap
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Interchange for dates
      conversion_risks: date64 is rarely used and has no integer-day guarantee in older writers; some tools map date32 to datetime64[ns] and overflow outside 1677..2262
      precision_limits: Exact day count
      performance_notes: date32 is the compact canonical form
- id: time
  title: Time of day (no date)
  category: temporal
  description: Time-of-day with optional fractional seconds; usually no timezone.
  cells:
    cpp:
      type_name: std::chrono::hh_mm_ss<Duration> (C++20) over a std::chrono::duration; or int64 nanoseconds
      size_bytes: Duration rep size (typically 8 for nanoseconds)
      width: fixed
      null_support: none (std::optional)
      primitive_or_object: value type
      de_use: Event time-of-day features
      conversion_risks: hh_mm_ss is a formatting view of a duration (no wrap at 24h by itself); no stdlib timezone-aware time-of-day
      precision_limits: 'Nanosecond duration rep: about 292 years span'
      performance_notes: Plain integer arithmetic
    rust:
      type_name: No std type; chrono::NaiveTime (8 bytes), time::Time, std::time::Duration for spans
      size_bytes: chrono NaiveTime 8 (secs u32 + frac u32)
      width: fixed
      null_support: none (Option)
      primitive_or_object: value type
      de_use: Time-of-day columns
      conversion_risks: 'unverified: chrono allows leap-second encoding as nanosecond >= 1e9 (unverified detail); Duration is unsigned and cannot be negative'
      precision_limits: Nanoseconds
      performance_notes: Copy type
    java:
      type_name: java.time.LocalTime; java.time.Duration for spans
      size_bytes: 'Object: header 12 + byte hour, minute, second + int nano (about 24 bytes)'
      width: fixed
      null_support: Nullable reference
      primitive_or_object: immutable heap object
      de_use: Time-of-day columns
      conversion_risks: LocalTime has nanosecond precision (JDBC drivers may truncate to millis/micros); java.sql.Time is legacy and zone-dependent
      precision_limits: Nanoseconds
      performance_notes: Allocation per value; use long nanoOfDay in bulk
    csharp:
      type_name: TimeOnly (.NET 6+) for time-of-day; TimeSpan for durations
      size_bytes: 8 (long ticks, 100 ns each)
      width: fixed
      null_support: none (TimeOnly? Nullable)
      primitive_or_object: value type (struct)
      de_use: Time-of-day columns
      conversion_risks: Tick resolution is 100 ns so nanoseconds cannot be represented; TimeSpan can be negative or exceed 24h so is not time-of-day; SQL time maps to TimeSpan in older ADO.NET
      precision_limits: 100 ns
      performance_notes: Cheap struct
    go:
      type_name: 'No time-of-day type: time.Duration since midnight (int64 ns) or civil.Time (cloud.google.com/go/civil)'
      size_bytes: Duration 8
      width: fixed
      null_support: none
      primitive_or_object: primitive value type (int64 alias)
      de_use: Time-of-day stored as Duration or seconds
      conversion_risks: time.Time always includes a date (year 1 default); Duration overflows after about 292 years
      precision_limits: Nanoseconds
      performance_notes: Plain int64
    python:
      type_name: datetime.time
      size_bytes: 'unverified: 24 or more bytes per object (unverified exact); numpy has no time-of-day type (timedelta64)'
      width: fixed
      null_support: none (None)
      primitive_or_object: immutable heap object
      de_use: Time-of-day columns
      conversion_risks: Microsecond resolution only (no nanoseconds); time with tzinfo is allowed and unaffected by DST; cannot add time + timedelta directly
      precision_limits: Microseconds
      performance_notes: Object per value
    javascript:
      type_name: 'unverified: No time-of-day type; Temporal.PlainTime is a proposal (unverified); numbers of milliseconds since midnight or strings'
      size_bytes: 8 (number)
      width: fixed
      null_support: none
      primitive_or_object: primitive number / string
      de_use: Time-of-day columns kept as strings or ms numbers
      conversion_risks: Date objects always carry a date; parsing 'HH:MM' with new Date fails (Invalid Date); no timezone-free type
      precision_limits: Milliseconds (Date)
      performance_notes: Plain numbers
    typescript:
      type_name: number / string (no time-of-day type)
      size_bytes: 8 (number)
      width: fixed
      null_support: none
      primitive_or_object: primitive number / string
      de_use: Time-of-day columns kept as strings or ms numbers
      conversion_risks: Date objects always carry a date; parsing 'HH:MM' with new Date fails (Invalid Date); no timezone-free type
      precision_limits: Milliseconds (Date)
      performance_notes: Plain numbers
    julia:
      type_name: Dates.Time (stdlib)
      size_bytes: 8 (Int64 nanoseconds since midnight)
      width: fixed
      null_support: none (Missing via Union)
      primitive_or_object: primitive isbits value type
      de_use: Time-of-day columns
      conversion_risks: Nanosecond precision; arithmetic with Date requires conversion to DateTime; Time(24) throws
      precision_limits: Nanoseconds
      performance_notes: Compact isbits
    swift:
      type_name: 'No time-of-day type: DateComponents(hour:minute:second:nanosecond:) or TimeInterval since midnight'
      size_bytes: 'unverified: DateComponents is a large struct of optional Ints (about 200 bytes: unverified); TimeInterval 8'
      width: fixed
      null_support: optional fields
      primitive_or_object: value type (struct)
      de_use: Time-of-day columns kept as TimeInterval or Int
      conversion_risks: DateComponents has no validation until Calendar resolves it; Double seconds drops nanoseconds
      precision_limits: Double precision seconds
      performance_notes: Prefer Int64 nanoseconds in bulk
    kotlin:
      type_name: 'unverified: kotlinx.datetime.LocalTime (added in kotlinx-datetime 0.7: unverified), java.time.LocalTime on JVM; kotlin.time.Duration for spans'
      size_bytes: Same as Java on JVM
      width: fixed
      null_support: LocalTime?
      primitive_or_object: heap object
      de_use: Time-of-day columns
      conversion_risks: Library dependency; Duration is an inline class over Long with a nanosecond/millisecond range switch
      precision_limits: Nanoseconds
      performance_notes: Same as Java
    scala:
      type_name: java.time.LocalTime; scala.concurrent.duration.Duration for spans
      size_bytes: Same as Java (about 24 bytes)
      width: fixed
      null_support: none (Option[LocalTime])
      primitive_or_object: immutable heap object
      de_use: Time-of-day columns
      conversion_risks: Same as Java; scala Duration is not time-of-day
      precision_limits: Nanoseconds
      performance_notes: Same as Java
    r:
      type_name: 'No base time-of-day class: hms::hms (difftime based) in package hms, data.table::ITime (integer seconds), or difftime'
      size_bytes: 8 (double seconds)
      width: fixed
      null_support: NA_real_ sentinel
      primitive_or_object: vector of values with S3 class
      de_use: Time-of-day columns
      conversion_risks: difftime units are auto-selected on subtraction (secs/mins/hours/days) and silently change meaning; ITime is integer seconds (no sub-second)
      precision_limits: Double seconds (about microseconds)
      performance_notes: Compact
    pg:
      type_name: time [(p)] without time zone; time with time zone (timetz, discouraged)
      size_bytes: time 8; timetz 12
      width: fixed
      null_support: 'NULL'
      primitive_or_object: row-store value
      de_use: Time-of-day columns
      conversion_risks: Microsecond resolution (p up to 6); 24:00:00 allowed as end-of-day; timetz comparisons need zone offsets and docs discourage its use
      precision_limits: Microseconds
      performance_notes: Fixed width
    duckdb:
      type_name: 'unverified: TIME (microseconds); TIMETZ; TIME_NS in newer versions (unverified)'
      size_bytes: '8'
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Time-of-day columns
      conversion_risks: Microsecond precision; casting TIMESTAMP to TIME drops the date; TIMETZ rarely supported by clients
      precision_limits: Microseconds
      performance_notes: Vectorized
    arrow:
      type_name: Arrow time32 (s or ms) and time64 (us or ns); Parquet TIME(isAdjustedToUTC, unit MILLIS/MICROS/NANOS)
      size_bytes: 4 (time32) / 8 (time64) + validity bitmap
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Interchange for time-of-day
      conversion_risks: 'Unit is part of the type: casting between units truncates or multiplies and can overflow; Parquet INT32 for millis, INT64 for micros/nanos'
      precision_limits: Unit-defined
      performance_notes: Compact
- id: timestamp
  title: Timestamp (with and without timezone, precision)
  category: temporal
  description: An instant in time (UTC-based) or a local wall-clock datetime; resolution from seconds to nanoseconds.
  cells:
    cpp:
      type_name: 'std::chrono::system_clock::time_point (instant, epoch 1970 UTC since C++20, resolution implementation-defined: ns on libstdc++/libc++ Linux, 100 ns on MSVC); std::chrono::local_time and zoned_time (C++20)'
      size_bytes: 8 (int64 count in common implementations)
      width: fixed
      null_support: none (std::optional)
      primitive_or_object: value type
      de_use: Event timestamps
      conversion_risks: 'unverified: system_clock resolution and epoch pre-C++20 are unspecified; time_zone database support needs a recent library (libstdc++ 13+, MSVC; libc++ partial: unverified); converting local_time requires zone and can be ambiguous across DST; time_t is seconds and 2038-limited when 32-bit'
      precision_limits: 'Representation-dependent: int64 ns spans about +-292 years from 1970'
      performance_notes: Integer arithmetic; clock reads cost ~20-30 ns
    rust:
      type_name: std::time::SystemTime (opaque instant, not calendar), std::time::Instant (monotonic); chrono::DateTime<Utc>/NaiveDateTime, time::OffsetDateTime, jiff::Timestamp
      size_bytes: 'unverified: SystemTime 16 on Linux (secs + nanos); chrono DateTime<Utc> 12 (NaiveDate 4 + NaiveTime 8, no zone pointer for Utc: unverified)'
      width: fixed
      null_support: none (Option)
      primitive_or_object: value type
      de_use: Event timestamps
      conversion_risks: SystemTime has no calendar API (needs chrono/time); Instant must never be persisted; NaiveDateTime has no zone and silently mixes local and UTC; timestamp_nanos_opt returns None outside about 1677..2262
      precision_limits: Nanoseconds in chrono; i64 microseconds for Arrow interchange
      performance_notes: Copy type; arithmetic cheap; zone conversions cost
    java:
      type_name: java.time.Instant (UTC instant, seconds + nanos), LocalDateTime (no zone), OffsetDateTime, ZonedDateTime; java.util.Date and java.sql.Timestamp (legacy)
      size_bytes: Instant object about 24 bytes (long seconds + int nanos + header); LocalDateTime about 32
      width: fixed (logical)
      null_support: Nullable reference
      primitive_or_object: immutable heap objects
      de_use: Event timestamps; Instant for UTC; JDBC getObject(OffsetDateTime)
      conversion_risks: 'Instant has nanosecond precision but many sinks keep micros (PG) or millis (java.util.Date): conversion truncates; java.sql.Timestamp.toLocalDateTime uses default JVM zone; DST gaps/overlaps for LocalDateTime->ZonedDateTime; Instant.toEpochMilli throws ArithmeticException on overflow'
      precision_limits: Nanoseconds; seconds range +-31,556,889,864,403,199
      performance_notes: Allocation per value; store long epoch micros for bulk
    csharp:
      type_name: DateTime (Kind Utc/Local/Unspecified), DateTimeOffset (instant + offset), TimeProvider; no nanoseconds
      size_bytes: DateTime 8 (62-bit ticks of 100 ns since 0001-01-01 + 2-bit Kind); DateTimeOffset 16
      width: fixed
      null_support: none (DateTime? Nullable)
      primitive_or_object: value type (struct)
      de_use: Event timestamps; DateTimeOffset preferred for instants
      conversion_risks: DateTime.Kind is lost or ignored on many serializers and Unspecified is treated as local by ToUniversalTime; equality ignores Kind; 100 ns resolution truncates nanoseconds; epoch is 0001-01-01 (Unix epoch offset 621,355,968,000,000,000 ticks); DateTimeOffset does not carry a zone ID so DST rules are lost
      precision_limits: 100 ns; years 1..9999
      performance_notes: Cheap value types; zone conversions via TimeZoneInfo cost
    go:
      type_name: time.Time (instant with optional location, ns resolution, monotonic reading); Unix epoch helpers
      size_bytes: 24 (wall uint64, ext int64, loc *Location)
      width: fixed
      null_support: none (zero Time is year 1 UTC; *time.Time for null)
      primitive_or_object: struct value type
      de_use: Event timestamps
      conversion_risks: == compares wall, monotonic, and location (use Equal); the monotonic reading is stripped by Round(0) or serialization; time.Parse without zone assumes UTC; UnixNano overflows int64 outside 1678..2262; Unix timestamps in seconds vs millis confusion
      precision_limits: Nanoseconds
      performance_notes: 24 bytes per timestamp; use int64 micros for bulk
    python:
      type_name: datetime.datetime (naive or aware via tzinfo; zoneinfo in stdlib since 3.9); no nanoseconds; pandas.Timestamp (ns) / numpy datetime64 (us or ns)
      size_bytes: 'unverified: datetime object about 48 bytes (unverified exact); numpy datetime64 8 per element'
      width: fixed
      null_support: none (None; NaT in numpy/pandas)
      primitive_or_object: immutable heap object; numpy packed
      de_use: Event timestamps; use aware UTC datetimes
      conversion_risks: Naive and aware datetimes cannot be compared (TypeError); datetime.utcnow() returns naive (deprecated in 3.12); fold attribute handles DST ambiguity; microsecond resolution truncates ns; pandas ns-based range ends at 2262-04-11 (OutOfBoundsDatetime); fromtimestamp uses local zone
      precision_limits: Microseconds (datetime); nanoseconds (pandas)
      performance_notes: Object per value; numpy/pyarrow arrays for bulk
    javascript:
      type_name: 'unverified: Date (instant; milliseconds since 1970-01-01 UTC as a double); Temporal.Instant/ZonedDateTime is a proposal (unverified); performance.now for monotonic'
      size_bytes: Date object holds one double (8 bytes) plus object header
      width: fixed
      null_support: none (Invalid Date; null)
      primitive_or_object: object
      de_use: Event timestamps
      conversion_risks: 'Millisecond resolution only: microsecond and nanosecond values from Parquet/Arrow are truncated (BigInt needed to carry them); Date has no zone (always UTC internally, local formatting by default); getMonth() is 0-based; Date.parse of non-ISO strings is implementation-defined'
      precision_limits: Milliseconds; range +-8.64e15 ms (about 275,760 years)
      performance_notes: Date objects allocate; use numbers (epoch ms) for bulk
    typescript:
      type_name: Date / number epoch ms (no separate timestamp type)
      size_bytes: Date object holds one double (8 bytes) plus object header
      width: fixed
      null_support: none (Invalid Date; null)
      primitive_or_object: object
      de_use: Event timestamps
      conversion_risks: 'Millisecond resolution only: microsecond and nanosecond values from Parquet/Arrow are truncated (BigInt needed to carry them); Date has no zone (always UTC internally, local formatting by default); getMonth() is 0-based; Date.parse of non-ISO strings is implementation-defined'
      precision_limits: Milliseconds; range +-8.64e15 ms (about 275,760 years)
      performance_notes: Date objects allocate; use numbers (epoch ms) for bulk
    julia:
      type_name: Dates.DateTime (stdlib; no zone, millisecond precision); TimeZones.jl ZonedDateTime; Dates.now / time_ns
      size_bytes: DateTime 8 (Int64 milliseconds)
      width: fixed
      null_support: none (Missing via Union)
      primitive_or_object: primitive isbits value type
      de_use: Event timestamps
      conversion_risks: stdlib DateTime cannot hold microseconds or nanoseconds (use Int64 or Nanosecond periods separately); no zone in stdlib (TimeZones.jl is a package); unix2datetime(seconds) truncates sub-millisecond; arithmetic with Period types
      precision_limits: Milliseconds
      performance_notes: Compact isbits; vectors contiguous
    swift:
      type_name: 'Foundation Date (instant: Double seconds since 2001-01-01 00:00:00 UTC); TimeZone and Calendar separate; ContinuousClock/SuspendingClock for monotonic'
      size_bytes: Date 8 (Double)
      width: fixed
      null_support: none (Optional<Date>)
      primitive_or_object: value type (struct)
      de_use: Event timestamps
      conversion_risks: 'unverified: Double precision degrades with magnitude (about 0.24 microsecond resolution near the present: unverified), so microsecond timestamps may not round-trip; reference epoch 2001-01-01 vs Unix (978,307,200 s); Date has no zone so formatting depends on the formatter''s TimeZone'
      precision_limits: Sub-microsecond only near the epoch
      performance_notes: Compact; DateFormatter creation is expensive (cache it)
    kotlin:
      type_name: 'unverified: kotlin.time.Instant (stdlib, Kotlin 2.1+, experimental in some versions: unverified) / kotlinx.datetime.Instant; java.time.Instant on JVM'
      size_bytes: Same as Java on JVM
      width: fixed
      null_support: Instant?
      primitive_or_object: heap object
      de_use: Event timestamps
      conversion_risks: Same precision/zone pitfalls as Java; library split (stdlib Instant vs kotlinx-datetime) changes across versions
      precision_limits: Nanoseconds
      performance_notes: Same as Java
    scala:
      type_name: java.time.Instant / LocalDateTime / OffsetDateTime / ZonedDateTime; java.sql.Timestamp in JDBC and Spark
      size_bytes: Same as Java
      width: fixed
      null_support: none (Option)
      primitive_or_object: immutable heap object
      de_use: Event timestamps; Spark TimestampType (micros, session zone)
      conversion_risks: Spark TimestampType is microseconds in the session time zone (spark.sql.session.timeZone), TimestampNTZType has no zone; Instant nanoseconds truncate to micros
      precision_limits: Nanoseconds (java.time); microseconds (Spark)
      performance_notes: Same as Java
    r:
      type_name: POSIXct (double seconds since 1970-01-01 UTC with tzone attribute), POSIXlt (list of components), Sys.time
      size_bytes: 8 per element (POSIXct)
      width: fixed
      null_support: NA_real_ sentinel
      primitive_or_object: vector of values with S3 class
      de_use: Event timestamps
      conversion_risks: 'Double seconds: about microsecond resolution at present, nanoseconds lost; tzone attribute may be '''' (local zone) so printing changes with TZ; as.POSIXct(string) without tz uses the session zone; POSIXlt is huge (nested list); data.table IDate/ITime split'
      precision_limits: About 1 microsecond near present
      performance_notes: Compact; POSIXlt is slow
    pg:
      type_name: timestamp [(p)] without time zone; timestamp with time zone (timestamptz) stores UTC
      size_bytes: 8 (int64 microseconds since 2000-01-01)
      width: fixed
      null_support: 'NULL'
      primitive_or_object: row-store value
      de_use: 'Event timestamps: timestamptz is the recommended type for instants'
      conversion_risks: Microsecond resolution (cannot store ns); timestamptz does not store a zone, it converts to UTC on input and to the session TimeZone on output; timestamp without zone silently ignores zone offsets in input literals; range 4713 BC..294276 AD; 'infinity' special values
      precision_limits: Microseconds
      performance_notes: Fixed 8 bytes; btree/BRIN friendly
    duckdb:
      type_name: TIMESTAMP (microseconds), TIMESTAMP_S, TIMESTAMP_MS, TIMESTAMP_NS, TIMESTAMP WITH TIME ZONE (TIMESTAMPTZ, UTC microseconds)
      size_bytes: 8 (int64)
      width: fixed
      null_support: NULL via validity mask
      primitive_or_object: columnar vector value
      de_use: Event timestamps
      conversion_risks: TIMESTAMPTZ displays in session TimeZone setting (needs ICU extension); casting between precisions truncates; TIMESTAMP_NS range limited to about 1677..2262
      precision_limits: Microseconds default; nanoseconds with TIMESTAMP_NS
      performance_notes: Vectorized int64 compares
    arrow:
      type_name: Arrow timestamp(unit, tz) with unit s/ms/us/ns, tz optional; Parquet TIMESTAMP(isAdjustedToUTC, unit MILLIS/MICROS/NANOS), legacy INT96
      size_bytes: 8 (int64) + validity bitmap
      width: fixed
      null_support: validity bitmap / definition levels
      primitive_or_object: columnar buffer value
      de_use: Interchange for event times
      conversion_risks: 'tz present means UTC instants with display zone, tz absent means local wall clock (no zone): confusing them shifts hours; Parquet isAdjustedToUTC=false is local semantics; INT96 is deprecated nanosecond-of-day + Julian day; engines differ on unit coercion (Spark writes micros)'
      precision_limits: Unit-defined (up to ns)
      performance_notes: Contiguous int64; unit cast can overflow for ns outside 1677..2262
- id: nullable
  title: Nullable / optional value
  category: nullability-and-errors
  description: 'How absence of a value is represented: native null, optional wrapper, or sentinel.'
  cells:
    cpp:
      type_name: std::optional<T> (C++17); raw/smart pointers with nullptr; std::variant<std::monostate,T>; sentinel values
      size_bytes: sizeof(optional<T>) = sizeof(T) + 1 rounded up for alignment (optional<int32_t> is 8, optional<double> is 16)
      width: fixed
      null_support: optional wrapper (or nullptr for pointers)
      primitive_or_object: value type
      de_use: Nullable columns in structs; row-oriented decoding
      conversion_risks: Dereferencing an empty optional is UB (value() throws bad_optional_access); optional<bool> has three states, easy to mis-test; nullptr deref is UB
      precision_limits: N/A
      performance_notes: Extra byte doubles size of 4/8-byte values; Arrow-style separate bitmaps are denser
    rust:
      type_name: Option<T> (Some/None); NonNull and niche optimization
      size_bytes: Option<&T>, Option<Box<T>>, Option<NonZeroU32> are the same size as T (niche); Option<u32> is 8; Option<f64> 16
      width: fixed
      null_support: optional wrapper (enum)
      primitive_or_object: value type
      de_use: Nullable columns; None for missing
      conversion_risks: No null pointers in safe Rust; unwrap() panics on None; Option<f64> uses a separate tag so None differs from NaN
      precision_limits: N/A
      performance_notes: Niche layout is free for references; tag costs padding for primitives
    java:
      type_name: null for reference types (including boxed Integer, String); Optional<T> for returns; primitives cannot be null
      size_bytes: Reference 4 bytes (compressed oops) or 8; Optional object ~16 bytes; boxed Integer ~16
      width: fixed (reference)
      null_support: native null (references) / optional wrapper
      primitive_or_object: reference types / boxed
      de_use: Nullable columns as Integer/Double or with a separate boolean/BitSet mask
      conversion_risks: NullPointerException on unboxing null; Optional is not Serializable and not for fields/parameters by convention; null in HashMap keys allowed but in ConcurrentHashMap not
      precision_limits: N/A
      performance_notes: Boxing nullable numerics causes pointer chasing and GC pressure; parallel primitive arrays plus a null bitmap are faster
    csharp:
      type_name: Nullable<T> / T? for value types; null for references; nullable reference types (C# 8) are compile-time annotations only
      size_bytes: int? is 8 bytes (4 value + bool padded); double? 16
      width: fixed
      null_support: optional wrapper (value types) / native null (references)
      primitive_or_object: value type (struct) for T?; reference for classes
      de_use: Nullable DB columns and DTOs
      conversion_risks: 'Lifted operators propagate null (null + 1 is null; comparisons with null are false except != which is true: unlike SQL three-valued logic); unboxing null throws; nullable reference annotations are not enforced at runtime'
      precision_limits: N/A
      performance_notes: No allocation (struct); padding doubles size
    go:
      type_name: 'No native optional: pointers (*T) with nil, database/sql Null types (sql.NullInt64, sql.NullString), generics-based Option libraries, or zero value plus ok flag'
      size_bytes: Pointer 8; sql.NullInt64 16 (value + Valid bool padded)
      width: fixed
      null_support: sentinel / pointer / wrapper struct
      primitive_or_object: pointer (heap-allocated target) or struct
      de_use: Nullable columns with database/sql; JSON null
      conversion_risks: json.Unmarshal cannot distinguish missing from null for non-pointer fields; zero values mask absence (0, '', false); nil map/slice are valid reads but nil map writes panic
      precision_limits: N/A
      performance_notes: Pointers force allocation and GC scanning; use a parallel []bool for bulk data
    python:
      type_name: None (single NoneType object); Optional[T] type hint (same as T or None); pandas nullable dtypes (Int64, boolean, string) with pd.NA; numpy masked arrays
      size_bytes: None is a singleton (no per-value cost); a list slot is an 8-byte pointer; numpy masked array adds a bool mask of 1 byte per element
      width: variable
      null_support: native null (None)
      primitive_or_object: heap object singleton
      de_use: 'Nullable columns: pandas converts int columns with None to float64 NaN unless nullable dtypes are used'
      conversion_risks: None == None is True and None < 1 raises TypeError; NaN and None are different (pandas treats both as missing in isna); int column plus NaN silently becomes float64 (precision loss above 2^53); pd.NA propagates in boolean logic
      precision_limits: N/A
      performance_notes: Object columns with None are slow (Python objects); pyarrow-backed dtypes use bitmaps
    javascript:
      type_name: null and undefined (two distinct absent values); NaN for numeric failure; optional chaining ?. and nullish coalescing ??
      size_bytes: null/undefined are singletons; typed arrays cannot store null
      width: variable
      null_support: native null / undefined
      primitive_or_object: primitives
      de_use: Nullable JSON fields
      conversion_risks: typeof null is 'object'; null == undefined is true but null === undefined is false; 0 || x treats 0 as missing (use ??); JSON omits undefined but keeps null; Number(null) is 0 and Number(undefined) is NaN
      precision_limits: N/A
      performance_notes: Typed arrays need a separate mask for nulls
    typescript:
      type_name: 'T or null or undefined (union types) with strictNullChecks; optional properties (x?: T) and optional chaining'
      size_bytes: null/undefined are singletons; typed arrays cannot store null
      width: variable
      null_support: native null / undefined
      primitive_or_object: primitives
      de_use: Nullable JSON fields
      conversion_risks: 'Compile-time only: types are erased and the JSON actually received may violate declared nullability; strictNullChecks is off by default without strict)'
      precision_limits: N/A
      performance_notes: Typed arrays need a separate mask for nulls
    julia:
      type_name: missing (type Missing) with Union{T,Missing}; nothing (type Nothing) for 'no value'; sentinels like NaN
      size_bytes: 'unverified: Union{Int64,Missing} array: elements stored in a compact ''selector'' layout (value bytes + 1 type tag byte per element: unverified); missing itself is a singleton'
      width: fixed (union-split)
      null_support: native missing / union type
      primitive_or_object: isbits union arrays inline for small unions
      de_use: Nullable columns (DataFrames.jl); SQL-like three-valued logic
      conversion_risks: missing propagates through arithmetic and comparison (missing == 1 is missing); if missing throws TypeError; nothing is a different concept (programmatic absence); sum(skipmissing(x)) required
      precision_limits: N/A
      performance_notes: Small Union types are optimized (Union splitting) and avoid boxing, but vectors of Union{T,Missing} are slower than plain vectors
    swift:
      type_name: Optional<T> (T?), nil; optional chaining and ??
      size_bytes: Int? is 9 bytes (8 + 1 tag, stride 16); String? is 16 (spare bits); class refs 8
      width: fixed
      null_support: optional wrapper (enum)
      primitive_or_object: value type (enum)
      de_use: Nullable columns and Codable decoding
      conversion_risks: Force unwrapping nil crashes; Optional<Optional<T>> is distinct from T? in generics; Double? uses a separate tag so nil differs from nan
      precision_limits: N/A
      performance_notes: Tag byte inflates stride for primitives; no heap allocation
    kotlin:
      type_name: Nullable types T? (null-safety in the type system); Optional is Java only
      size_bytes: 'Reference nullable: 4-8 bytes; Int? on JVM is boxed java.lang.Integer (~16 bytes)'
      width: fixed
      null_support: native null (type-checked)
      primitive_or_object: boxed for numerics; reference for classes
      de_use: Nullable columns
      conversion_risks: Safe-call/elvis operators; !! throws NullPointerException; platform types (T!) from Java bypass null checks; List<Int?> boxes everything
      precision_limits: N/A
      performance_notes: Nullable primitives box on the JVM (like Java); use parallel arrays for bulk
    scala:
      type_name: Option[T] (Some/None); null for AnyRef (avoid); Scala 3 explicit nulls optional flag
      size_bytes: Some(x) is an object ~16 bytes (+ boxed value); None is a singleton
      width: fixed (reference)
      null_support: optional wrapper
      primitive_or_object: heap object (Some)
      de_use: Nullable columns and Spark rows (Option or null)
      conversion_risks: Option(null) is None but Some(null) is Some; Spark Row getAs on null primitive throws; pattern matching on Option is idiomatic; Option[Int] boxes the Int
      precision_limits: N/A
      performance_notes: Allocation per Some; Spark internal rows use null bitmaps instead
    r:
      type_name: NA with typed variants (NA_integer_, NA_real_, NA_character_, logical NA); NULL (zero-length absence) is different; NaN is a separate floating value
      size_bytes: 'Sentinels occupy the normal element width: integer/logical NA = INT_MIN (4 bytes), double NA = NaN with payload 1954 (8 bytes)'
      width: fixed
      null_support: sentinel (NA)
      primitive_or_object: vector of values
      de_use: Nullable columns in data frames
      conversion_risks: NA is contagious (NA + 1 is NA, NA == NA is NA, so use is.na()); NULL is not NA (c(1, NULL) drops it); integer NA means INT_MIN is not a usable value; NA_real_ can be accidentally converted to NaN by some operations
      precision_limits: INT_MIN reserved for NA in integer
      performance_notes: No separate mask (sentinel in-line); is.na() scans the data
    pg:
      type_name: NULL (any type); three-valued logic; COALESCE, IS DISTINCT FROM
      size_bytes: 'A null bitmap in the tuple header: 1 bit per column, present only if the row has any NULL; NULL values take no data bytes'
      width: variable
      null_support: native null (null bitmap)
      primitive_or_object: row-store
      de_use: Nullable columns
      conversion_risks: NULL = NULL is NULL (not true); WHERE x <> 1 excludes NULL rows; NOT IN with NULL in the list returns no rows; aggregates skip NULLs but count(*) counts them; NaN is not NULL
      precision_limits: N/A
      performance_notes: Null bitmap makes sparse NULL columns cheap; indexes can include or skip NULLs
    duckdb:
      type_name: NULL (any type); validity mask per vector; three-valued logic; COALESCE, IS DISTINCT FROM
      size_bytes: 1 bit per value in a validity mask (allocated lazily when any NULL exists)
      width: variable
      null_support: native null (validity mask)
      primitive_or_object: columnar vector
      de_use: Nullable columns
      conversion_risks: 'unverified: Same three-valued semantics as PostgreSQL; NULLs sort last by default (NULLS LAST default changed from version 0.8: unverified); NaN is distinct from NULL; JSON null vs SQL NULL'
      precision_limits: N/A
      performance_notes: Lazy validity masks cost nothing for non-null data; bit ops for null propagation
    arrow:
      type_name: Validity bitmap (1 bit per value, optional buffer) per array; Parquet optional fields with definition levels; null type for all-null columns
      size_bytes: 1 bit per value (validity bitmap); Parquet definition levels RLE/bit-packed
      width: variable
      null_support: validity bitmap
      primitive_or_object: columnar buffer
      de_use: Interchange of nullable columns
      conversion_risks: Null slots still occupy value bytes (contents undefined); readers into languages without nulls convert to NaN, None or sentinel (int columns with nulls become float64 in pandas by default); Parquet required vs optional is part of the schema
      precision_limits: N/A
      performance_notes: Bitmap checks vectorize well; null_count cached to skip checks
- id: error_result
  title: Error / result type
  category: nullability-and-errors
  description: 'How failures are modeled: exceptions, result/either types, error values, or NULL on failed casts.'
  cells:
    cpp:
      type_name: Exceptions (std::exception hierarchy); std::expected<T,E> (C++23); std::error_code / std::system_error; std::optional for absence
      size_bytes: std::expected<T,E> is roughly max(sizeof T, sizeof E) + discriminant; exceptions are heap-allocated
      width: variable
      null_support: optional wrapper (expected)
      primitive_or_object: value type (expected) / heap objects (exceptions)
      de_use: Parsing results, I/O errors
      conversion_risks: Exception cost is high on the throw path (microseconds); noexcept functions that throw terminate; std::stoi throws on bad input but accepts trailing garbage; from_chars returns error codes without exceptions
      precision_limits: N/A
      performance_notes: Zero-cost exceptions on the happy path but large code size; expected avoids unwinding cost
    rust:
      type_name: Result<T, E>, Option<T>, panic! for bugs; the ? operator; anyhow/thiserror crates
      size_bytes: Result<T,E> size = max(T, E) plus tag (niches can remove the tag)
      width: fixed
      null_support: optional wrapper (enum)
      primitive_or_object: value type
      de_use: Parsing, I/O, per-row validation (collect::<Result<Vec<_>,_>>)
      conversion_risks: Result must be used (warning); unwrap/expect panic; panics can abort or unwind depending on panic setting; integer overflow panics are debug-only
      precision_limits: N/A
      performance_notes: No unwinding on error path; Result in hot loops is cheap
    java:
      type_name: 'Exceptions: checked (Exception) and unchecked (RuntimeException, Error); try-with-resources; Optional for absence'
      size_bytes: Exception objects capture a stack trace (about hundreds of bytes to several kB); creation is costly
      width: variable
      null_support: n/a
      primitive_or_object: heap objects
      de_use: I/O and parse errors; JDBC SQLException
      conversion_risks: Integer.parseInt throws NumberFormatException on bad input (slow in hot loops, use a manual parser or pre-validation); swallowing exceptions loses data; checked exceptions do not compose with lambdas
      precision_limits: N/A
      performance_notes: Throwing is expensive due to stack trace filling (override fillInStackTrace or reuse); JIT handles non-throwing paths well
    csharp:
      type_name: Exceptions (no checked exceptions); TryParse/TryGetValue pattern (bool + out value); ValueTuple returns; no standard Result type in BCL
      size_bytes: Exception object with stack trace (large); out parameter costs nothing
      width: variable
      null_support: n/a
      primitive_or_object: heap objects / bool+out
      de_use: Parse failures via TryParse
      conversion_risks: int.Parse throws FormatException; TryParse is culture-sensitive unless CultureInfo.InvariantCulture is passed; exceptions are slow when frequently thrown (tens of microseconds)
      precision_limits: N/A
      performance_notes: Prefer TryParse in hot paths; first-chance exception cost is high
    go:
      type_name: error interface (value implementing Error() string); multiple return values (T, error); errors.Is/As and %w wrapping; panic/recover for exceptional cases
      size_bytes: error interface value 16 bytes (type + data pointer); errors.New allocates
      width: fixed
      null_support: interface value (nil means success)
      primitive_or_object: interface (pointer to heap value)
      de_use: Every I/O and parse call returns error
      conversion_risks: Ignoring the error return is legal and common; a nil *MyError stored in an error interface is not == nil (typed-nil gotcha); strconv.Atoi errors include the input string
      precision_limits: N/A
      performance_notes: Cheap on happy path; error wrapping allocates
    python:
      type_name: Exceptions (BaseException hierarchy); try/except/else/finally; no built-in Result; contextlib.suppress
      size_bytes: Exception objects ~60+ bytes plus traceback frames
      width: variable
      null_support: n/a
      primitive_or_object: heap objects
      de_use: Parse and validation errors
      conversion_risks: int('1_000') succeeds (underscores allowed), int(' 12 ') succeeds (whitespace stripped), float('nan') parses; bare except swallows KeyboardInterrupt; exceptions are cheap relative to other languages when not raised (zero-cost try since 3.11)
      precision_limits: N/A
      performance_notes: Raising costs about 1 microsecond; EAFP is idiomatic but slow if failures are common
    javascript:
      type_name: throw any value (Error objects customary); try/catch; Promise rejection and async errors; no Result type; Number('x') returns NaN instead of throwing
      size_bytes: Error objects hold stack strings (hundreds of bytes)
      width: variable
      null_support: n/a
      primitive_or_object: objects
      de_use: Parse failures often silent (NaN)
      conversion_risks: parseInt('12abc') is 12 and parseInt('') is NaN; JSON.parse throws SyntaxError; unhandled promise rejections terminate Node.js by default since v15; errors thrown in callbacks are not caught by outer try/catch
      precision_limits: N/A
      performance_notes: Throwing captures stack (costly); returning NaN/null avoids it
    typescript:
      type_name: throw / try-catch (catch variable is unknown with useUnknownInCatchVariables); Result types via libraries (neverthrow); no checked exceptions
      size_bytes: Error objects hold stack strings (hundreds of bytes)
      width: variable
      null_support: n/a
      primitive_or_object: objects
      de_use: Parse failures often silent (NaN)
      conversion_risks: ^ (the type system does not track thrown errors; function signatures cannot declare what they throw)
      precision_limits: N/A
      performance_notes: Throwing captures stack (costly); returning NaN/null avoids it
    julia:
      type_name: 'Exceptions (throw, try/catch, error(), custom <: Exception); tryparse returns nothing instead of throwing; Union{T,Nothing} idiom; Some'
      size_bytes: Exception objects heap-allocated
      width: variable
      null_support: optional via Union
      primitive_or_object: heap objects
      de_use: Parse failures via tryparse
      conversion_risks: parse(Int, 'x') throws ArgumentError, tryparse returns nothing; catching all exceptions hides InterruptException; exceptions are relatively slow (microseconds)
      precision_limits: N/A
      performance_notes: Throwing is costly; type-stable Union{T,Nothing} returns are optimized
    swift:
      type_name: Result<Success, Failure>; throws/try/catch (typed throws in Swift 6); Optional via try?; Error protocol
      size_bytes: Result<T,E> = max(T,E) + tag; thrown Error existential is boxed on the heap
      width: variable
      null_support: optional wrapper (enum)
      primitive_or_object: value type (enum)
      de_use: Parsing and I/O
      conversion_risks: try? discards the error and yields nil; Int('abc') returns nil rather than throwing; force try! crashes; errors are not checked for specific types without typed throws
      precision_limits: N/A
      performance_notes: 'Swift errors are ordinary return paths (no unwinding): cheap'
    kotlin:
      type_name: Exceptions (no checked exceptions); kotlin.Result<T> (restricted use as return type), runCatching; sealed classes; toIntOrNull()/toDoubleOrNull()
      size_bytes: Result<T> is an inline value class (no wrapper allocation for success)
      width: variable
      null_support: optional wrapper (Result) / null from *OrNull
      primitive_or_object: value class / heap exceptions
      de_use: Parsing via toIntOrNull; coroutine failure propagation
      conversion_risks: Catching CancellationException breaks coroutine cancellation; runCatching catches all Throwables including Errors; Java checked exceptions are not enforced
      precision_limits: N/A
      performance_notes: Same as Java for exceptions; *OrNull avoids exception cost
    scala:
      type_name: Either[E, A], Try[A] (Success/Failure), Option; exceptions from Java; Scala 3 CanThrow experimental
      size_bytes: Left/Right/Success/Failure objects ~16-24 bytes each
      width: variable
      null_support: optional wrapper (sealed ADT)
      primitive_or_object: heap objects
      de_use: Parsing with toIntOption; validation pipelines
      conversion_risks: Try catches only NonFatal exceptions (InterruptedException and OOM escape); Either is right-biased from 2.12; mixing Try inside flatMap hides stack traces
      precision_limits: N/A
      performance_notes: Allocation per result object; for-comprehensions desugar to closures
    r:
      type_name: 'Conditions: stop() / warning() / message(); tryCatch(), try() returning ''try-error'' object, withCallingHandlers; no Result type; NA for failed coercions'
      size_bytes: try-error is a character vector with attributes; condition objects are lists
      width: variable
      null_support: n/a
      primitive_or_object: objects
      de_use: Error handling around file/DB calls
      conversion_risks: as.numeric('abc') returns NA with a warning (not an error); warnings are deferred and easy to miss; tryCatch(finally=) semantic differences; try(silent=TRUE) returns an object that must be inspected
      precision_limits: N/A
      performance_notes: Condition handling is slow relative to compiled languages
    pg:
      type_name: Errors identified by SQLSTATE codes; EXCEPTION blocks in PL/pgSQL; transactions abort on error; no TRY_CAST (use pg_input_is_valid() / pg_input_error_info() from PG16 or custom functions)
      size_bytes: N/A
      width: variable
      null_support: n/a
      primitive_or_object: n/a
      de_use: Bad data raises errors that abort the whole statement/transaction
      conversion_risks: 'unverified: A single bad value in a bulk INSERT or cast aborts the entire statement; COPY has no skip-bad-rows option before PG17 (ON_ERROR ignore added in PG17: unverified); an error inside a transaction block poisons it until ROLLBACK'
      precision_limits: N/A
      performance_notes: Savepoints per row are expensive; validate with regex or pg_input_is_valid before casting
    duckdb:
      type_name: Errors (Conversion Error, Out of Range Error); TRY_CAST(x AS T) and TRY(expr) return NULL on failure; read_csv ignore_errors / store_rejects
      size_bytes: N/A
      width: variable
      null_support: n/a
      primitive_or_object: n/a
      de_use: Tolerant ingestion of dirty data
      conversion_risks: TRY_CAST silently turns bad values into NULL (data loss is invisible unless counted); integer overflow raises an error rather than wrapping; read_csv with ignore_errors drops rows
      precision_limits: N/A
      performance_notes: TRY_CAST costs about the same as CAST; error path aborts the query
    arrow:
      type_name: 'C++: arrow::Status and arrow::Result<T>; compute functions with safe cast options (CastOptions::Safe raises on overflow/truncation, unsafe truncates); PyArrow raises ArrowInvalid / ArrowTypeError; Parquet has no error type'
      size_bytes: N/A
      width: variable
      null_support: n/a
      primitive_or_object: n/a
      de_use: Casting and schema validation in pipelines
      conversion_risks: 'unverified: pa.compute.cast with safe=True (default) raises ArrowInvalid on overflow or lossy conversion; safe=False silently truncates; no per-row result type (no TRY_CAST equivalent: unverified for recent versions)'
      precision_limits: N/A
      performance_notes: Status/Result avoid exceptions in C++ hot paths
- id: fixed_array
  title: Fixed-size array
  category: collections
  description: A sequence whose length is fixed at creation (compile time or allocation time).
  cells:
    cpp:
      type_name: T[N] (C array), std::array<T,N> (compile-time size), std::span<T,N> view
      size_bytes: N * sizeof(T), no header; lives on stack or inside the enclosing object
      width: fixed
      null_support: none
      primitive_or_object: value type (stack/inline); no heap unless new[]
      de_use: Small fixed-width records, lookup tables, SIMD lanes
      conversion_risks: C arrays decay to pointers and lose size; no bounds checking in operator[] (UB); std::array::at throws; stack overflow for large N
      precision_limits: N/A
      performance_notes: Best cache locality; zero allocation
    rust:
      type_name: '[T; N] (array), &[T] slice, Box<[T]>'
      size_bytes: N * size_of::<T>(); slice reference 16 bytes (pointer + length)
      width: fixed
      null_support: none (array of Option<T>)
      primitive_or_object: value type (stack/inline)
      de_use: Small fixed buffers, lookup tables
      conversion_risks: Indices bounds-checked (panic); N must be a compile-time constant (const generics); large arrays can overflow stack (use Box or Vec)
      precision_limits: N/A
      performance_notes: Contiguous; bounds checks usually elided in loops
    java:
      type_name: T[] (arrays are fixed length once created; Arrays.copyOf to resize)
      size_bytes: 16-byte header (12 + 4 length) + n * element size (references 4 bytes with compressed oops; primitives packed)
      width: fixed (after creation)
      null_support: Nullable reference; elements of reference arrays default null, primitives zero
      primitive_or_object: heap object (reference type)
      de_use: Fixed buffers; primitive arrays for columnar data
      conversion_risks: 'Covariant arrays: ArrayStoreException at runtime (Object[] o = new String[1]); max length 2^31-1; Arrays.equals vs == ; Integer[] boxes'
      precision_limits: N/A
      performance_notes: Primitive arrays are contiguous; Object arrays are pointer arrays with random heap access
    csharp:
      type_name: T[] (fixed length once allocated), Span<T>, stackalloc; InlineArray attribute (.NET 8)
      size_bytes: 24-byte header (8 object header + 8 method table + 8 length) + n * sizeof(T)
      width: fixed (after creation)
      null_support: Nullable reference; value-type elements default to zero
      primitive_or_object: heap object (reference type); stackalloc / InlineArray for stack
      de_use: Fixed buffers, Span-based parsing
      conversion_risks: Covariant reference-type arrays (ArrayTypeMismatchException); arrays over 85,000 bytes go to the Large Object Heap; bounds-checked; Length max about 2^31
      precision_limits: N/A
      performance_notes: Value-type arrays are contiguous; bounds-check elimination in simple loops
    go:
      type_name: '[N]T (array, value type, size part of the type); slices are dynamic'
      size_bytes: N * sizeof(T); [3]int and [4]int are different types
      width: fixed
      null_support: none
      primitive_or_object: value type (copied on assignment)
      de_use: Small fixed tables, hash digests ([32]byte)
      conversion_risks: Arrays are copied on assignment/pass-by-value (large arrays are costly); size is part of type so cannot be generic over N without generics tricks; bounds-checked (panic)
      precision_limits: N/A
      performance_notes: Contiguous; stack allocated when escape analysis permits
    python:
      type_name: No fixed-size array in the stdlib; tuple (fixed, immutable, heterogeneous), array.array (typed, but resizable), numpy.ndarray (fixed shape/dtype)
      size_bytes: 'tuple: 40-byte header + 8 per item; array.array(''q''): 64-byte header + 8 per int; numpy ndarray: about 112 bytes header + data'
      width: variable (tuple/list) / fixed (numpy shape)
      null_support: none (None in tuple; NaN in numpy)
      primitive_or_object: heap object; numpy packed
      de_use: Numeric columns via numpy
      conversion_risks: tuple of numbers stores pointers to int objects; array.array and numpy wrap; numpy integer overflow wraps silently in arrays; slicing numpy returns views (aliasing)
      precision_limits: numpy dtype limits
      performance_notes: numpy contiguous and vectorized; tuples/lists are pointer arrays
    javascript:
      type_name: Typed arrays (Int32Array, Float64Array, etc.) have fixed length; plain Array does not; Object.freeze to prevent mutation
      size_bytes: 'typed array: object header (tens of bytes, engine-dependent) + n * element size'
      width: fixed (typed arrays)
      null_support: none (typed arrays cannot hold null; holes in plain arrays)
      primitive_or_object: object view over ArrayBuffer
      de_use: Columnar numeric buffers
      conversion_risks: Typed array out-of-range writes are silently ignored; Int8Array writes wrap, Uint8ClampedArray clamps; length max about 2^32-1 for Array and engine-dependent for typed arrays; Array holes ([,1]) differ from undefined
      precision_limits: N/A
      performance_notes: Contiguous; no boxing; plain arrays of numbers may be optimized to unboxed SMI/double arrays by the engine
    typescript:
      type_name: Tuple types [T, U], readonly T[], typed arrays; no fixed-length array type except tuples
      size_bytes: 'typed array: object header (tens of bytes, engine-dependent) + n * element size'
      width: fixed (typed arrays)
      null_support: none (typed arrays cannot hold null; holes in plain arrays)
      primitive_or_object: object view over ArrayBuffer
      de_use: Columnar numeric buffers
      conversion_risks: ^ (tuple lengths are checked only at compile time; runtime arrays remain resizable)
      precision_limits: N/A
      performance_notes: Contiguous; no boxing; plain arrays of numbers may be optimized to unboxed SMI/double arrays by the engine
    julia:
      type_name: NTuple{N,T} (immutable, fixed), StaticArrays.SVector{N,T} (package), Array{T,N} (dimensions fixed but resizable for Vector via push!), Memory{T} (Julia 1.11+)
      size_bytes: 'unverified: N * sizeof(T) for isbits tuples inline; Array header about 40 bytes (unverified) + data'
      width: fixed
      null_support: none (Union{T,Missing})
      primitive_or_object: value type (tuple); heap (Array)
      de_use: Small fixed-size vectors (coordinates), SIMD
      conversion_risks: Tuples with many elements (> about 32) compile slowly and lose performance; 1-based indexing; out-of-bounds is an error unless @inbounds
      precision_limits: N/A
      performance_notes: Tuples and SVector are stack-allocated and unrolled
    swift:
      type_name: 'unverified: No fixed-size array in the stdlib before InlineArray (Swift 6.2: unverified); Array<T> (dynamic), tuples (homogeneous fixed size ad hoc), SIMD2/4/8 types'
      size_bytes: 'unverified: Array: 8-byte reference + heap buffer with 32-byte header (unverified); SIMD4<Float> 16 bytes'
      width: fixed (InlineArray/SIMD) / variable (Array)
      null_support: none (Optional elements)
      primitive_or_object: value type with CoW heap buffer; SIMD vectors inline
      de_use: Small fixed numeric vectors via SIMD types
      conversion_risks: Array index out of range traps (crash); tuples are not indexable by variable; InlineArray availability depends on toolchain
      precision_limits: N/A
      performance_notes: SIMD types are register-resident; Array adds a pointer hop
    kotlin:
      type_name: Array<T>, IntArray, LongArray, DoubleArray, ByteArray (JVM arrays, fixed length)
      size_bytes: 16-byte header + n * element size; Array<Int> boxes elements
      width: fixed (after creation)
      null_support: Array<T?> allows null; primitive arrays default 0
      primitive_or_object: heap object
      de_use: Fixed buffers; IntArray for columnar data
