name: ci
on:
  push:
  pull_request:
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Golden + cross-implementation tests (reference == vectorised)
        run: python -m pytest tests -q
      - name: Data-type docs are up to date
        run: python docs/data-types/build.py --check
        if: hashFiles('docs/data-types/build.py') != ''
      - name: Conformance probes (available toolchains)
        run: bash conformance/run_all.sh
        if: hashFiles('conformance/run_all.sh') != ''
  implementations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-go@v5
        with: {go-version-file: languages/go/go.mod, cache: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install declared Python dependencies and C++ toolchain
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Build every registered implementation
        run: python -m runner build
      - name: Generate clean 1k and 10k inputs and verify manifests
        run: |
          python -m generator gen --dataset A,B,C --rows 1k --out data --workers 2
          python -m generator gen --dataset A,B,C --rows 10k --out data --workers 2
          python -m generator verify data
      - name: Pin single-thread runs to an available CPU
        run: |
          python -c 'import os; print(f"SINGLE_THREAD_CPU={min(os.sched_getaffinity(0))}")' >> "$GITHUB_ENV"
      - name: Runner smoke and schema validation
        run: python -m runner run --smoke
      - name: 1k and 10k correctness for every registered operation and mode
        run: python -m runner run --rows 1k,10k --runs 1 --warmup 0 --force
      - name: Reject missing correctness coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          records = [json.loads(line) for path in Path("results/raw").glob("*.jsonl")
                     for line in path.read_text().splitlines() if line.strip()]
          assert records, "Runner produced no correctness records"
          bad = [r for r in records if r["status"] not in ("ok", "n/a")]
          assert not bad, [(r["implementation"], r["op"], r["rows"], r["status"],
                            r.get("skip_reason")) for r in bad]
          PY
